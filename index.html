<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BabyCare Center">
<meta name="theme-color" content="#FFB5B5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>BabyCare Console Center</title>
<style>
/* ============ 设计令牌 · 对应计划书 §4.1 配色方案 ============ */
:root{
  --pink:#FFB5B5; --pink-deep:#F08A8A; --pink-soft:#FFECEC; --pink-line:#FFD6D6;
  --blue:#B5D8FF; --blue-deep:#6FA8E0; --blue-soft:#EAF4FF;
  --yellow:#FFF0C2; --yellow-deep:#D9A63C; --yellow-soft:#FFF8E4;
  --green:#C8E6C9; --green-deep:#5FA463; --green-soft:#EEF7EE;
  --purple:#DCD0FF; --purple-deep:#8B79C9; --purple-soft:#F2EDFF;
  --bg:#FFF8F0; --card:#FFFFFF; --card-2:#FFFCF8;
  --text:#4A3728; --text-2:#8D7B6E; --text-3:#B9AA9D;
  --warn:#FFCC80; --warn-deep:#D98C2B; --warn-soft:#FFF3E0;
  --danger:#E57373; --danger-soft:#FDECEC;
  --line:#F2E8DE; --line-2:#EADCCF;
  --r:18px; --r-sm:12px;
  --sh:0 2px 10px rgba(74,55,40,.055);
  --sh-2:0 6px 22px rgba(74,55,40,.10);
  --ease:cubic-bezier(.32,.72,.32,1);
}
body.night{
  --pink:#C97F7F; --pink-deep:#E09A9A; --pink-soft:#4A3535; --pink-line:#5C4040;
  --blue:#6E8FB5; --blue-deep:#8FB6E0; --blue-soft:#2F3A47;
  --yellow:#5A4C2E; --yellow-deep:#E0BC6B; --yellow-soft:#443A24;
  --green:#4E6B50; --green-deep:#8CC48F; --green-soft:#2E3A2F;
  --purple:#5B5080; --purple-deep:#B0A0E0; --purple-soft:#332D45;
  --bg:#241C17; --card:#332821; --card-2:#3A2E26;
  --text:#F3E7DA; --text-2:#C0AC9B; --text-3:#8E7C6D;
  --warn:#7A5A2E; --warn-deep:#E0AE68;
  --warn-soft:#453521;
  --danger:#D96B6B; --danger-soft:#4A2E2E;
  --line:#453830; --line-2:#54453B;
  --sh:0 2px 10px rgba(0,0,0,.25);
  --sh-2:0 6px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  transition:background .3s var(--ease),color .3s var(--ease);
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
svg{display:block}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}

/* ============ 字体层级 · §4.2 ============ */
.t-h2{font-size:20px;font-weight:600;line-height:1.4}
.t-sub{font-size:14px;font-weight:400;color:var(--text-2)}
.t-tag{font-size:12px;font-weight:500;color:var(--text-2)}

/* ============ 布局骨架 ============ */
.shell{display:flex;min-height:100vh;min-height:100dvh}
.sidebar{
  width:232px;flex:none;background:var(--card);border-right:1px solid var(--line);
  padding:20px 14px;position:sticky;top:0;height:100vh;height:100dvh;
  display:flex;flex-direction:column;gap:6px;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.brand-logo{width:38px;height:38px;border-radius:12px;background:var(--pink-deep);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.brand-t{font-size:16px;font-weight:700;letter-spacing:.3px}
.brand-s{font-size:12px;color:var(--text-3)}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:14px;
  color:var(--text-2);font-size:15px;font-weight:500;transition:all .2s var(--ease);width:100%;text-align:left;
  min-width:0;
}
.nav-item > span:first-of-type{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item:hover{background:var(--bg)}
.nav-item.on{background:var(--pink-soft);color:var(--pink-deep);font-weight:600}
body.night .nav-item.on{color:var(--pink-deep)}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.sb-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--bg);
  padding:14px 22px 10px;border-bottom:1px solid transparent;transition:border-color .2s;
}
.topbar.stuck{border-bottom-color:var(--line);backdrop-filter:saturate(1.4) blur(8px)}
.content{padding:4px 22px 40px;max-width:1080px;width:100%;margin:0 auto;flex:1}

/* ============ 宝宝信息条 ============ */
.babybar{display:flex;align-items:center;gap:13px}
.avatar{
  width:52px;height:52px;border-radius:50%;flex:none;overflow:hidden;
  background:var(--pink-soft);
  display:flex;align-items:center;justify-content:center;border:2.5px solid var(--card);box-shadow:var(--sh);
}
.avatar img{width:100%;height:100%;object-fit:cover}
.babybar-info{min-width:0;flex:1}
.babybar-name{font-size:19px;font-weight:700;display:flex;align-items:center;gap:7px}
.babybar-sub{font-size:13px;color:var(--text-2);margin-top:1px}
.icon-btn{
  width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  color:var(--text-2);background:var(--card);border:1px solid var(--line);transition:all .2s var(--ease);flex:none;
}
.icon-btn:hover{background:var(--pink-soft);color:var(--pink-deep);border-color:var(--pink-line)}
.icon-btn.plain{background:transparent;border-color:transparent}

/* ============ 卡片 ============ */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);border:1px solid var(--line);margin-bottom:14px}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.card-h .t{font-size:17px;font-weight:600;flex:1;min-width:0}
.card-h .x{font-size:13px;color:var(--text-3);font-weight:400}
.chip-ico{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}

.sec-title{font-size:14px;font-weight:600;color:var(--text-2);margin:22px 2px 10px;display:flex;align-items:center;gap:7px}

/* ============ 今天要处理 · 铁律5 ============ */
.today-card{
  background:linear-gradient(160deg,var(--yellow-soft),var(--card) 60%);
  border:1.5px solid var(--yellow); border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh);
}
.today-card.clear{background:linear-gradient(160deg,var(--green-soft),var(--card) 60%);border-color:var(--green)}
.todo{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;background:var(--card);
  border:1px solid var(--line);margin-top:9px;
}
.todo.od{border-color:var(--danger);background:var(--danger-soft)}
.todo-ico{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.todo-b{flex:1;min-width:0}
.todo-t{font-size:15px;font-weight:600;line-height:1.3}
.todo-s{font-size:12.5px;color:var(--text-2);margin-top:2px}
.todo.od .todo-s{color:var(--danger)}
.todo-act{
  flex:none;min-height:36px;padding:0 14px;border-radius:11px;background:var(--pink);color:#5C3A3A;
  font-size:13.5px;font-weight:600;display:flex;align-items:center;transition:all .2s var(--ease);
}
.todo-act:hover{background:var(--pink-deep);color:#fff}
.todo.od .todo-act{background:var(--danger);color:#fff}
body.night .todo-act{color:#2B211B}

/* ============ 快速记录大按钮 · §4.4 ============ */
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.quick-grid.qg5{grid-template-columns:repeat(5,1fr)}
.quick-btn{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 8px 13px;display:flex;flex-direction:column;align-items:center;gap:8px;
  min-height:92px;justify-content:center;transition:all .22s var(--ease);box-shadow:var(--sh);
}
.quick-btn:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.quick-btn:active{transform:scale(.97)}
.quick-ico{width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.quick-t{font-size:13.5px;font-weight:600}
.quick-s{font-size:11px;color:var(--text-3);margin-top:-4px}

/* ============ 统计小格 ============ */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 12px;box-shadow:var(--sh)}
.stat-v{font-size:22px;font-weight:700;line-height:1.15;letter-spacing:-.5px}
.stat-l{font-size:12px;color:var(--text-2);margin-top:3px}
.stat-d{font-size:11px;margin-top:4px;font-weight:500}

/* ============ 时间轴 ============ */
.tl{position:relative;padding-left:34px}
.tl:before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:1px}
.tl-item{position:relative;margin-bottom:11px}
.tl-dot{position:absolute;left:-34px;top:11px;width:32px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center;border:3px solid var(--card)}
.tl-body{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;align-items:flex-start;gap:10px}
.tl-main{flex:1;min-width:0}
.tl-t{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tl-s{font-size:12.5px;color:var(--text-2);margin-top:2px;word-break:break-all}
.tl-time{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;flex:none;padding-top:2px}
.tl-del{flex:none;align-self:center;width:30px;height:30px;margin-left:2px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text-3);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tl-del:active{background:var(--danger-soft);color:var(--danger)}
.tl-day{font-size:12.5px;font-weight:600;color:var(--text-2);margin:16px 0 9px -34px;padding-left:34px}

/* ============ 标签 ============ */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2.5px 8px;border-radius:8px;line-height:1.5}
.tag.pink{background:var(--pink-soft);color:var(--pink-deep)}
.tag.blue{background:var(--blue-soft);color:var(--blue-deep)}
.tag.green{background:var(--green-soft);color:var(--green-deep)}
.tag.yellow{background:var(--yellow-soft);color:var(--yellow-deep)}
.tag.warn{background:var(--warn-soft);color:var(--warn-deep)}
.tag.red{background:var(--danger-soft);color:var(--danger)}
.tag.purple{background:var(--purple-soft);color:var(--purple-deep)}
.tag.gray{background:var(--bg);color:var(--text-3)}

/* ============ 按钮 ============ */
.btn{
  min-height:46px;padding:0 18px;border-radius:14px;font-size:15px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:all .2s var(--ease);
  background:var(--card);border:1px solid var(--line-2);color:var(--text);
}
.btn:hover{background:var(--bg)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pink);border-color:var(--pink);color:#5C3A3A}
.btn.pri:hover{background:var(--pink-deep);color:#fff}
body.night .btn.pri{color:#2B211B}
.btn.ok{background:var(--green);border-color:var(--green);color:#2F5231}
body.night .btn.ok{color:#1F2E20}
.btn.ghost{background:transparent;border-color:var(--line-2)}
.btn.danger{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.btn.danger-lite{background:transparent;border:1px dashed var(--danger);color:var(--danger);width:100%;font-weight:600}
.btn.danger-lite:hover{background:var(--danger-soft)}
.btn.sm{min-height:38px;padding:0 13px;font-size:13.5px;border-radius:11px}
.sync-sep{display:flex;align-items:center;gap:12px;margin:16px 0 10px;color:var(--text-3);font-size:12px;font-weight:600;letter-spacing:.3px}
.sync-sep:before,.sync-sep:after{content:"";flex:1;height:1px;background:var(--line)}
.btn.blk{width:100%}
/* ============ 云端数据可视化 ============ */
.cv-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cv-status{font-size:12.5px;padding:4px 11px;border-radius:999px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.cv-status .dot{width:8px;height:8px;border-radius:50%}
.cv-status.idle{background:var(--bg);color:var(--text-3)} .cv-status.idle .dot{background:var(--text-3)}
.cv-status.ok{background:var(--green-soft,#E7F8EF);color:var(--green-deep,#19b36b)} .cv-status.ok .dot{background:var(--green-deep,#19b36b)}
.cv-status.err{background:var(--pink-soft);color:var(--pink-deep)} .cv-status.err .dot{background:var(--pink-deep)}
.cv-status.sync{background:var(--blue-soft);color:var(--blue-deep)} .cv-status.sync .dot{background:var(--blue-deep);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.cv-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.cv-stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.cv-stat .n{font-size:24px;font-weight:800;letter-spacing:-.5px}
.cv-stat .l{font-size:12px;color:var(--text-3);margin-top:2px}
.cv-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.cv-sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.cv-sec>.head{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none}
.cv-sec .t{font-weight:700;font-size:15px}
.cv-sec .c{font-size:12px;color:var(--text-3);background:var(--bg);padding:2px 9px;border-radius:999px;font-weight:600}
.cv-sec .chev{margin-left:auto;color:var(--text-3);transition:.2s}
.cv-sec.open>.head .chev{transform:rotate(180deg)}
.cv-sec .body{display:none;padding:0 16px 16px}
.cv-sec.open .body{display:block}
.cv-tbl-scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:320px}
.cv-tbl-scroll table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
.cv-tbl-scroll th,.cv-tbl-scroll td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.cv-tbl-scroll th{position:sticky;top:0;background:var(--bg);color:var(--text-3);font-weight:700;z-index:1}
.cv-tbl-scroll tr:last-child td{border-bottom:none}
.cv-chart-wrap{padding:6px 0 4px}
.chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:2px -2px 0;padding-bottom:2px}
.chart-scroll svg{display:block}
.chart-scroll::-webkit-scrollbar{height:6px}
.chart-scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
.stat-filters{display:flex;flex-wrap:wrap;gap:10px;margin:0 14px 14px}
.stat-sel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 8px}
.stat-sel>span{white-space:nowrap}
.stat-sel>select{font-size:13px;padding:4px 6px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--text);max-width:160px}
.stat-sel>select:focus{outline:none;border-color:var(--purple-deep)}
.cv-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-3);margin-top:6px}
.cv-legend span{display:inline-flex;align-items:center;gap:6px}
.cv-legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
@media(max-width:760px){.cv-cards{grid-template-columns:repeat(2,1fr)}}
.btn:disabled{opacity:.45;pointer-events:none}

/* ============ 表单 ============ */
.field{margin-bottom:14px}
.label{font-size:13.5px;font-weight:600;color:var(--text-2);margin-bottom:7px;display:block}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-of-type{border-bottom:none}
.kv>span{font-size:13.5px;color:var(--text-2);flex:none}
.kv>b{font-size:15px;font-weight:600;color:var(--text);text-align:right}
.inp,textarea.inp,select.inp{
  width:100%;min-height:48px;padding:11px 13px;border-radius:13px;border:1.5px solid var(--line-2);
  background:var(--card);outline:none;transition:border-color .2s;font-size:16px;
}
.inp:focus{border-color:var(--pink)}
textarea.inp{min-height:76px;resize:vertical;line-height:1.5}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238D7B6E' stroke-width='2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:38px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{
  min-height:44px;padding:0 15px;border-radius:13px;border:1.5px solid var(--line-2);background:var(--card);
  font-size:14.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:all .18s var(--ease);
}
.opt:hover{border-color:var(--pink-line)}
.opt.on{background:var(--pink-soft);border-color:var(--pink);color:var(--pink-deep);font-weight:600}
.opt.on.blue{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-deep)}
.opt.on.green{background:var(--green-soft);border-color:var(--green);color:var(--green-deep)}

.bigopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bigopt{
  border:1.5px solid var(--line-2);background:var(--card);border-radius:16px;padding:14px 6px;
  display:flex;flex-direction:column;align-items:center;gap:7px;min-height:92px;justify-content:center;transition:all .2s var(--ease);
}
.bigopt:hover{border-color:var(--pink-line)}
.bigopt.on{border-color:var(--pink);background:var(--pink-soft)}
.bigopt-t{font-size:13.5px;font-weight:600}

.colors{display:flex;gap:9px;flex-wrap:wrap}
.color{width:52px;display:flex;flex-direction:column;align-items:center;gap:5px}
.color-sw{width:44px;height:44px;border-radius:14px;border:2.5px solid transparent;transition:all .18s}
.color.on .color-sw{border-color:var(--text);transform:scale(1.06)}
.color-l{font-size:11px;color:var(--text-2)}

/* ============ 底部弹出面板 ============ */
.mask{position:fixed;inset:0;background:rgba(60,44,32,.42);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s var(--ease);backdrop-filter:blur(2px)}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:560px;z-index:91;
  background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -8px 40px rgba(74,55,40,.16);
  max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;transition:transform .3s var(--ease);
}
.sheet.on{transform:translate(-50%,0)}
.sheet-h{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex:none;position:relative}
.sheet-h:before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:2px;background:var(--line-2)}
.sheet-t{font-size:18px;font-weight:700;flex:1;min-width:0;padding-top:4px}
.sheet-b{padding:16px 18px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet-f{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;flex:none}
.sheet-f .btn{flex:1}

/* ============ FAB ============ */
.fab{
  position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:60;
  width:60px;height:60px;border-radius:22px;background:var(--pink-deep);
  color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(240,138,138,.42);
  transition:transform .2s var(--ease);
}
.fab:active{transform:scale(.93)}

/* ============ 底部导航（移动端） ============ */
.tabbar{display:none}
.mnv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mnv{
  border:1.5px solid var(--line-2);background:var(--card);border-radius:16px;padding:14px 6px;
  display:flex;flex-direction:column;align-items:center;gap:7px;min-height:92px;justify-content:center;
  position:relative;transition:all .2s var(--ease);
}
.mnv:hover{border-color:var(--pink-line)}
.mnv.on{border-color:var(--pink);background:var(--pink-soft)}
.mnv-t{font-size:13.5px;font-weight:600}
.mnv.on .mnv-t{color:var(--pink-deep)}
.mnv .mnv-b{position:absolute;top:8px;right:10px;margin-left:0}
.mus-ctl{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:14px}
.mus-play{width:64px;height:64px;border-radius:50%;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;border:none;box-shadow:var(--sh-2);transition:transform .15s var(--ease)}
.mus-play:active{transform:scale(.94)}
.mus-ctl-b{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--card);color:var(--text-2);display:flex;align-items:center;justify-content:center}
.mus-ctl-b:disabled{opacity:.4}
.mus-now{background:var(--bg);border-radius:14px;padding:12px 14px}
.mus-name{font-weight:700;font-size:15px;margin-bottom:8px;word-break:break-all}
.mus-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.mus-bar-in{height:100%;width:0;background:var(--pink-deep);border-radius:2px;transition:width .3s linear}
.mus-time{font-size:11.5px;color:var(--text-3);margin-top:6px;text-align:right}
.mus-list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.mus-row{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1.5px solid var(--line-2);border-radius:13px;background:var(--card);cursor:pointer}
.mus-row.on{border-color:var(--pink);background:var(--pink-soft)}
.mus-row .mus-i{flex:none;color:var(--pink-deep);display:flex}
.mus-row .mus-n{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mus-row .mus-d{flex:none;font-size:11.5px;color:var(--text-3)}
.mus-x{flex:none;width:30px;height:30px;border-radius:9px;border:none;background:transparent;color:var(--text-3);display:flex;align-items:center;justify-content:center}

/* ============ Toast ============ */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);z-index:120;
  background:rgba(58,44,34,.94);color:#fff;padding:11px 20px;border-radius:14px;font-size:14.5px;font-weight:500;
  opacity:0;pointer-events:none;transition:all .28s var(--ease);max-width:82vw;text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.2)
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ============ 空状态 ============ */
.empty{text-align:center;padding:34px 16px;color:var(--text-3)}
.empty-t{font-size:14.5px;margin-top:10px}

/* ============ 段落切换 ============ */
.segs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:14px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.segs::-webkit-scrollbar{display:none}
.seg{flex:1;min-width:max-content;min-height:38px;padding:0 14px;border-radius:11px;font-size:14px;font-weight:600;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s var(--ease);white-space:nowrap}
.seg.on{background:var(--card);color:var(--text);box-shadow:var(--sh)}

/* ============ 提示卡 ============ */
.note{border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.6;display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.note-i{flex:none;margin-top:1px}
.note.warm{background:var(--yellow-soft);color:var(--yellow-deep);border:1px solid var(--yellow)}
.note.info{background:var(--blue-soft);color:var(--blue-deep);border:1px solid var(--blue)}
.note.alert{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger)}
.note.good{background:var(--green-soft);color:var(--green-deep);border:1px solid var(--green)}
.note b{font-weight:700}

/* ============ 列表项 ============ */
.li{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li-b{flex:1;min-width:0}
.li-t{font-size:15px;font-weight:600}
.li-s{font-size:12.5px;color:var(--text-2);margin-top:2px}

/* ============ 热力图 ============ */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat-c{aspect-ratio:1;border-radius:7px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-3)}
.heat-l{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.heat-l span{text-align:center;font-size:11px;color:var(--text-3)}

/* ============ 进度环 / 条 ============ */
.bar{height:8px;border-radius:5px;background:var(--bg);overflow:hidden}
.bar-f{height:100%;border-radius:5px;transition:width .4s var(--ease)}

/* ============ 开关 ============ */
.sw{width:50px;height:30px;border-radius:15px;background:var(--line-2);position:relative;transition:background .25s var(--ease);flex:none}
.sw.on{background:var(--green-deep)}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.sw.on:after{transform:translateX(20px)}

/* ============ 计时器 ============ */
.timer{text-align:center;padding:14px 0}
.timer-v{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.1}
.timer-l{font-size:13px;color:var(--text-2);margin-top:3px}
.timer-sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.timer-side{border:1.5px solid var(--line-2);border-radius:15px;padding:12px 8px;text-align:center;transition:all .2s var(--ease)}
.timer-side.on{border-color:var(--pink);background:var(--pink-soft)}
.timer-side-t{font-size:13px;font-weight:600;color:var(--text-2)}
.timer-side-v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}

/* ============ 婴儿身体示意图 ============ */
.bodymap{display:flex;justify-content:center;padding:6px 0}
.bp{cursor:pointer;transition:all .2s var(--ease)}
.bp:hover{opacity:.8}

/* ============ 图表容器 ============ */
.chart-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;justify-content:center}
.legend-i{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-2)}
.legend-d{width:14px;height:3px;border-radius:2px}
.sleep-live{display:none;align-items:center;gap:9px;height:40px;padding:0 14px;background:var(--purple-soft);color:var(--purple-deep);font-size:13px;font-weight:600;cursor:pointer;border-bottom:1px solid var(--line)}
.sleep-live.on{display:flex;position:sticky;top:52px;z-index:39}
.sleep-live .sl-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sleep-live .sl-t b{font-variant-numeric:tabular-nums}
.tl-bar{position:relative;height:38px;background:var(--bg);border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:12px}
.tl-bar .tb-seg{position:absolute;top:6px;bottom:6px;border-radius:5px;min-width:2px}
.tl-bar .tb-tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.7}
.tl-bar .tb-h{position:absolute;bottom:1px;transform:translateX(-50%);font-size:9px;color:var(--text-3);font-variant-numeric:tabular-nums}

/* ============ 宝妈 Care 模块（内部代号 mom） ============ */
.mom-live{display:flex;align-items:center;gap:9px;height:44px;padding:0 14px;background:var(--pink-soft);color:var(--pink-deep);font-size:13px;font-weight:600;cursor:pointer;border-bottom:1px solid var(--line)}
.mom-live.on{display:flex;position:sticky;top:52px;z-index:39}
.mom-live .ml-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mom-live .ml-t b{font-variant-numeric:tabular-nums}
/* ② 安全红线 · 危重卡（emergency） */
.mom-crit{background:var(--danger);border-radius:var(--r);padding:16px 16px 14px;margin-bottom:14px;color:#fff;box-shadow:0 4px 16px rgba(229,115,115,.32)}
.mom-crit-h{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700;margin-bottom:9px}
.mom-crit-h .mc-ico{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.mom-crit-p{font-size:13.5px;line-height:1.65;margin:0 0 11px;opacity:.96}
.mom-crit-li{display:flex;gap:8px;font-size:14px;font-weight:600;line-height:1.6;margin-bottom:7px}
.mom-crit-li .mc-d{flex:none;opacity:.85}
.mom-crit-warn{font-size:15px;font-weight:700;line-height:1.6;background:rgba(255,255,255,.18);border-radius:11px;padding:9px 12px;margin:11px 0}
.mom-crit-act{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.mom-crit-act .btn{background:#fff;border-color:#fff;color:var(--danger);min-height:50px;font-weight:700}
.mom-crit-foot{font-size:11.5px;line-height:1.55;margin-top:11px;opacity:.85}
body.night .mom-crit{background:var(--danger-soft);border:1.5px solid var(--danger);color:#FFD9D9;box-shadow:none}
body.night .mom-crit-act .btn{background:transparent;border-color:var(--danger);color:#FFD9D9}
/* ③ 安全红线 · 警告条（refer）—— 仅收展行为，视觉复用 .note.warm */
.mom-ref{margin-bottom:12px}
.mom-ref .note{margin-bottom:0}
.mom-ref-t{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:44px}
.mom-ref-t .mr-txt{flex:1;min-width:0;font-weight:600;line-height:1.4}
.mom-ref-t .mr-cv{flex:none;transition:transform .2s var(--ease)}
.mom-ref.on .mr-cv{transform:rotate(180deg)}
.mom-ref-b{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed currentColor;opacity:.92}
.mom-ref.on .mom-ref-b{display:block}
/* ④ 闸门理由清单（exerciseGuard / dietGuard 的 blocked reasons 必须可见，SPEC-B1 §7.2 ④）
   🔴 严禁静默丢行：这里是「运动为什么没了」的唯一出口，样式只为可读，不承载语义。 */
.mg-li{font-size:13px;line-height:1.7}
.mg-li + .mg-li{margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
.mom-adjust{margin-bottom:12px}
.mom-adjust-t{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;background:var(--blue-soft);color:var(--blue-deep);border:1px solid var(--blue);border-radius:14px;font-size:13.5px;font-weight:600;cursor:pointer}
.mom-adjust-t .ma-txt{flex:1;min-width:0}
.mom-adjust-t .ma-cv{flex:none;transition:transform .2s var(--ease)}
.mom-adjust.on .ma-cv{transform:rotate(180deg)}
.mom-adjust.on .mom-adjust-t{border-radius:14px 14px 0 0}
.mom-adjust-b{display:none;background:var(--card);border:1px solid var(--blue);border-top:0;border-radius:0 0 14px 14px;padding:13px 14px}
.mom-adjust.on .mom-adjust-b{display:block}
.mom-adjust-it{margin-bottom:13px}
.mom-adjust-it:last-of-type{margin-bottom:0}
.mom-adjust-it .mai-h{font-size:13.5px;font-weight:600;line-height:1.5}
.mom-adjust-it .mai-w{font-size:12.5px;color:var(--text-2);line-height:1.6;margin-top:4px}
.mom-adjust-end{font-size:12.5px;color:var(--text-3);line-height:1.6;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.mom-plan{display:flex;flex-direction:column;gap:11px}
.mom-plan-item{background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 13px 12px}
.mom-plan-item.done{background:var(--green-soft);border-color:var(--green)}
.mom-plan-item.locked{opacity:.72}
.mom-plan-item.locked .mom-plan-cta{background:var(--bg);border-color:var(--line);color:var(--text-3);pointer-events:none}
.mom-plan-t{font-size:15.5px;font-weight:600;line-height:1.35;display:flex;align-items:center;gap:7px}
.mom-plan-w{font-size:13px;color:var(--text-2);line-height:1.6;margin-top:5px}
.mom-plan-cta{width:100%;min-height:48px;margin-top:11px;border-radius:12px;background:var(--pink);border:1px solid var(--pink);color:#5C3A3A;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .18s var(--ease)}
.mom-plan-cta:active{transform:scale(.98)}
.mom-plan-item.done .mom-plan-cta{background:var(--green);border-color:var(--green);color:#2F5231}
body.night .mom-plan-cta,body.night .mom-plan-item.done .mom-plan-cta{color:#2B211B}
.mom-dur{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mom-dur .seg{min-height:44px;padding:0 6px;font-size:13.5px;background:var(--card);border:1px solid var(--line-2)}
.mom-dur .seg.on{background:var(--pink-soft);border-color:var(--pink);color:var(--pink-deep);box-shadow:none}
.mom-plan-fallback{font-size:12.5px;color:var(--text-2);line-height:1.6;padding:9px 12px;background:var(--bg);border-radius:11px}
.mom-done{display:flex;flex-direction:column;gap:8px}
.mom-done-item{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:52px}
.mom-done-ck{flex:none;width:30px;height:30px;border-radius:50%;background:var(--green-soft);color:var(--green-deep);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s var(--ease)}
.mom-done-ck:active{background:var(--bg);color:var(--text-3)}
.mom-done-b{flex:1;min-width:0}
.mom-done-t{font-size:14.5px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mom-done-s{font-size:12px;color:var(--text-3);margin-top:2px;font-variant-numeric:tabular-nums}
.mom-q{margin-bottom:17px}
.mom-q:last-of-type{margin-bottom:12px}
.mom-q-t{font-size:14.5px;font-weight:600;margin-bottom:9px;line-height:1.4}
.mom-q-t .mq-sub{font-size:12px;color:var(--text-3);font-weight:400;margin-left:5px}
.mom-opts{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.mom-opts.g2{grid-template-columns:repeat(3,1fr)}
.mom-opt{min-height:52px;border-radius:12px;background:var(--card);border:1px solid var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--text-2);padding:4px 2px;transition:all .16s var(--ease)}
.mom-opt:active{transform:scale(.96)}
.mom-opt.on{background:var(--pink-soft);border-color:var(--pink);color:var(--pink-deep)}
.mom-opt.g2{min-height:48px;font-size:13px;flex-direction:row;gap:0}
.mom-opt-emo{width:14px;height:14px;border-radius:50%;flex:none}
.mom-skip{display:block;width:100%;text-align:center;font-size:13px;color:var(--text-3);padding:11px 0 2px;cursor:pointer}
.mom-care-note{font-size:12.5px;line-height:1.65;background:var(--blue-soft);border:1px solid var(--blue);color:var(--blue-deep);border-radius:12px;padding:11px 13px;margin-top:11px}
.mom-state-sum{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.mom-state-sum .tag{font-size:12px;padding:4px 10px}
.mom-disc{font-size:11.5px;color:var(--text-3);line-height:1.65;text-align:center;padding:18px 8px 8px;border-top:1px solid var(--line);margin-top:22px}


/* ============ 移动端适配 · 铁律4 ============ */
@media (max-width:900px){
  .sidebar{display:none}
  .content{padding:2px 14px 120px}
  .topbar{padding:12px 14px 8px}
  .quick-grid{grid-template-columns:repeat(4,1fr);gap:8px}
  .quick-btn{padding:12px 4px 10px;min-height:86px}
  .quick-ico{width:40px;height:40px;border-radius:14px}
  .quick-t{font-size:12.5px}
  .quick-s{display:none}
  .quick-grid.qg5{grid-template-columns:repeat(5,1fr);gap:7px}
  .quick-grid.qg5 .quick-btn{padding:12px 3px 10px;min-height:86px}
  .quick-grid.qg5 .quick-ico{width:38px;height:38px;border-radius:13px}
  .quick-grid.qg5 .quick-t{font-size:12px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .row2{grid-template-columns:1fr}
  .row2.keep{grid-template-columns:1fr 1fr}
  .bigopts{grid-template-columns:repeat(3,1fr);gap:8px}
  .sheet{max-width:none;border-radius:22px 22px 0 0}
  .fab{bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:20px}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--card);
    border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 14px rgba(74,55,40,.07);
  }
  .tab{
    flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--text-3);font-size:10.5px;font-weight:600;border-radius:12px;transition:color .2s;position:relative;
    min-width:0;padding:0 4px;
  }
  .tab > span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.15}
  .tab.on{color:var(--pink-deep)}
  .tab-badge{position:absolute;top:4px;right:calc(50% - 20px);background:var(--danger);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .toast{bottom:130px}
  .tl{padding-left:30px}
  .tl:before{left:13px}
  .tl-dot{left:-30px;width:28px;height:28px;border-radius:10px}
  .tl-day{margin-left:-30px;padding-left:30px}
  .mom-live{height:46px;padding:0 14px;font-size:12.5px}
  .mom-live.on{top:50px}
  .mom-crit{padding:14px 14px 12px}
  .mom-crit-h{font-size:17px}
  .mom-crit-warn{font-size:14px}
  .mom-plan-t{font-size:15px}
  .mom-plan-cta{min-height:50px}
  .mom-opts{grid-template-columns:repeat(5,1fr);gap:6px}
  .mom-opts.g2{grid-template-columns:repeat(3,1fr);gap:6px}
  .mom-opt{min-height:54px;font-size:12px}
  .mom-done-t{font-size:14px}
  .mom-adjust-b{padding:12px 13px}
}
@media (max-width:380px){
  .quick-t{font-size:11.5px}
  .quick-grid.qg5 .quick-t{font-size:11.5px}
  .bigopt{min-height:84px;padding:11px 3px}
  .bigopt-t{font-size:12.5px}
  .mom-opts{gap:5px}
  .mom-opt{min-height:52px;font-size:11.5px;padding:3px 1px}
  .mom-opts.g2 .mom-opt{font-size:12px}
  .mom-plan-t{font-size:14.5px}
  .mom-crit-h{font-size:16px}
  .mom-crit-li{font-size:13.5px}
}
@media print{.sidebar,.tabbar,.fab,.topbar{display:none}}
/* ============ §3.10 AI 育儿问答 ============ */
.chat{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px}
body.night .chat{background:#2e241e;border-color:#423528}
.chat-box{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px;max-height:56vh;min-height:300px}
.chat-row{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.chat-row.me{justify-content:flex-end}
.chat-ava{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--purple-soft);color:var(--purple-deep)}
body.night .chat-ava{background:#3c2f47;color:#e3d4f5}
.chat-bubble{max-width:78%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.65;word-break:break-word}
.chat-row.me .chat-bubble{background:var(--pink-deep);color:#fff;border-bottom-right-radius:5px}
.chat-row.ai .chat-bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;color:var(--text)}
body.night .chat-row.ai .chat-bubble{background:#3a2e26;border-color:#4d3e33;color:#f3e9df}
.chat-src{font-size:12px;color:var(--text-3);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);line-height:1.5}
.chat-emerg{background:#ffe9e9;border:1px solid #ffb3b3;color:#b3261e;padding:10px 12px;border-radius:12px;font-size:13.5px;line-height:1.6}
body.night .chat-emerg{background:#3a2222;border-color:#5a3333;color:#ffb4b4}
.chat-disc{font-size:11.5px;color:var(--text-3);text-align:center;padding:9px 14px;line-height:1.55;border-top:1px solid var(--line);background:var(--bg)}
body.night .chat-disc{background:#241c17}
.chat-quick{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px 2px}
.chat-chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--text-2);cursor:pointer}
.chat-chip:active{background:var(--pink-soft)}
body.night .chat-chip{background:#2e241e;border-color:#423528;color:#e8dccf}
.chat-input{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-end;position:sticky;bottom:0;background:#fff}
body.night .chat-input{background:#2e241e;border-color:#423528}
.chat-input textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-size:16px;font-family:inherit;min-height:44px;max-height:120px;line-height:1.5;color:var(--text);background:#fff}
body.night .chat-input textarea{background:#3a2e26;border-color:#4d3e33;color:#f3e9df}
.chat-input button{flex:0 0 auto;width:44px;height:44px;border-radius:14px;background:var(--pink-deep);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.chat-imgbtn{background:#efe7df!important;color:var(--text-3)!important}
.chat-typ{display:inline-flex;gap:3px;vertical-align:middle}
.chat-typ i{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:blink 1.1s infinite}
.chat-typ i:nth-child(2){animation-delay:.18s}
.chat-typ i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.sk{background:var(--bg);border-radius:6px}
@media (prefers-reduced-motion: reduce){
  .chat-typ i{animation:none;opacity:.6}
  .edu-fade{animation:none!important}
}
.edu-fade{animation:eduFade .2s var(--ease) both}
@keyframes eduFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
button,a,input,select,textarea,.btn,.tab,.nav-item,.quick-btn,.bigopt,.li{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.sync-mini{display:none}
@media (max-width:900px){ .sync-mini{display:inline-flex;align-items:center;margin-left:auto;margin-right:6px} }
.install-bar{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:95;background:var(--pink-deep);color:#fff;border-radius:16px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(240,138,138,.4);font-size:13px}
.install-bar.show{display:flex;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.install-bar .ib-txt{flex:1;line-height:1.4}
.install-bar .ib-btn{background:#fff;color:var(--pink-deep);border:none;border-radius:10px;padding:7px 13px;font-weight:700;font-size:13px;white-space:nowrap}
.install-bar .ib-x{background:rgba(255,255,255,.35);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:15px;line-height:1;flex:0 0 auto}
.ptr{position:fixed;top:0;left:0;right:0;z-index:80;text-align:center;color:var(--pink-deep);font-size:12px;font-weight:600;padding-top:8px;height:48px;transform:translateY(-60px);transition:transform .2s;pointer-events:none}
.ptr.show{transform:translateY(0)}

/* ============ 内置使用手册（离线文档）· 作用域隔离，避免污染应用样式 ============ */
.manual{max-width:880px;margin:0 auto;padding:22px 16px 96px;color:var(--text)}
.manual .hero{background:var(--pink-soft);border:1px solid var(--line);border-radius:20px;padding:28px 24px;margin-bottom:22px}
.manual .hero .badge{display:inline-block;font-size:12px;color:var(--purple-deep);background:var(--card);border:1px solid var(--purple-line,#e6dcff);border-radius:999px;padding:3px 12px;margin-bottom:12px}
.manual .hero h1{margin:0 0 8px;font-size:26px;letter-spacing:.5px;color:var(--text)}
.manual .hero p{margin:0;color:var(--text-2);font-size:14.5px;line-height:1.7}
.manual .meta{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.manual .meta span{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--text-2)}
.manual h2{font-size:19px;margin:34px 0 12px;padding-left:12px;border-left:4px solid var(--pink-deep);scroll-margin-top:84px;color:var(--text)}
.manual h3{font-size:15.5px;margin:20px 0 8px;color:var(--purple-deep)}
.manual p,.manual li{font-size:14px;color:var(--text);line-height:1.75}
.manual .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.manual .note{display:block;background:var(--pink-soft);border:1px solid var(--pink-line,#ffd9e3);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:13.5px;color:var(--pink-deep);line-height:1.7}
.manual .note.blue{background:var(--blue-soft);border-color:var(--blue-line,#d4e6ff);color:var(--blue-deep)}
.manual .note.warn{background:var(--warn-soft);border-color:var(--warn-line,#ffe2c4);color:var(--warn-deep)}
.manual .note b{font-weight:700}
.manual .kbd{display:inline-block;background:var(--purple-soft);border:1px solid var(--purple-line,#e3d9ee);border-radius:6px;padding:1px 8px;font-size:12.5px;color:var(--purple-deep);font-weight:600}
.manual table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.manual th,.manual td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.manual th{background:var(--card-2);color:var(--text-2);font-weight:600}
.manual ol,.manual ul{padding-left:22px}
.manual li{margin:4px 0}
.manual .steps{counter-reset:s;list-style:none;padding-left:0}
.manual .steps li{position:relative;padding:8px 0 8px 40px;counter-increment:s}
.manual .steps li:before{content:counter(s);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--purple-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.manual .toc{columns:2;column-gap:24px}
.manual .toc a{display:block;color:var(--purple-deep);text-decoration:none;font-size:13.5px;padding:3px 0}
.manual .toc a:hover{text-decoration:underline}
.manual .pill{display:inline-block;font-size:11.5px;background:var(--purple-soft);color:var(--purple-deep);border-radius:6px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.manual .tag{font-size:11px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--text-3);margin-right:5px}
.manual footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--text-3);font-size:12px;text-align:center}
@media (max-width:560px){ .manual .toc{columns:1} .manual .hero h1{font-size:22px} }
@media print{ .manual{background:#fff} .manual .hero{background:#fff;border:2px solid var(--pink-deep)} .manual .card,.manual .note{break-inside:avoid} .manual h2{break-after:avoid} }
</style>
</head>
<body>
<div class="shell">
  <!-- 侧边导航（PC） -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" id="brandLogo"></div>
      <div>
        <div class="brand-t">BabyCare Console Center</div>
        <div class="brand-s">Baby Care Console</div>
      </div>
    </div>
    <nav id="navPC"></nav>
    <div class="sb-foot">
      <button class="nav-item" onclick="go('settings')" id="navSet"></button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar" id="topbar">
      <div class="babybar">
        <button class="avatar" id="avatarBtn" title="点击更换头像"></button>
        <div class="babybar-info">
          <div class="babybar-name" id="babyName"></div>
          <div class="babybar-sub" id="babySub"></div>
        </div>
        <span id="syncMini" class="sync-mini" title="点击立即同步" onclick="cloudSyncNow()"></span>
        <button class="icon-btn" id="helpBtn" onclick="go('help')" title="使用手册"></button>
        <button class="icon-btn" id="nightBtn" title="夜间模式"></button>
        <button class="icon-btn" onclick="go('settings')" title="设置"></button>
      </div>
    </header>
    <div class="sleep-live" id="sleepLive" onclick="go('sleep')"></div>
    <main class="content" id="view"></main>
  </div>
</div>

<!-- 底部导航（移动端） -->
<nav class="tabbar" id="tabbar"></nav>

<button class="fab" id="fab" title="快速记录"></button>
<!-- 摇篮曲播放器：常驻元素放 view 容器外，切视图 / 换路由不打断播放 -->
<audio id="musAudio" style="display:none"></audio>

<div class="mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-h">
    <div class="sheet-t" id="sheetT"></div>
    <button class="icon-btn plain" onclick="closeSheet()" id="sheetX"></button>
  </div>
  <div class="sheet-b" id="sheetB"></div>
  <div class="sheet-f" id="sheetF"></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json" style="display:none">
<input type="file" id="imgIn" accept="image/*" style="display:none">

/* ============ 云同步层（口令式房间共享 · 自建后端）============
   每台设备仍用 localStorage 作离线兜底；启用云同步后，每次保存同时
   把该表 push 到云端，启动时/手动/定时拉取云端最新。家人填同一个
   "房间口令"即可共享同一份宝宝的数据。
   云同步后端为自建 PostgREST 接口（见 CLOUD_BACKEND，默认为空，需自行部署并填写）。 */
let S={};
const CLOUD_BACKEND={url:'',anonKey:''}; // 自行填写你的 PostgREST 服务地址与 anon key；留空则仅本地使用
let CLOUD=(function(){
  let c=DB.get('cloud',null);
  if(!c){return {enabled:false,room:'',url:CLOUD_BACKEND.url,anonKey:CLOUD_BACKEND.anonKey,lastSync:0};}
  let changed=false;
  if(!c.url){c.url=CLOUD_BACKEND.url;c.anonKey=CLOUD_BACKEND.anonKey;changed=true;}
  if(!c.anonKey){c.anonKey=CLOUD_BACKEND.anonKey;changed=true;}
  if(changed)DB.set('cloud',c);
  return c;
})();
function saveCloud(){DB.set('cloud',CLOUD);}
function cloudReady(){return !!(CLOUD.enabled&&CLOUD.url&&CLOUD.anonKey&&CLOUD.room);}
function cloudHeaders(){return {'apikey':CLOUD.anonKey,'Authorization':'Bearer '+CLOUD.anonKey,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'};}
function tableId(t){return CLOUD.room+':'+t;}
function cloudUrl(){return (CLOUD.url||'').replace(/\/+$/,'')+'/rest/v1/baby_records';}
const SYNC_EXCLUDE=new Set(['ai_chat']); // settings 现在也参与同步（含显示/AI 等偏好）
const SYNC_TABLES=TABLES.filter(t=>!SYNC_EXCLUDE.has(t));
let knownRows={};            // table -> 是否已确认云端行存在
let pendingPush=new Set();   // 推送失败待重试的表
let forceReplaceTables=new Set(); // 一次性整表覆盖（用于「重置疫苗日程」等强清洗，避免脏数据被并集合并回来）
let pushTimer=null, pushBackoff=1000;
let online=(typeof navigator!=='undefined'&&navigator.onLine===false)?false:true;
let syncStatus={state:'idle',detail:'',at:0};
let pulledData=false;      // 本次同步是否从云端拉到过已有数据（用于判断房间是否已被家人初始化）

function postHeaders(){return Object.assign(cloudHeaders(),{'Prefer':'resolution=merge-duplicates'});}
function patchHeaders(){return Object.assign(cloudHeaders(),{'Prefer':'return=representation'});}
let MY_NAME=(DB.get('myName','')||'').trim();
function setMyName(n){MY_NAME=(n||'').trim();DB.set('myName',MY_NAME);}
function recId(r){return (r&&(r.id||r._id))||null;}
function rmt(r){return (r&&(r.mtime||r._t||r.updatedAt))||0;} // 记录最后修改时间
function prepRecs(arr){
  if(!Array.isArray(arr))return arr;
  arr.forEach(r=>{ if(r&&typeof r==='object'){ if(!r.mtime)r.mtime=Date.now(); if(MY_NAME&&!r.by)r.by=MY_NAME; } });
  return arr;
}
function mergeRecs(local,cloud){
  const isArrA=Array.isArray(local), isArrB=Array.isArray(cloud);
  if(!isArrA && !isArrB){
    if(local==null) return cloud;
    if(cloud==null) return local;
    if(typeof local==='object' && typeof cloud==='object'){
      const lm=local.mtime, cm=cloud.mtime;
      if(typeof lm==='number' && typeof cm==='number'){
        return lm>=cm?local:cloud;
      }
      const out=Object.assign({},cloud);          // 以云端为基，保留云端独有字段
      for(const k in local){                       // 本地字段覆盖（最新编辑优先），嵌套对象字段级合并
        const lv=local[k], cv=cloud[k];
        if(lv&&typeof lv==='object'&&!Array.isArray(lv)&&cv&&typeof cv==='object'&&!Array.isArray(cv)) out[k]=Object.assign({},cv,lv);
        else out[k]=lv;
      }
      return out;
    }
    return local;
  }
  if(!isArrA || !isArrB) return isArrA?local:cloud; // 一侧数组一侧非数组：取非数组侧
  const byId={};
  const put=(arr)=>{ (arr||[]).forEach(r=>{ const k=recId(r); if(!k)return; const ex=byId[k];
    if(!ex){ byId[k]=r; return; }
    if(r.deleted&&!ex.deleted){ byId[k]=r; return; }   // 软删除优先
    if(ex.deleted&&!r.deleted){ return; }             // 已删除则保留删除态
    const lt=rmt(r), et=rmt(ex);
    byId[k]=(lt&&et)?(lt>=et?r:ex):r;                 // 同 id 冲突：mtime 大者胜，平局本地胜
  }); };
  put(cloud); put(local);
  return Object.keys(byId).map(k=>byId[k]);
}
async function getRow(t){
  const r=await fetch(cloudUrl()+'?select=*&id=eq.'+encodeURIComponent(tableId(t)),{headers:cloudHeaders()});
  if(!r.ok)throw new Error('GET '+r.status);
  const a=await r.json();
  return (a&&a.length)?a[0]:null;
}
async function syncPush(t){
  if(!cloudReady()||typeof fetch!=='function')return;
  if(SYNC_TABLES.indexOf(t)<0)return;
  if(!online){pendingPush.add(t);setSync('offline');return;}
  try{
    prepRecs(S[t]);                                   // 写前补打 mtime/by
    const replace=forceReplaceTables.has(t);
    const row={id:tableId(t),room_id:CLOUD.room,table_name:t,payload:S[t]};
    if(knownRows[t] && !replace){
      const cur=await getRow(t);
      const merged=mergeRecs(S[t], cur?cur.payload:null);   // 与云端按 id 合并，保留他人新增
      let res=await fetch(cloudUrl()+'?id=eq.'+encodeURIComponent(tableId(t)),
        {method:'PATCH',headers:patchHeaders(),body:JSON.stringify({payload:merged})});
      if(!res.ok){                                       // 可能被并发改写，重试一次
        const cur2=await getRow(t);
        const merged2=mergeRecs(S[t], cur2?cur2.payload:null);
        const res2=await fetch(cloudUrl()+'?id=eq.'+encodeURIComponent(tableId(t)),
          {method:'PATCH',headers:patchHeaders(),body:JSON.stringify({payload:merged2})});
        if(!res2.ok)throw new Error('PATCH '+res2.status);
        res=res2;
      }
      if(typeof res.json==='function'){                  // 解析回传行数（Prefer: return=representation）
        const out=await res.json().catch(()=>null);
        if(Array.isArray(out)&&out.length===0){          // 云端行已被删（如清空房间重建）：POST 重建，不递归
          const r2=await fetch(cloudUrl(),{method:'POST',headers:postHeaders(),body:JSON.stringify([row])});
          if(r2.status===409)knownRows[t]=true;          // 行又出现：下次走 PATCH 合并
          else if(!r2.ok)throw new Error('POST '+r2.status);
          else knownRows[t]=true;
        }
      }
    }else{
      let res=await fetch(cloudUrl(),{method:'POST',headers:postHeaders(),body:JSON.stringify([row])});
      if(res.status===409){knownRows[t]=true;return syncPush(t);} // 行已存在，转合并路径
      if(!res.ok)throw new Error('POST '+res.status);
      knownRows[t]=true;
    }
    forceReplaceTables.delete(t);
    CLOUD.lastSync=Date.now();saveCloud();
    pendingPush.delete(t);
    setSync('ok');
    if(pendingPush.size===0)pushBackoff=1000;
  }catch(e){
    pendingPush.add(t);
    pushBackoff=Math.min(pushBackoff*2,30000);
    setSync('error',(e&&e.message)||e);
    scheduleFlush();
  }
}
async function syncPull(t){
  if(!cloudReady()||typeof fetch!=='function')return;
  if(SYNC_TABLES.indexOf(t)<0)return;
  if(!online)return;
  try{
    const cur=await getRow(t);
    if(cur&&cur.payload!=null){
      knownRows[t]=true;
      if(t!=='profile') pulledData=true;
      const merged=mergeRecs(S[t], cur.payload);   // 云端新记录并入本地；本地未推送编辑保留
      if(t==='todo_plans')todoNotifyNew((S[t]||[]).map(r=>r.id),merged.filter(r=>r&&!r.deleted));
      S[t]=merged; DB.set(t,merged);
    }
  }catch(e){/* 保留本地，下次再拉 */}
}
function cloudPushAll(){if(cloudReady())SYNC_TABLES.forEach(t=>syncPush(t));}
function cloudPullAll(cb){
  if(!cloudReady()){cb&&cb();return;}
  let done=0;const total=SYNC_TABLES.length;
  if(total===0){cb&&cb();return;}
  pulledData=false;
  setSync('syncing');
  SYNC_TABLES.forEach(t=>{syncPull(t).finally(()=>{if(++done===total){dedupeReminders();cb&&cb();}});});
}
async function clearCloudData(){

function diffTable(L,C){
  if(Array.isArray(L)||Array.isArray(C)){
    const lm={},cm={};
    (Array.isArray(L)?L:[]).forEach(r=>{const k=recId(r);if(k)lm[k]=r;});
    (Array.isArray(C)?C:[]).forEach(r=>{const k=recId(r);if(k)cm[k]=r;});
    let localOnly=0,cloudOnly=0,conflict=0,same=0;
    new Set([...Object.keys(lm),...Object.keys(cm)]).forEach(k=>{
      const l=lm[k],c=cm[k];
      if(l&&!c)localOnly++; else if(!l&&c)cloudOnly++;
      else { if(JSON.stringify(l)===JSON.stringify(c))same++; else conflict++; }
    });
    return {type:'array',localCount:(Array.isArray(L)?L.length:0),cloudCount:(Array.isArray(C)?C.length:0),localOnly,cloudOnly,conflict,same};
  }
  const both=(L!=null&&C!=null);
  let conflict=0,same=0;
  if(both){ if(JSON.stringify(L)===JSON.stringify(C))same++; else conflict++; }
  return {type:'object',localCount:L?1:0,cloudCount:C?1:0,
    localOnly:(L&&!C)?1:0,cloudOnly:(!L&&C)?1:0,conflict,same};
}
async function previewSync(){
  const rows={};
  await Promise.all(SYNC_TABLES.map(async t=>{
    try{ const cur=await getRow(t); rows[t]=cur?cur.payload:null; }
    catch(e){ rows[t]=undefined; }
  }));
  const per={}; let tot={local:0,cloud:0,localOnly:0,cloudOnly:0,conflict:0,same:0,fetchErr:0};
  SYNC_TABLES.forEach(t=>{
    const info=diffTable(S[t], rows[t]);
    per[t]=info;
    tot.local+=info.localCount; tot.cloud+=info.cloudCount;
    tot.localOnly+=info.localOnly; tot.cloudOnly+=info.cloudOnly;
    tot.conflict+=info.conflict; tot.same+=info.same;
    if(rows[t]===undefined)tot.fetchErr++;
  });
  return {per,tot};
}

/* ============ 工具函数 ============ */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return n<10?'0'+n:''+n;}
function dstr(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function tstr(d){d=d||new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function dtLocal(d){d=d||new Date();return dstr(d)+'T'+tstr(d);}
function parseD(s){if(!s)return null;const d=new Date(s.length<=10?s+'T00:00:00':s);return isNaN(d)?null:d;}
function today(){return dstr();}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d);}
function addMonths(s,n){const d=parseD(s);const day=d.getDate();d.setMonth(d.getMonth()+Math.floor(n));if(n%1)d.setDate(d.getDate()+Math.round((n%1)*30));if(d.getDate()<day&&n%1===0)d.setDate(0);return dstr(d);}
function diffDays(a,b){const x=parseD(a),y=parseD(b);return Math.round((y-x)/864e5);}
function fmtMD(s){const d=parseD(s);return d?(d.getMonth()+1)+'月'+d.getDate()+'日':'';}
function fmtDT(s){const d=parseD(s);if(!d)return '';return fmtMD(dstr(d))+' '+tstr(d);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function ageMonths(birth,ref){
  const b=parseD(birth),r=parseD(ref||today());
  if(!b)return 0;
  let m=(r.getFullYear()-b.getFullYear())*12+(r.getMonth()-b.getMonth());
  if(r.getDate()<b.getDate())m--;
  return Math.max(0,m);
}
function ageMonthsFloat(birth,ref){const b=parseD(birth),r=parseD(ref||today());if(!b)return 0;return Math.max(0,(r-b)/864e5/30.4375);}
function ageText(birth){
  const b=parseD(birth);if(!b)return '';
  const d=new Date(),days=diffDays(birth,today());
  if(days<0)return '预产期还有 '+(-days)+' 天';
  const m=ageMonths(birth);
  const anchor=parseD(addMonths(birth,m));
  const rd=diffDays(dstr(anchor),today());
  if(m<12)return m+' 个月'+(rd?rd+' 天':'')+' · 共 '+days+' 天';
  const y=Math.floor(m/12),rm=m%12;
  return y+' 岁'+(rm?rm+' 个月':'')+(rd?rd+' 天':'')+' · 共 '+days+' 天';
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200);}
function sortDesc(a,b){return (b._t||'').localeCompare(a._t||'');}

  if(!S.profile)S.profile=defaultProfile();
  if(S.profile.seeded)return; // 仅首次播种：防每次打开覆盖改名、盖 mtime 放大云端回滚
  Object.assign(S.profile,BABY_IDENTITY,{seeded:true});

function genVaccines(birth,keepExisting){
  if(!birth||!parseD(birth))return keepExisting?S.vaccines:[];
  const old=keepExisting?S.vaccines:[];
  const map={};old.forEach(v=>{map[v.vaccineName+'|'+v.doseNumber]=v;});
  const out=[];
  VAC_SCHEDULE.forEach(([n,ab,dose,mo,cat])=>{
    const key=n+'|'+dose,ex=map[key];
    out.push({
      id:ex?ex.id:uid(),vaccineName:n,abbr:ab,category:cat,doseNumber:dose,
      scheduledDate:mo===0?birth:addMonths(birth,mo),
      actualDate:ex?ex.actualDate:null,status:ex?ex.status:'upcoming',
      hospital:ex?ex.hospital:'',batchNumber:ex?ex.batchNumber:'',reaction:ex?ex.reaction:null,
      remindDays:3
    });
  });
  old.filter(v=>v.custom).forEach(v=>out.push(v));
  return out.sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate));
}
function genMilestones(birth,keepExisting){
  if(!birth||!parseD(birth))return keepExisting?S.milestones:[];
  const old=keepExisting?S.milestones:[];
  const map={};old.forEach(m=>{map[m.title]=m;});
  const out=[];
  MILESTONE_TPL.forEach(([type,title,off,desc])=>{
    const ex=map[title];
    const sd=(typeof off==='string'&&off[0]==='d')?addDays(birth,+off.slice(1)):addMonths(birth,off);
    out.push({
      id:ex?ex.id:uid(),milestoneType:type,title,scheduledDate:sd,
      actualDate:ex?ex.actualDate:null,status:ex?ex.status:'upcoming',
      description:desc,note:ex?ex.note:''
    });
  });
  old.filter(m=>m.custom).forEach(m=>out.push(m));
  return out.sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate));
}

/* ============ 提醒去重 · 修复「同一条目重复两条」============
   按内容签名（名称|剂次|日期|类别 / 标题|日期|类型）去重，
   保留更完整的一条（已完成状态优先合并），用于清理早期云同步造成的重复数据，
   每次云拉取后自动执行以防复发。 */
function live(arr){return (Array.isArray(arr)?arr:[]).filter(r=>!r.deleted);}
function byTag(r){return (r&&r.by)?' <span class="by" style="color:var(--text-3);font-size:11px;font-weight:400">· '+esc(r.by)+'</span>':'';}
function dedupeReminders(){
  let changed=false;
  const seenV={};
  const nv=live(S.vaccines).filter(v=>{
    const k=(v.vaccineName||'')+'|'+(v.doseNumber||'')+'|'+(v.scheduledDate||'')+'|'+(v.category||'');
    if(seenV[k]){const kp=seenV[k];if(kp.status!=='completed'&&v.status==='completed'){kp.status=v.status;kp.actualDate=v.actualDate||kp.actualDate;kp.hospital=v.hospital||kp.hospital;}changed=true;return false;}
    seenV[k]=v;return true;
  });
  if(changed){S.vaccines=nv;save('vaccines');}
  const seenM={};
  const nm=live(S.milestones).filter(m=>{
    const k=(m.title||'')+'|'+(m.scheduledDate||'')+'|'+(m.milestoneType||'');
    if(seenM[k]){const kp=seenM[k];if(kp.status!=='completed'&&m.status==='completed'){kp.status=m.status;kp.actualDate=m.actualDate||kp.actualDate;}changed=true;return false;}
    seenM[k]=m;return true;
  });
  if(changed){S.milestones=nm;save('milestones');}
  return changed;
}

function buildTodos(){
  const t=today(),out=[];
  S.vaccines.filter(v=>v.status!=='completed'&&v.status!=='skipped').forEach(v=>{
    const dd=diffDays(t,v.scheduledDate);
    if(dd<0)out.push({od:true,ic:'syringe',cls:'red',t:v.vaccineName+' 第'+v.doseNumber+'针',
      s:'计划 '+fmtMD(v.scheduledDate)+'，已逾期 '+(-dd)+' 天',act:'去接种',fn:()=>vaccineSheet(v.id),sort:-1000+dd});
    else if(dd<=7)out.push({od:false,ic:'syringe',cls:'blue',t:v.vaccineName+' 第'+v.doseNumber+'针',
      s:dd===0?'今天到期，记得去接种':dd+' 天后接种（'+fmtMD(v.scheduledDate)+'）',act:'登记',fn:()=>vaccineSheet(v.id),sort:dd});
  });
  S.milestones.filter(m=>m.status!=='completed').forEach(m=>{
    const dd=diffDays(t,m.scheduledDate);
    if(dd<0&&m.milestoneType!=='development')out.push({od:true,ic:'flag',cls:'red',t:m.title,
      s:'计划 '+fmtMD(m.scheduledDate)+'，已逾期 '+(-dd)+' 天',act:'去处理',fn:()=>milestoneSheet(m.id),sort:-900+dd});
    else if(dd>=0&&dd<=7)out.push({od:false,ic:'flag',cls:'yellow',t:m.title,
      s:dd===0?'就是今天':dd+' 天后（'+fmtMD(m.scheduledDate)+'）',act:'完成',fn:()=>milestoneSheet(m.id),sort:dd});
  });
  activePlans().forEach(p=>{
    if(!suppDone(p.id,t))out.push({od:false,ic:'pill',cls:'green',t:'补剂：'+p.name,
      s:p.dosage+' · 提醒时间 '+(p.scheduleTimes||[]).join(' / ')+' · 今天还没打卡',act:'已服用',
      fn:()=>{logSupp(p.id);render();toast(p.name+' 已打卡');},sort:2});
  });
  const nf=nextFeeding();
  if(nf){
    const mins=Math.round((parseD(nf.time)-new Date())/6e4);
    if(mins<=30)out.push({od:mins<-30,ic:'bottle',cls:mins<-30?'red':'pink',t:'下次喂奶',
      s:mins>=0?('预计 '+tstr(parseD(nf.time))+'（约 '+mins+' 分钟后）· '+nf.based):('距上次已 '+Math.floor(nf.since/60)+' 小时 '+(nf.since%60)+' 分'),
      act:'记录',fn:()=>feedSheet(),sort:mins<0?-800:1});
  }
  const bathLive=live(S.bath);
  const bathToday=bathLive.some(x=>dstr(parseD(x.bathTime))===t);
  const lastBath=bathLive.slice().sort((a,b)=>(b.bathTime||'').localeCompare(a.bathTime||''))[0];
  if(!bathToday&&lastBath&&diffDays(dstr(parseD(lastBath.bathTime)),t)>=2)
    out.push({od:false,ic:'bath',cls:'blue',t:'该洗澡啦',s:'上次洗澡是 '+fmtMD(dstr(parseD(lastBath.bathTime)))+'，已 '+diffDays(dstr(parseD(lastBath.bathTime)),t)+' 天',act:'记录',fn:()=>bathSheet(),sort:5});
  sleepTodos().forEach(x=>out.push(x));
  live(S.todo_plans).filter(p=>todoDueToday(p)).forEach(p=>{
    const od=p.freq==='once'&&p.dueDate&&p.dueDate<t;
    out.push({od:od,ic:'check',cls:od?'red':'yellow',t:'待办：'+p.title,
      s:todoFreqText(p),act:'点检',
      fn:()=>{logTodoCheck(p.id);render();toast('已点检「'+p.title+'」');},sort:od?-700:3});
  });
  return out.sort((a,b)=>a.sort-b.sort);
}
function nextFeeding(){
  const fs=live(S.feeding).slice().sort((a,b)=>(b.startTime||'').localeCompare(a.startTime||''));
  if(!fs.length)return null;
  const last=parseD(fs[0].startTime);
  const since=Math.round((new Date()-last)/6e4);
  const cut=addDays(today(),-3);
  const recent=fs.filter(f=>f.startTime>=cut).map(f=>parseD(f.startTime)).sort((a,b)=>a-b);
  let gap=180;
  if(recent.length>=2){
    let sum=0,n=0;
    for(let i=1;i<recent.length;i++){const g=(recent[i]-recent[i-1])/6e4;if(g>20&&g<600){sum+=g;n++;}}
    if(n)gap=Math.round(sum/n);
  }
  return {time:dtLocal(new Date(last.getTime()+gap*6e4)),since,gap,
    based:'近 3 天平均间隔 '+Math.floor(gap/60)+' 小时 '+(gap%60)+' 分'};
}
function activePlans(){
  const t=today();
  return live(S.supp_plans).filter(p=>p.isActive&&p.startDate<=t&&(!p.endDate||p.endDate>=t));
}
function suppDone(pid,d){return live(S.supp_logs).some(l=>l.planId===pid&&l.date===d);}
function logSupp(pid,d){
  d=d||today();
  if(suppDone(pid,d))return;
  S.supp_logs.push({id:uid(),planId:pid,date:d,time:tstr()});save('supp_logs');
}
function unlogSupp(pid,d){
  d=d||today();let n=0;
  S.supp_logs.forEach(l=>{if(l.planId===pid&&l.date===d&&!l.deleted){l.deleted=true;l.mtime=Date.now();n++;}});
  if(n)save('supp_logs');
}

/* ============ §3.12 摇篮曲播放器（手机本地音乐 · 纯离线）============
   音频文件（Blob）存 IndexedDB，仅存本机、不进云同步、不上传、不跨设备；
   无 IndexedDB 的环境自动降级为「仅本次会话可用」。内存态 MUSIC.list 只存元数据，blob 播放时懒加载。 */
const MUSIC={list:[],cur:null,loadedId:null,playing:false,loop:'all',timerMin:0,timerId:0,fadeId:0};
let _musDB=null;
function musOpen(){
  return new Promise(res=>{
    if(_musDB!==null)return res(_musDB);
    if(!window.indexedDB){_musDB=false;return res(false);}
    let rq;
    try{rq=window.indexedDB.open('anb_music',1);}catch(e){_musDB=false;return res(false);}
    rq.onupgradeneeded=e=>{const db=e.target.result;
      if(!db.objectStoreNames.contains('tracks'))db.createObjectStore('tracks',{keyPath:'id'});
      if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta',{keyPath:'k'});};
    rq.onsuccess=e=>{_musDB=e.target.result;res(_musDB);};
    rq.onerror=()=>{_musDB=false;res(false);};
    rq.onblocked=()=>{_musDB=false;res(false);};
  });
}
function musTx(store,mode){return _musDB.transaction(store,mode).objectStore(store);}
function musLoadList(){
  return musOpen().then(db=>{
    if(!db)return null;
    return new Promise(res=>{
      const out=[],rq=musTx('tracks','readonly').openCursor();
      rq.onsuccess=e=>{const c=e.target.result;
        if(c){const v=c.value;out.push({id:v.id,name:v.name,duration:v.duration||0,addedAt:v.addedAt});c.continue();}
        else{out.sort((a,b)=>a.addedAt-b.addedAt);MUSIC.list=out;res();}};
      rq.onerror=()=>res();
    }).then(()=>new Promise(res=>{
      const rq=musTx('meta','readonly').get('music');
      rq.onsuccess=e=>{const v=e.target.result;if(v&&v.loop)MUSIC.loop=v.loop;res();};
      rq.onerror=()=>res();
    }));
  });
}
function musSaveMeta(){if(_musDB){try{musTx('meta','readwrite').put({k:'music',loop:MUSIC.loop});}catch(e){}}}
function musGetBlob(id){
  return musOpen().then(db=>{
    if(!db)return null;
    return new Promise(res=>{const rq=musTx('tracks','readonly').get(id);
      rq.onsuccess=e=>res(e.target.result||null);rq.onerror=()=>res(null);});
  });
}
function musAudio(){return document.getElementById('musAudio');}
function musBindAudio(){const a=musAudio();
  a.addEventListener('ended',musEnded);
  a.addEventListener('timeupdate',musSync);
  a.addEventListener('play',musSync);
  a.addEventListener('pause',musSync);
}
function mss(s){if(!isFinite(s)||s<0)s=0;const m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+(x<10?'0':'')+x;}
function musPick(){
  if(isWeChat())toast('微信内选歌可能受限，建议右上角 ··· 在浏览器打开');
  document.getElementById('musFile').click();
}
function musAddFiles(files){
  const fs=[].slice.call(files||[]);
  if(!fs.length)return;
  musOpen().then(db=>{
    if(!db){toast('当前环境无法保存音频文件');return;}
    let pend=fs.length;
    if(!pend)return;
    fs.forEach(f=>{
      const au=document.createElement('audio');const url=URL.createObjectURL(f);
      let fired=false;
      const done=dur=>{
        if(fired)return;fired=true;URL.revokeObjectURL(url);
        const row={id:'mu|'+Date.now()+'|'+Math.random().toString(36).slice(2,7),
          name:(f.name||'摇篮曲').replace(/\.[^.]+$/,''),blob:f,
          duration:isFinite(dur)&&dur>0?Math.round(dur):0,addedAt:Date.now()};
        try{musTx('tracks','readwrite').put(row);}catch(e){}
        MUSIC.list.push({id:row.id,name:row.name,duration:row.duration,addedAt:row.addedAt});
        if(--pend===0){MUSIC.list.sort((a,b)=>a.addedAt-b.addedAt);if(route==='music')render();}
      };
      au.preload='metadata';au.src=url;
      au.onloadedmetadata=()=>done(au.duration);
      au.onerror=()=>done(0);
      setTimeout(()=>done(0),4000);
    });
  });
}
function musDel(id){
  confirmDo('删除这首摇篮曲','删除只影响本设备（音频文件不参与云同步、不会上传），其他设备的歌单不受影响。',()=>{
    if(_musDB){try{musTx('tracks','readwrite').delete(id);}catch(e){}}
    MUSIC.list=MUSIC.list.filter(t=>t.id!==id);
    if(MUSIC.cur===id)musStop();
    if(route==='music')render();
  });
}
function musGet(id){return MUSIC.list.find(t=>t.id===id)||null;}
function musPlay(id){
  let target=id||MUSIC.cur;
  if(target&&!musGet(target))target=null;
  if(!target&&MUSIC.list.length)target=MUSIC.list[0].id;
  if(!target){toast('先添加一首摇篮曲');return;}
  musGetBlob(target).then(row=>{
    if(!row||!row.blob){toast('找不到音频文件，请删除后重新添加');return;}
    const a=musAudio();
    /* 🔴 换曲判定用 loadedId（已加载的曲）而非 cur：快速连点上一首/下一首时，
       musJump 会同步推进 cur（意图位置），若按 cur 判定会漏换 src 继续播旧曲。 */
    if(MUSIC.loadedId!==target||!a.src){
      try{if(a.src)URL.revokeObjectURL(a.src);}catch(e){}
      a.src=URL.createObjectURL(row.blob);
      MUSIC.loadedId=target;
    }
    MUSIC.cur=target;a.loop=(MUSIC.loop==='one');
    const cur=musGet(target);
    musMediaSession(cur?cur.name:'摇篮曲');
    const p=a.play();
    if(p&&p.then)p.then(()=>{MUSIC.playing=true;musSync();}).catch(()=>{MUSIC.playing=false;musSync();toast('播放被浏览器拦截，请再点一次播放');});
    else{MUSIC.playing=true;musSync();}
  });
}
function musToggle(){const a=musAudio();if(a.paused)musPlay();else a.pause();}
function musStop(){const a=musAudio();a.pause();try{if(a.src)URL.revokeObjectURL(a.src);}catch(e){}a.removeAttribute('src');MUSIC.cur=null;MUSIC.loadedId=null;MUSIC.playing=false;musSync();}
function musJump(d){
  if(!MUSIC.list.length)return;
  const i=MUSIC.list.findIndex(t=>t.id===MUSIC.cur);
  const n=MUSIC.list[(Math.max(i,0)+d+MUSIC.list.length)%MUSIC.list.length];
  /* 🔴 同步推进 cur（意图位置）：连点时第二次 musJump 必须基于第一次的结果，
     不能等 blob 加载微任务落地（否则快速连点上一首/下一首会跳错方向）。 */
  if(n){MUSIC.cur=n.id;musPlay(n.id);}
}
function musPrev(){musJump(-1);}
function musNext(){musJump(1);}
function musEnded(){
  if(MUSIC.loop==='one')return;
  if(!MUSIC.list.length)return;
  const i=MUSIC.list.findIndex(t=>t.id===MUSIC.cur);
  const nxt=MUSIC.list[(i+1)%MUSIC.list.length];
  if(nxt)musPlay(nxt.id);
}
function musLoopToggle(){
  MUSIC.loop=(MUSIC.loop==='one')?'all':'one';
  musAudio().loop=(MUSIC.loop==='one');
  musSaveMeta();musSync();
  if(route==='music')render();
}
function musCanVolume(){const a=musAudio();try{const s=a.volume;a.volume=0.5;const ok=Math.abs(a.volume-0.5)<0.01;a.volume=s;return ok;}catch(e){return false;}}
function musSetTimer(min){
  min=parseInt(min,10)||0;
  clearTimeout(MUSIC.timerId);clearInterval(MUSIC.fadeId);MUSIC.fadeId=0;
  MUSIC.timerMin=min;
  const a=musAudio();
  if(min>0){
    if(a.paused)musPlay();
    MUSIC.timerId=setTimeout(musFadeStop,min*60000);
    toast('摇篮曲将在 '+min+' 分钟后自动淡出停止');
  }else toast('已取消定时停止');
  if(route==='music')render();
}
function musFadeStop(stepMs){
  const a=musAudio();
  if(a.paused)return;
  if(!musCanVolume()){a.pause();MUSIC.timerMin=0;musSync();if(route==='music')render();return;}
  const v0=a.volume;let step=0;
  MUSIC.fadeId=setInterval(()=>{
    step++;a.volume=Math.max(0,v0*(1-step/20));
    if(step>=20){clearInterval(MUSIC.fadeId);MUSIC.fadeId=0;a.pause();a.volume=v0;MUSIC.timerMin=0;musSync();if(route==='music')render();}
  },stepMs||400);
}
function musMediaSession(name){
  if(!('mediaSession' in navigator))return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:name||'摇篮曲',artist:'BabyCare Console Center'});
    navigator.mediaSession.setActionHandler('play',()=>musPlay());
    navigator.mediaSession.setActionHandler('pause',()=>musAudio().pause());
    navigator.mediaSession.setActionHandler('previoustrack',musPrev);
    navigator.mediaSession.setActionHandler('nexttrack',musNext);
  }catch(e){}
}
function musSync(){
  MUSIC.playing=!musAudio().paused;   // 事件驱动同步（play/pause 事件都会走到这）
  if(route!=='music')return;
  const a=musAudio();
  const bar=document.getElementById('musBar');
  if(bar)bar.style.width=(isFinite(a.duration)&&a.duration>0?(a.currentTime/a.duration*100):0)+'%';
  const tm=document.getElementById('musTime');
  if(tm)tm.textContent=mss(a.currentTime)+' / '+mss(a.duration);
  const pb=document.getElementById('musPlayBtn');
  if(pb)pb.innerHTML=I(a.paused?'play':'stop',26,'#fff',2);
}

    +'<div class="li-b"><div class="li-t">'+(slpO?('正在睡 · '+fmtDur(openSleepMinutes(slpO))):('今日已睡 '+fmtDur(slp.totalMin)))+'</div>'

    +'<button class="btn sm '+(slpO?'ok':'pri')+'" onclick="event.stopPropagation();'+(slpO?'endSleep()':'startSleep()')+'">'+I(slpO?'wake':'sleep',15,'currentColor',1.9)+(slpO?'醒了':'开始睡')+'</button></div></div>';

function qbtn(ic,t,s,c,fn){
