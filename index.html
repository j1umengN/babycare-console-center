const FEED_LABEL={breast:'母乳亲喂',formula:'配方奶',solid:'辅食'};
const MOOD_LABEL={good:'愉快',normal:'一般',fussy:'烦躁'};
const SKIN_LABEL={normal:'正常',dry:'干燥',rash:'红疹',eczema:'湿疹'};
const TMOOD_LABEL={enjoying:'享受',neutral:'一般',resistant:'抗拒'};

function allCareRecords(filter){
  let a=[];
  const add=(arr,kind,tf)=>live(arr).forEach(x=>a.push(Object.assign({},x,{_kind:kind,_t:x[tf]})));
  if(!filter||filter==='feeding')add(S.feeding,'feeding','startTime');
  if(!filter||filter==='diaper')add(S.diaper,'diaper','time');
  if(!filter||filter==='bath')add(S.bath,'bath','bathTime');
  if(!filter||filter==='touch')add(S.touch,'touch','touchTime');
  if(!filter||filter==='sleep')live(S.sleep).forEach(x=>a.push(Object.assign({},x,{_kind:'sleep',_t:x.startTime})));
  return a.sort(sortDesc);
}
function recMeta(r){
  if(r._kind==='feeding'){
    const ft=r.feedType;
    let s='';
    if(ft==='breast'){
      const tot=Math.round(((r.leftSec||0)+(r.rightSec||0))/60);
      s=(r.side==='left'?'左侧':r.side==='right'?'右侧':'双侧')+(tot?' · '+tot+' 分钟':'');
    }else if(ft==='formula'){s=(r.amountMl||0)+' ml';}
    else{s=(r.foodItems||[]).map(f=>f.name+(f.allergen?' (!)':'')).join('、');}
    return {ic:'bottle',c:'pink',t:FEED_LABEL[ft],s:s};
  }
  if(r._kind==='diaper'){
    const m={wet:'小便',dirty:'大便',both:'大小便'};
    let s=[];if(r.color){const c=STOOL_COLORS.find(x=>x.k===r.color);if(c)s.push(c.n);}
    if(r.consistency)s.push(r.consistency);
    return {ic:'drop',c:r.abnormalFlag?'danger':'blue',t:m[r.diaperType],s:s.join(' · ')};
  }
  if(r._kind==='bath')return {ic:'bath',c:'green',t:'洗澡',s:[r.durationMinutes?r.durationMinutes+' 分钟':'',r.waterTemp?r.waterTemp+'℃':'',SKIN_LABEL[r.skinCondition]||''].filter(Boolean).join(' · ')};
  if(r._kind==='sleep'){const m=r.open?openSleepMinutes(r):sleepMinutes(r);return {ic:r.kind==='night'?'moon':'nap',c:'purple',t:(SLEEP_KIND_LABEL[r.kind]||'小睡')+(r.open?'（进行中）':''),s:[r.open?('开始 '+tstr(parseD(r.startTime))):(tstr(parseD(r.startTime))+' → '+(r.endTime?tstr(parseD(r.endTime)):'—')),(m!=null?fmtDur(m):''),r.settle?(SLEEP_SETTLE_LABEL[r.settle]||''):''].filter(Boolean).join(' · ')};}
  return {ic:'hands',c:'purple',t:'亲子抚触',s:[(r.durationMinutes||0)+' 分钟',(r.bodyParts||[]).map(p=>BODY_PARTS[p]).join('/'),TMOOD_LABEL[r.babyMood]||''].filter(Boolean).join(' · ')};
}
function renderTimeline(list,grouped){
  let h='<div class="tl">',lastDay='';
  list.forEach(r=>{
    const day=dstr(parseD(r._t));
    if(grouped&&day!==lastDay){
      lastDay=day;
      const dd=diffDays(day,today());
      h+='<div class="tl-day">'+(dd===0?'今天':dd===1?'昨天':dd===2?'前天':fmtMD(day))+' · '+fmtMD(day)+'</div>';
    }
    const m=recMeta(r);
    const cc=m.c==='danger'?'danger':m.c+'-deep',bg=m.c==='danger'?'danger-soft':m.c+'-soft';
    h+='<div class="tl-item"><div class="tl-dot" style="background:var(--'+bg+')">'+I(m.ic,15,'var(--'+cc+')',1.9)+'</div>'
      +'<div class="tl-body" onclick="recDetail(\''+r._kind+'\',\''+r.id+'\')" style="cursor:pointer">'
      +'<div class="tl-main"><div class="tl-t">'+m.t
      +(r.abnormalFlag?'<span class="tag red">'+I('alert',11)+'异常</span>':'')
      +((r.foodItems||[]).some(f=>f.allergen)?'<span class="tag warn">新食材追踪</span>':'')
      +(r.mood&&r.mood!=='good'?'<span class="tag gray">'+MOOD_LABEL[r.mood]+'</span>':'')
      +'</div>'+(m.s?'<div class="tl-s">'+esc(m.s)+'</div>':'')
      +(r.note?'<div class="tl-s">'+esc(r.note)+'</div>':'')+'</div>'
      +'<div class="tl-time">'+(grouped?'':fmtMD(day)+' ')+tstr(parseD(r._t))+'</div>'
      +'<button class="tl-del" title="删除此记录" onclick="event.stopPropagation();delRec(\''+r._kind+'\',\''+r.id+'\')">'+I('trash',15,'currentColor',1.8)+'</button></div></div>';
  });
  return h+'</div>';
}

let recFilter='';
function viewRecords(){
  const st=todayStats();
  let h='';
  h+='<div class="segs">'+
    [['','全部'],['feeding','喂养'],['diaper','排泄'],['bath','洗澡'],['touch','抚触'],['sleep','睡眠']]
    .map(([k,n])=>'<button class="seg '+(recFilter===k?'on':'')+'" onclick="recFilter=\''+k+'\';render()">'+n+'</button>').join('')+'</div>';

  h+='<div class="quick-grid qg5" style="margin-bottom:16px">'
    +qbtn('bottle','喂奶','','pink','feedSheet()')+qbtn('drop','换尿布','','blue','diaperSheet()')
    +qbtn('bath','洗澡','','green','bathSheet()')+qbtn('hands','抚触','','purple','touchSheet()')
    +qbtn('sleep','睡眠','','warn','sleepSheet()')+'</div>';

  const ab=S.diaper.filter(d=>d.abnormalFlag&&diffDays(dstr(parseD(d.time)),today())<=7);
  if(ab.length)h+='<div class="note alert"><div class="note-i">'+I('alert',18)+'</div><div>近 7 天有 <b>'+ab.length+'</b> 次异常排泄记录。若出现<b>灰白便、血便、持续水样便伴精神差或尿量明显减少</b>，请尽快带宝宝就医。</div></div>';

  const track=allergenTracking();
  if(track.length){
    h+='<div class="card"><div class="card-h"><div class="chip-ico" style="background:var(--warn-soft)">'+I('alert',16,'var(--warn-deep)',1.9)+'</div><div class="t">新食材过敏追踪</div><div class="x">连续观察 3 天</div></div>';
    track.forEach(t=>{
      h+='<div class="li"><div class="li-b"><div class="li-t">'+esc(t.name)+'</div>'
        +'<div class="li-s">首次添加 '+fmtMD(t.first)+' · 已观察 '+t.days+'/3 天'+(t.abnormal?' · <span style="color:var(--danger)">期间有异常排泄记录</span>':' · 暂无异常')+'</div></div>'
        +'<div class="bar" style="width:70px"><div class="bar-f" style="width:'+Math.min(100,t.days/3*100)+'%;background:var(--'+(t.abnormal?'danger':'green-deep')+')"></div></div></div>';
    });
    h+='</div>';
  }

  const list=allCareRecords(recFilter||null);
  h+='<div class="sec-title">'+I('clock',15)+(recFilter?({feeding:'喂养',diaper:'排泄',bath:'洗澡',touch:'抚触'})[recFilter]:'全部')+'记录 · 共 '+list.length+' 条</div>';
  h+=list.length?renderTimeline(list.slice(0,120),true)
    :'<div class="card"><div class="empty">'+I('book',34,'var(--text-3)',1.4)+'<div class="empty-t">暂无记录</div></div></div>';
  if(list.length>120)h+='<div class="t-tag" style="text-align:center;margin-top:12px">仅显示最近 120 条，完整数据在导出的备份文件中</div>';
  return h;
}
function allergenTracking(){
  const map={};
  live(S.feeding).filter(f=>f.feedType==='solid').forEach(f=>{
    (f.foodItems||[]).forEach(it=>{
      if(!it.allergen)return;
      const d=dstr(parseD(f.startTime));
      if(!map[it.name]||d<map[it.name])map[it.name]=d;
    });
  });
  return Object.keys(map).map(name=>{
    const first=map[name],days=diffDays(first,today());
    const abnormal=S.diaper.some(d=>d.abnormalFlag&&dstr(parseD(d.time))>=first&&diffDays(dstr(parseD(d.time)),first)>=-3);
    return {name,first,days:Math.min(3,days+1),abnormal};
  }).filter(t=>diffDays(t.first,today())<=3);
}
function recDetail(kind,id){
  if(kind==='sleep'){sleepDetail(id);return;}
  const arr={feeding:'feeding',diaper:'diaper',bath:'bath',touch:'touch'}[kind];
  const r=S[arr].find(x=>x.id===id);if(!r)return;
  const rr=Object.assign({},r,{_kind:kind});const m=recMeta(rr);
  const tf={feeding:'startTime',diaper:'time',bath:'bathTime',touch:'touchTime'}[kind];
  let rows=[['时间',fmtDT(r[tf])],['类型',m.t]];
  if(m.s)rows.push(['详情',m.s]);
  if(r.mood)rows.push(['状态',MOOD_LABEL[r.mood]]);
  if(r.usedOil)rows.push(['抚触油',r.usedOil]);
  if((r.products||[]).length)rows.push(['洗护用品',r.products.join('、')]);
  if(r.abnormalDesc)rows.push(['异常描述',r.abnormalDesc]);
  if(r.note)rows.push(['备注',r.note]);
  const body=rows.map(([k,v])=>'<div class="li"><div class="li-b"><div class="li-s">'+k+'</div><div class="li-t" style="font-weight:500">'+esc(v)+'</div></div></div>').join('');
  openSheet('记录详情',body,
    '<button class="btn danger" onclick="delRec(\''+kind+'\',\''+id+'\')">'+I('trash',16)+'删除</button><button class="btn pri" onclick="closeSheet()">关闭</button>');
}
function delRec(kind,id){
  confirmDo('删除记录','确定删除这条记录吗？删除会同步到所有家人设备；已同步到云端的数据可通过「清理已删除记录」从云端彻底移除。',()=>{
    const r=S[kind].find(x=>x.id===id);
    if(r){ r.deleted=true; r.mtime=Date.now(); }
    save(kind);render();toast('已删除');
  },true);
}
function sleepDetail(id){
  const r=S.sleep.find(x=>x.id===id);if(!r)return;
  const mins=r.open?openSleepMinutes(r):sleepMinutes(r);
  const rows=[['类型',(SLEEP_KIND_LABEL[r.kind]||'小睡')+(r.open?'（进行中）':'')],
    ['开始',fmtDT(r.startTime)],
    ['结束',r.open?'—':(r.endTime?fmtDT(r.endTime):'—')],
    ['时长',mins!=null?fmtDur(mins):'—']];
  if(r.settle)rows.push(['哄睡方式',SLEEP_SETTLE_LABEL[r.settle]||r.settle]);
  if(r.by)rows.push(['记录人',r.by]);
  if(r.note)rows.push(['备注',r.note]);
  const body=rows.map(([k,v])=>'<div class="li"><div class="li-b"><div class="li-s">'+k+'</div><div class="li-t" style="font-weight:500">'+esc(v)+'</div></div></div>').join('');
  openSheet('睡眠记录详情',body,
    '<button class="btn danger" onclick="delRec(\'sleep\',\''+id+'\')">'+I('trash',16)+'删除</button><button class="btn pri" onclick="closeSheet()">关闭</button>');
}

/* ---------- 3.1 喂养记录（含母乳双侧智能计时器） ---------- */
let FD={};
function feedSheet(){
  const nf=nextFeeding();
  FD={type:'formula',side:'left',ml:180,mood:'good',time:dtLocal(),left:0,right:0,running:null,items:[],note:''};
  const m=ageMonths(S.profile.birthDate);
  if(m>=8)FD.type='solid';
  openSheet('记录喂养',feedBody(nf),feedFoot(),feedMount);
}
function feedBody(nf){
  let h='';
  if(nf&&nf.since!=null)h+='<div class="note info"><div class="note-i">'+I('clock',18)+'</div><div>距上次喂养已 <b>'+Math.floor(nf.since/60)+' 小时 '+(nf.since%60)+' 分</b>，'+nf.based+'，预计下次 <b>'+tstr(parseD(nf.time))+'</b>。</div></div>';
  h+='<div class="field"><label class="label">第一步 · 喂养类型</label><div class="bigopts" id="fdTypes">'
    +[['breast','母乳亲喂','bottle'],['formula','配方奶','bottle'],['solid','辅食','book']].map(([k,n,ic])=>
      '<button class="bigopt" data-k="'+k+'" onclick="fdType(\''+k+'\')">'+I(ic,24,'var(--pink-deep)',1.7)+'<div class="bigopt-t">'+n+'</div></button>').join('')
    +'</div></div>';
  h+='<div id="fdPanel"></div>';
  h+='<div class="field"><label class="label">时间</label><input type="datetime-local" class="inp" id="fdTime" value="'+FD.time+'"></div>';
  h+='<div class="field"><label class="label">喂养状态</label><div class="opts" id="fdMood">'
    +Object.keys(MOOD_LABEL).map(k=>'<button class="opt" data-k="'+k+'" onclick="fdMood(\''+k+'\')">'+MOOD_LABEL[k]+'</button>').join('')+'</div></div>';
  h+='<div class="field"><label class="label">备注（选填）</label><textarea class="inp" id="fdNote" placeholder="例如：吃到一半睡着了"></textarea></div>';
  return h;
}
function feedFoot(){return '<button class="btn ghost" onclick="closeSheet()">取消</button><button class="btn pri" onclick="saveFeed()">'+I('save',17)+'保存记录</button>';}
function feedMount(){fdType(FD.type);fdMood('good');}
function fdType(k){
  FD.type=k;
  document.querySelectorAll('#fdTypes .bigopt').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  const p=document.getElementById('fdPanel');
  if(k==='breast'){
    p.innerHTML='<div class="field"><label class="label">第二步 · 双侧计时器</label>'
      +'<div class="timer"><div class="timer-v" id="tvTotal">00:00</div><div class="timer-l" id="tvLabel">点击下方左/右侧开始计时</div>'
      +'<div class="timer-sides">'
      +'<button class="timer-side" id="tsL" onclick="tSide(\'left\')"><div class="timer-side-t">左侧</div><div class="timer-side-v" id="tvL">0:00</div></button>'
      +'<button class="timer-side" id="tsR" onclick="tSide(\'right\')"><div class="timer-side-t">右侧</div><div class="timer-side-v" id="tvR">0:00</div></button>'
      +'</div><button class="btn sm ghost" style="margin-top:11px" onclick="tStop()">'+I('stop',15)+'暂停计时</button></div>'
      +'<div class="t-tag" style="text-align:center">也可直接在下方手动填写总时长</div>'
      +'<div class="row2 keep" style="margin-top:10px"><div><label class="label">左侧（分钟）</label><input type="number" inputmode="numeric" class="inp" id="fdLm" placeholder="0" oninput="FD.left=(+this.value||0)*60"></div>'
      +'<div><label class="label">右侧（分钟）</label><input type="number" inputmode="numeric" class="inp" id="fdRm" placeholder="0" oninput="FD.right=(+this.value||0)*60"></div></div></div>';
    tickTimer();
  }else if(k==='formula'){
    p.innerHTML='<div class="field"><label class="label">第二步 · 喂养量（ml）</label>'
      +'<input type="number" inputmode="numeric" class="inp" id="fdMl" value="'+FD.ml+'" oninput="FD.ml=+this.value||0">'
      +'<div class="opts" style="margin-top:9px">'+[60,90,120,150,180,200,240].map(v=>
        '<button class="opt" onclick="FD.ml='+v+';document.getElementById(\'fdMl\').value='+v+'">'+v+'</button>').join('')+'</div></div>';
  }else{
    p.innerHTML='<div class="field"><label class="label">第二步 · 辅食明细</label><div id="fdItems"></div>'
      +'<button class="btn sm ghost blk" style="margin-top:8px" onclick="fdAddItem()">'+I('plus',15)+'添加食材</button>'
      +'<div class="t-tag" style="margin-top:8px">勾选「首次尝试」后，系统会自动追踪 3 天是否出现过敏反应</div></div>';
    if(!FD.items.length)FD.items=[{name:'',amount:'',allergen:false}];
    renderItems();
  }
}
function fdAddItem(){FD.items.push({name:'',amount:'',allergen:false});renderItems();}
function renderItems(){
  const el=document.getElementById('fdItems');if(!el)return;
  el.innerHTML=FD.items.map((it,i)=>
    '<div style="display:flex;gap:7px;align-items:center;margin-bottom:8px">'
    +'<input class="inp" style="flex:2" placeholder="食材，如 南瓜泥" value="'+esc(it.name)+'" oninput="FD.items['+i+'].name=this.value">'
    +'<input class="inp" style="flex:1;min-width:70px" placeholder="份量" value="'+esc(it.amount)+'" oninput="FD.items['+i+'].amount=this.value">'
    +'<button class="opt'+(it.allergen?' on':'')+'" style="min-width:44px;padding:0 9px" title="首次尝试" onclick="FD.items['+i+'].allergen=!FD.items['+i+'].allergen;renderItems()">'+I('alert',16)+'</button>'
    +(FD.items.length>1?'<button class="icon-btn plain" onclick="FD.items.splice('+i+',1);renderItems()">'+I('x',16)+'</button>':'')
    +'</div>').join('');
}
function fdMood(k){FD.mood=k;document.querySelectorAll('#fdMood .opt').forEach(b=>b.classList.toggle('on',b.dataset.k===k));}
function tSide(s){
  if(FD.running===s){tStop();return;}
  tStop();FD.running=s;FD.runStart=Date.now();
  document.getElementById('tsL').classList.toggle('on',s==='left');
  document.getElementById('tsR').classList.toggle('on',s==='right');
  document.getElementById('tvLabel').textContent=(s==='left'?'左侧':'右侧')+'计时中… 再点一次暂停';
  if(window._timerTick)clearInterval(window._timerTick);
  window._timerTick=setInterval(tickTimer,500);
}
function tStop(){
  if(FD.running){
    const el=Math.round((Date.now()-FD.runStart)/1000);
    FD[FD.running]+=el;FD.running=null;
    const lb=document.getElementById('tsL'),rb=document.getElementById('tsR');
    if(lb)lb.classList.remove('on');if(rb)rb.classList.remove('on');
    const lm=document.getElementById('fdLm'),rm=document.getElementById('fdRm');
    if(lm)lm.value=Math.round(FD.left/60)||'';if(rm)rm.value=Math.round(FD.right/60)||'';
  }
  if(window._timerTick){clearInterval(window._timerTick);window._timerTick=null;}
  const lbl=document.getElementById('tvLabel');if(lbl)lbl.textContent='已暂停，可继续或保存';
  tickTimer();
}
function mmss(s){return Math.floor(s/60)+':'+pad(s%60);}
function tickTimer(){
  let l=FD.left,r=FD.right;
  if(FD.running){const el=Math.round((Date.now()-FD.runStart)/1000);if(FD.running==='left')l+=el;else r+=el;}
  const a=document.getElementById('tvL'),b=document.getElementById('tvR'),c=document.getElementById('tvTotal');
  if(a)a.textContent=mmss(l);if(b)b.textContent=mmss(r);
  if(c)c.textContent=pad(Math.floor((l+r)/60))+':'+pad((l+r)%60);
}
function saveFeed(){
  tStop();
  const t=document.getElementById('fdTime').value||dtLocal();
  const note=document.getElementById('fdNote').value.trim();
  const r={id:uid(),feedType:FD.type,startTime:t,mood:FD.mood,note};
  if(FD.type==='breast'){
    r.leftSec=FD.left;r.rightSec=FD.right;
    r.side=FD.left&&FD.right?'both':FD.right?'right':'left';
    r.endTime=dtLocal(new Date(parseD(t).getTime()+(FD.left+FD.right)*1000));
    if(!FD.left&&!FD.right){toast('请先计时或填写时长');return;}
  }else if(FD.type==='formula'){
    if(!FD.ml){toast('请填写喂养量');return;}
    r.amountMl=FD.ml;
  }else{
    const items=FD.items.filter(i=>i.name.trim());

}

/* ---------- 3.6 共享待办（周期性 / 临时性） ---------- */
const TD_WD=['日','一','二','三','四','五','六'];
function todoDueOn(p,d){
  if(p.startDate&&d<p.startDate)return false;
  if(p.freq==='daily')return true;
  if(p.freq==='weekly')return (p.days||[]).indexOf(parseD(d).getDay())>=0;
  if(p.freq==='interval'){if(!p.startDate||d<p.startDate)return false;return diffDays(p.startDate,d)%Math.max(1,p.everyN||1)===0;}
  return false;
}
function hasTodoCheck(pid,d){return live(S.todo_checks).some(c=>c.planId===pid&&c.date===d);}
function todoCompleted(p){return live(S.todo_checks).some(c=>c.planId===p.id);}
function todoDueToday(p){
  const t=today();
  if(p.freq==='once')return !todoCompleted(p)&&!!p.dueDate&&p.dueDate<=t;
  return todoDueOn(p,t)&&!hasTodoCheck(p.id,t);
}
function todoFreqText(p){
  if(p.freq==='once')return '临时 · 截止 '+(p.dueDate?fmtMD(p.dueDate):'未设');
  if(p.freq==='daily')return '每天';
  if(p.freq==='weekly')return '每周 '+(p.days||[]).slice().sort().map(d=>TD_WD[d]).join('、');
  return '每 '+(p.everyN||1)+' 天';
}
function logTodoCheck(pid){
  S.todo_checks.push({id:uid(),planId:pid,date:today(),time:tstr(),by:MY_NAME||'',mtime:Date.now()});
  save('todo_checks');
}
function unlogTodoCheck(pid){
  const t=today();
  S.todo_checks.forEach(c=>{if(c.planId===pid&&c.date===t&&!c.deleted){c.deleted=true;c.mtime=Date.now();}});
  save('todo_checks');
}
function toggleTodo(pid){
  const p=S.todo_plans.find(x=>x.id===pid);if(!p)return;
  if(hasTodoCheck(pid,today())){unlogTodoCheck(pid);toast('已撤销今日点检');}
  else{logTodoCheck(pid);toast('已点检「'+p.title+'」');}
  render();
}
let TD_EDIT=null;
function todoSheet(id){
  const p=id?S.todo_plans.find(x=>x.id===id):null;
  TD_EDIT=p?{title:p.title,freq:p.freq,days:(p.days||[]).slice(),everyN:p.everyN||2,dueDate:p.dueDate||today(),startDate:p.startDate||today(),note:p.note||'',voice:null}:{title:'',freq:'daily',days:[1],everyN:2,dueDate:today(),startDate:today(),note:'',voice:null};
  let h='<div class="field"><label class="label">事项名称（可点「说话录入」语音输入）</label><div class="row2 keep"><input class="inp" id="tdTitle" placeholder="如 买尿不湿 / 给宝剪指甲" value="'+esc(TD_EDIT.title)+'">'
    +'<button class="btn sm ghost" id="tdTitleMic" onclick="tdTitleVoice()">'+I('mic',14)+'说话录入</button></div></div>';
  h+='<div class="field"><label class="label">类型</label><div class="opts" id="tdFreq">'
    +[['daily','周期 · 每天'],['weekly','周期 · 每周'],['interval','周期 · 间隔'],['once','临时']].map(([k,n])=>'<button class="opt" data-k="'+k+'" onclick="tdFreq(\''+k+'\')">'+n+'</button>').join('')+'</div></div>';
  h+='<div id="tdDaysWrap" class="field"><label class="label">每周哪几天</label><div class="opts">'
    +TD_WD.map((n,i)=>'<button class="opt" data-d="'+i+'" onclick="this.classList.toggle(\'on\');tdDay('+i+',this.classList.contains(\'on\'))">'+n+'</button>').join('')+'</div></div>';
  h+='<div id="tdEveryWrap" class="field"><label class="label">间隔天数</label><input type="number" class="inp" id="tdEvery" min="2" value="'+TD_EDIT.everyN+'"></div>';
  h+='<div id="tdDueWrap" class="field"><label class="label">截止日期</label><input type="date" class="inp" id="tdDue" value="'+TD_EDIT.dueDate+'"></div>';
  h+='<div class="field"><label class="label">开始日期（周期性）</label><input type="date" class="inp" id="tdStart" value="'+TD_EDIT.startDate+'"></div>';
  h+='<div class="field"><label class="label">备注（选填）</label><textarea class="inp" id="tdNote">'+esc(TD_EDIT.note)+'</textarea></div>';
  h+='<div class="field"><label class="label">语音备注（最长 60 秒 · 自动同步家人）</label><div class="opts" id="tdVoiceBox"></div></div>';
  openSheet(p?'编辑待办':'添加待办',h,'<button class="btn ghost" onclick="closeSheet()">取消</button><button class="btn pri" onclick="saveTodo('+(p?'\'id\'':'')+')">保存</button>',
    ()=>{tdFreq(TD_EDIT.freq);tdVoiceRender(p?p.id:'new');});
}
function tdFreq(k){
  TD_EDIT.freq=k;
  document.querySelectorAll('#tdFreq .opt').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  const w=document.getElementById('tdDaysWrap'),e=document.getElementById('tdEveryWrap'),d=document.getElementById('tdDueWrap');
  if(w)w.style.display=k==='weekly'?'':'none';
  if(e)e.style.display=k==='interval'?'':'none';
  if(d)d.style.display=k==='once'?'':'none';
}
function tdDay(i,on){if(on){if(TD_EDIT.days.indexOf(i)<0)TD_EDIT.days.push(i);}else TD_EDIT.days=TD_EDIT.days.filter(x=>x!==i);}
function saveTodo(keep){
  const title=(document.getElementById('tdTitle').value||'').trim();
  if(!title){toast('请填写事项名称');return;}
  const f=TD_EDIT.freq;
  const rec={
    title:title,freq:f,
    days:f==='weekly'?TD_EDIT.days.slice():null,
    everyN:f==='interval'?Math.max(2,parseInt(document.getElementById('tdEvery').value,10)||2):null,
    dueDate:f==='once'?(document.getElementById('tdDue').value||today()):null,
    startDate:(f==='once')?null:(document.getElementById('tdStart').value||today()),
    note:(document.getElementById('tdNote').value||'').trim()
  };
  let p;
  if(keep){
    p=S.todo_plans.find(x=>x.id===keep);if(!p)return;
    Object.assign(p,rec);p.mtime=Date.now();
  }else{
    p=Object.assign({id:uid(),mtime:Date.now(),by:MY_NAME||''},rec);
    S.todo_plans.push(p);
    if(TD_EDIT&&TD_EDIT.voice)tvPut(p.id,TD_EDIT.voice);
  }
  save('todo_plans');closeSheet();render();toast('已保存「'+p.title+'」');
}

/* 待办语音备注：MediaRecorder 录音转 base64 存同步表 todo_voice（jsonb），家人设备同步后可播放；旧版本机 IndexedDB 仍可读 */
const TODO_VOICE={ids:{}};
let _tvDB=null,TD_REC=null,TD_STT=null;
function tvOpen(){
  return new Promise(res=>{
    if(_tvDB!==null)return res(_tvDB);
    if(!window.indexedDB){_tvDB=false;return res(false);}
    let rq;
    try{rq=window.indexedDB.open('anb_todo_voice',1);}catch(e){_tvDB=false;return res(false);}
    rq.onupgradeneeded=e=>{const db=e.target.result;
      if(!db.objectStoreNames.contains('voices'))db.createObjectStore('voices',{keyPath:'planId'});};
    rq.onsuccess=e=>{_tvDB=e.target.result;res(_tvDB);};
    rq.onerror=()=>{_tvDB=false;res(false);};
    rq.onblocked=()=>{_tvDB=false;res(false);};
  });
}
function tvLoadIds(){
  const ids={};
  live(S.todo_voice).forEach(r=>{if(r.planId)ids[r.planId]=1;});
  return tvOpen().then(db=>{
    if(!db)return;
    return new Promise(res=>{
      const rq=db.transaction('voices','readonly').objectStore('voices').openCursor();
      rq.onsuccess=e=>{const c=e.target.result;if(c){ids[c.key]=1;c.continue();}else{TODO_VOICE.ids=ids;res();}};
      rq.onerror=()=>{TODO_VOICE.ids=ids;res();};
    });
  });
}
function b64ToBlob(b64,mime){
  try{
    const bin=atob(b64),u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    return new Blob([u],{type:mime||'audio/webm'});
  }catch(e){return null;}
}
function blobToB64(blob){
  return new Promise(res=>{
    try{
      const r=new FileReader();
      r.onload=()=>{const s=String(r.result||'');const i=s.indexOf(',');res(i>=0?s.slice(i+1):'');};
      r.onerror=()=>res('');
      r.readAsDataURL(blob);
    }catch(e){res('');}
  });
}
function tvRow(planId){return live(S.todo_voice).find(r=>r.planId===planId)||null;}
function tvGet(planId){
  const row=tvRow(planId);
  if(row&&row.data){const b=b64ToBlob(row.data,row.mime);if(b)return Promise.resolve({blob:b});}
  return tvOpen().then(db=>{
    if(!db)return null;
    return new Promise(res=>{const rq=db.transaction('voices','readonly').objectStore('voices').get(planId);
      rq.onsuccess=e=>res(e.target.result||null);rq.onerror=()=>res(null);});
  });
}
function tvHas(planId){return !!tvRow(planId)||!!TODO_VOICE.ids[planId];}
function tvPut(planId,blob){
  return blobToB64(blob).then(b64=>{
    if(!b64){toast('语音编码失败，请重试');return false;}
    if(b64.length>15e5){toast('语音过大无法保存，请控制在 60 秒内');return false;}
    const total=live(S.todo_voice).reduce((s,r)=>s+((r.data||'').length),0);
    if(total+b64.length>3e6){toast('语音存储空间已满，请删除部分较早的语音后再录');return false;}
    S.todo_voice.forEach(r=>{if(r.planId===planId&&!r.deleted){r.deleted=true;r.mtime=Date.now();}});
    S.todo_voice.push({id:uid(),planId:planId,mime:blob.type||'audio/webm',data:b64,by:MY_NAME||'',mtime:Date.now()});
    save('todo_voice');
    return true;
  });
}
function tvDel(planId){
  let hit=false;
  S.todo_voice.forEach(r=>{if(r.planId===planId&&!r.deleted){r.deleted=true;r.mtime=Date.now();hit=true;}});
  if(hit)save('todo_voice');
  return tvOpen().then(db=>{
    if(!db)return;
    return new Promise(res=>{const rq=db.transaction('voices','readwrite').delete(planId);
      rq.onsuccess=()=>res();rq.onerror=()=>res();});
  });
}
function tdRecStart(key){
  if(TD_REC){toast('正在录音中，请先停止');return;}
  if(!window.MediaRecorder||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('当前浏览器不支持录音');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
    let rec;
    try{rec=new MediaRecorder(st);}catch(e){st.getTracks().forEach(x=>x.stop());toast('当前浏览器不支持录音');return;}
    const chunks=[];
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    rec.onstop=()=>{
      st.getTracks().forEach(x=>x.stop());
      const k=TD_REC.key;TD_REC=null;
      const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});
      if(!blob||!blob.size){tdVoiceRender(k);return;}
      if(k==='new'){if(TD_EDIT)TD_EDIT.voice=blob;toast('语音已录制，保存待办时生效');tdVoiceRender(k);}
      else tvPut(k,blob).then(ok=>{toast(ok?'语音已保存，将同步给家人':'语音保存失败');tdVoiceRender(k);});
    };
    rec.start();TD_REC={rec:rec,key:key,timer:setTimeout(()=>{if(TD_REC&&TD_REC.rec&&TD_REC.rec.state!=='inactive')TD_REC.rec.stop();},60000)};
    tdVoiceRender(key);
  }).catch(()=>toast('未授权麦克风，无法录音'));
}
function tdRecStop(){if(TD_REC&&TD_REC.rec){clearTimeout(TD_REC.timer);if(TD_REC.rec.state!=='inactive')TD_REC.rec.stop();}}
function tdVoiceGet(key){
  if(key==='new')return Promise.resolve(TD_EDIT&&TD_EDIT.voice?TD_EDIT.voice:null);
  return tvGet(key).then(r=>r&&r.blob?r.blob:null);
}
function tdVoiceRender(key){
  const box=document.getElementById('tdVoiceBox');if(!box)return;
  tdVoiceGet(key).then(b=>{
    const rec=TD_REC&&TD_REC.key===key;
    let h='<button class="opt" onclick="'+(rec?'tdRecStop()':'tdRecStart(\''+key+'\')')+'">'+(rec?'■ 停止录音（最长 60 秒）':I('mic',14)+(b?' 重新录音':' 开始录音'))+'</button>';
    if(b&&!rec)h+='<button class="opt" onclick="tdVoicePlay(\''+key+'\')">'+I('play',14)+' 试听</button>'
      +'<button class="opt" onclick="tdVoiceDel(\''+key+'\')">删除语音</button>';
    h+='<span style="align-self:center;font-size:11px;color:var(--text-3);padding:0 4px">'+(rec?'录音中…':b?'已保存 · 家人可见':'未录制')+'</span>';
    box.innerHTML=h;
  });
}
function tdVoicePlay(key){
  tdVoiceGet(key).then(b=>{
    if(!b){toast('语音还没同步到本机，稍后下拉同步后再试');return;}
    try{const a=new Audio(URL.createObjectURL(b));a.play();}catch(e){toast('播放失败');}
  });
}
function tdVoiceDel(key){
  const isNew=key==='new';
  confirmDo('删除语音','删除这条待办的语音备注？将同步删除到所有家人设备。',()=>{
    if(isNew){if(TD_EDIT)TD_EDIT.voice=null;toast('已删除');tdVoiceRender(key);}
    else tvDel(key).then(()=>{toast('已删除');tdVoiceRender(key);});
  });
}
/* 事项名称语音输入：Web Speech API（zh-CN，识别结果实时填入输入框） */
function tdTitleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('当前浏览器不支持语音识别，请手动输入');return;}
  if(TD_STT){try{TD_STT.stop();}catch(e){}return;}
  let rec;
  try{rec=new SR();}catch(e){toast('当前浏览器不支持语音识别');return;}
  rec.lang='zh-CN';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  const inp=document.getElementById('tdTitle'),btn=document.getElementById('tdTitleMic');
  TD_STT=rec;
  rec.onstart=()=>{if(btn)btn.innerHTML='■ 停止';if(inp)inp.placeholder='请说出事项名称…';};
  rec.onresult=e=>{
    let s='';
    for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript;
    if(inp&&s)inp.value=((inp.value||'')+' '+s.trim()).trim();
  };
  rec.onerror=()=>{TD_STT=null;if(btn)btn.innerHTML=I('mic',14)+'说话录入';toast('语音识别失败，请重试或手动输入');};
  rec.onend=()=>{TD_STT=null;if(btn)btn.innerHTML=I('mic',14)+'说话录入';if(inp)inp.placeholder='如 买尿不湿 / 给宝剪指甲';};
  try{rec.start();}catch(e){TD_STT=null;toast('无法开始语音识别');}
}

/* 新待办到达通知：拉取合并时比对差集；首次拉取静默播种，之后云端新出现的待办推送通知 */
let TODO_SEEN=null;
function todoNotifyNew(beforeIds,after){
  if(TODO_SEEN===null){TODO_SEEN={};after.forEach(r=>{TODO_SEEN[r.id]=1;});return;}
  const had={};beforeIds.forEach(id=>{had[id]=1;});
  after.forEach(r=>{
    if(r.deleted||TODO_SEEN[r.id])return;
    TODO_SEEN[r.id]=1;
    if(had[r.id])return;
    showAppNotification('收到新待办',(r.title||'（无标题）')+(r.by?'（来自 '+r.by+'）':'')+'，请前往提醒 · 待办查看');
  });
}

/* ---------- 3.3 补剂提醒 ---------- */
function viewSupp(){
  const t=today(),plans=live(S.supp_plans);
  let h='';
  const act=activePlans();
  const done=act.filter(p=>suppDone(p.id,t)).length;
  h+='<div class="card"><div class="card-h"><div class="chip-ico" style="background:var(--green-soft)">'+I('pill',17,'var(--green-deep)',1.9)+'</div>'
    +'<div class="t">补剂计划</div><div class="x">'+done+' / '+act.length+' 今日已打卡</div></div>';
  if(!plans.length)h+='<div class="empty" style="padding:18px">'+I('pill',30,'var(--text-3)',1.4)+'<div class="empty-t">还没有补剂计划</div></div>';
  const sorted=plans.slice().sort((a,b)=>(b.isActive-a.isActive)||a.startDate.localeCompare(b.startDate));
  sorted.forEach(p=>{
    const d=suppDone(p.id,t),on=p.isActive;
    h+='<div class="li">'
      +'<div class="todo-ico" style="background:var(--'+(d?'green':'yellow')+'-soft)">'+I('pill',16,'var(--'+(d?'green':'yellow')+'-deep)',1.9)+'</div>'
      +'<div class="li-b"><div class="li-t">'+esc(p.name)+' <span class="tag gray">'+esc(p.dosage)+'</span>'+(on?'':' <span class="tag gray">已停用</span>')+byTag(p)+'</div>'
      +'<div class="li-s">'+(on?(p.scheduleTimes||[]).join(' / ')+' · '+(p.frequency==='daily'?'每天':'每周')+' · '+(d?'今天已服用 ✓':'今天还没打卡'):'已停用 · 自 '+p.startDate)+'</div>'
      +(p.note?'<div class="li-s" style="color:var(--text-3)">'+esc(p.note)+'</div>':'')+'</div>'
      +(on?'<button class="btn sm '+(d?'ok':'pri')+'" onclick="'+(d?'unlogSupp':'logSupp')+'(\''+p.id+'\');render();toast(\''+(d?'已取消打卡':'打卡成功')+'\')">'
        +(d?I('check',15)+'已服用':'打卡')+'</button>':'<span class="tag gray">已停用</span>')
      +'<div class="sw '+(on?'on':'')+'" onclick="toggleSupp(\''+p.id+'\')"></div>'
      +'<button class="icon-btn plain" onclick="delSupp(\''+p.id+'\')">'+I('trash',17)+'</button></div>';
  });
  h+='<button class="btn sm ghost blk" style="margin-top:12px" onclick="suppSheet()">'+I('plus',15)+'添加补剂计划</button></div>';

  if(act.length){
    h+='<div class="card"><div class="card-h"><div class="chip-ico" style="background:var(--blue-soft)">'+I('cal',17,'var(--blue-deep)',1.9)+'</div>'
      +'<div class="t">近 4 周服用依从性</div></div>';
    h+=heatmap(28,d=>{
      const a=live(S.supp_plans).filter(p=>p.isActive&&p.startDate<=d&&(!p.endDate||p.endDate>=d));
      if(!a.length)return -1;
      return a.filter(p=>suppDone(p.id,d)).length/a.length;
    },'green');
    const days=[];for(let i=27;i>=0;i--)days.push(addDays(t,-i));
    let full=0,miss=0;
    days.forEach(d=>{
      if(d>t)return;
      const a=live(S.supp_plans).filter(p=>p.isActive&&p.startDate<=d&&(!p.endDate||p.endDate>=d));
      if(!a.length)return;
      const c=a.filter(p=>suppDone(p.id,d)).length;
      if(c===a.length)full++;else miss++;
    });
    h+='<div class="row2 keep" style="margin-top:13px">'
      +'<div class="stat" style="box-shadow:none"><div class="stat-v" style="color:var(--green-deep)">'+full+'</div><div class="stat-l">全部完成天数</div></div>'
      +'<div class="stat" style="box-shadow:none"><div class="stat-v" style="color:var(--warn-deep)">'+miss+'</div><div class="stat-l">漏服天数</div></div></div>';
    h+='</div>';
  }
  h+='<div class="note info"><div class="note-i">'+I('info',18)+'</div><div>补剂剂量请以儿保医生建议为准。本工作台仅做记录与提醒，不构成医疗建议。</div></div>';
  return h;
}
function toggleSupp(id){const p=S.supp_plans.find(x=>x.id===id);if(p){p.isActive=!p.isActive;save('supp_plans');render();}}
function delSupp(id){
  const p=S.supp_plans.find(x=>x.id===id);
  confirmDo('删除补剂计划','删除「'+esc(p.name)+'」会同时清除它的全部打卡历史，其他照护人设备也会同步隐藏，确定吗？',()=>{

    S.supp_logs.forEach(l=>{if(l.planId===id){l.deleted=true;l.mtime=Date.now();}});save('supp_logs');

/* ---------- 3.4 疫苗时间提醒 ---------- */
function vacStatus(v){
  if(v.status==='completed')return 'completed';
  if(v.status==='skipped')return 'skipped';
  const dd=diffDays(today(),v.scheduledDate);
  if(dd<0)return 'overdue';
  if(dd<=30)return 'soon';
  return 'upcoming';
}
function viewVac(){
  const list=live(S.vaccines).slice().sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate));
  const g={overdue:[],soon:[],upcoming:[],completed:[],skipped:[]};
  list.forEach(v=>g[vacStatus(v)].push(v));
  let h='';
  h+='<div class="stat-grid" style="margin-bottom:14px">'
    +'<div class="stat"><div class="stat-v" style="color:var(--danger)">'+g.overdue.length+'</div><div class="stat-l">逾期未种</div></div>'
    +'<div class="stat"><div class="stat-v" style="color:var(--warn-deep)">'+g.soon.length+'</div><div class="stat-l">30天内</div></div>'
    +'<div class="stat"><div class="stat-v" style="color:var(--green-deep)">'+g.completed.length+'</div><div class="stat-l">已完成</div></div>'
    +'<div class="stat"><div class="stat-v" style="color:var(--text-3)">'+g.upcoming.length+'</div><div class="stat-l">后续计划</div></div></div>';

  h+='<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">'
    +'<button class="btn sm ghost blk" onclick="addVacSheet()">'+I('plus',15)+'添加二类（自费）疫苗</button>'
    +'<button class="btn sm ghost" onclick="resetVaccines()" title="清空全部疫苗记录并按出生日期重新生成">'+I('sync',15)+'重置疫苗日程</button>'
    +'</div>';

  const sec=(title,arr,color,openDefault)=>{
    if(!arr.length)return '';
    let s='<div class="card"><div class="card-h"><div class="chip-ico" style="background:var(--'+color+'-soft)">'+I('syringe',17,'var(--'+color+(color==='danger'?'':'-deep')+')',1.9)+'</div><div class="t">'+title+'</div><div class="x">'+arr.length+' 项</div></div>';
    arr.forEach(v=>{
      const dd=diffDays(today(),v.scheduledDate),st=vacStatus(v);
      let sub;
      if(st==='completed')sub='已于 '+(v.actualDate||v.scheduledDate)+' 接种'+(v.hospital?' · '+v.hospital:'');
      else if(dd<0)sub='计划 '+v.scheduledDate+' · <span style="color:var(--danger);font-weight:600">逾期 '+(-dd)+' 天</span>';
      else if(dd===0)sub='就是今天 · '+v.scheduledDate;
      else sub='计划 '+v.scheduledDate+' · '+dd+' 天后';
      s+='<div class="li" style="cursor:pointer" onclick="vaccineSheet(\''+v.id+'\')">'
        +'<div class="li-b"><div class="li-t">'+esc(v.vaccineName)+' <span class="tag '+(v.category==='class_1'?'blue':'purple')+'">'+(v.category==='class_1'?'一类免费':'二类自费')+'</span>'+byTag(v)+'</div>'
        +'<div class="li-s">第 '+v.doseNumber+' 剂 · '+sub+'</div></div>'
        +'<div style="display:flex;align-items:center;gap:8px">'
        +(st==='completed'?'<span class="tag green">'+I('check',12)+'已完成</span>':'<button class="btn sm '+(dd<=0?'pri':'ghost')+'">登记</button>')
        +'<button class="icon-btn plain" title="删除" onclick="event.stopPropagation();delVac(\''+v.id+'\')">'+I('trash',17)+'</button>'
        +'</div></div>';
    });
    return s+'</div>';
  };
  h+=sec('逾期未接种',g.overdue,'danger');
  h+=sec('30 天内待接种',g.soon,'warn');
  h+=sec('后续接种计划',g.upcoming,'blue');
  h+=sec('已完成接种',g.completed,'green');
  h+='<div class="note info"><div class="note-i">'+I('info',18)+'</div><div>一类疫苗日程依据《国家免疫规划疫苗儿童免疫程序表（2021 年版）》按宝宝出生日期自动推算。各地社区实施略有差异，<b>请以接种本和社区卫生服务中心通知为准</b>。接种前请确认宝宝无发热等急性疾病。</div></div>';
  return h;
}

function saveVac(id){

/* ---------- 3.5 重要节点提醒 ---------- */
const MS_TYPE={checkup:{n:'儿保体检',c:'blue',ic:'cal'},development:{n:'发育里程碑',c:'pink',ic:'spark'},
  document:{n:'证件办理',c:'yellow',ic:'book'},custom:{n:'自定义',c:'purple',ic:'flag'}};
let msTab='all';
function viewMs(){
  let h='<div class="segs">'+[['all','全部']].concat(Object.keys(MS_TYPE).map(k=>[k,MS_TYPE[k].n]))
    .map(([k,n])=>'<button class="seg '+(msTab===k?'on':'')+'" onclick="msTab=\''+k+'\';render()">'+n+'</button>').join('')+'</div>';
  h+='<button class="btn sm ghost blk" style="margin-bottom:14px" onclick="addMsSheet()">'+I('plus',15)+'添加自定义节点</button>';
  let list=live(S.milestones).slice();
  if(msTab!=='all')list=list.filter(m=>m.milestoneType===msTab);
  const pend=list.filter(m=>m.status!=='completed').sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate));
  const done=list.filter(m=>m.status==='completed').sort((a,b)=>(b.actualDate||b.scheduledDate).localeCompare(a.actualDate||a.scheduledDate));

  const card=(title,arr,empty)=>{
    let s='<div class="card"><div class="card-h"><div class="t">'+title+'</div><div class="x">'+arr.length+' 项</div></div>';
    if(!arr.length)s+='<div class="t-sub">'+empty+'</div>';

      const dd=diffDays(today(),m.scheduledDate),T=MS_TYPE[m.milestoneType]||MS_TYPE.custom;

      else if(dd<0)sub='参考达成时间 '+m.scheduledDate+'（发育有个体差异，不必焦虑）';

        +'<div class="todo-ico" style="background:var(--'+T.c+'-soft)">'+I(T.ic,16,'var(--'+T.c+'-deep)',1.9)+'</div>'
        +'<div class="li-b"><div class="li-t">'+esc(m.title)+byTag(m)+'</div><div class="li-s">'+sub+'</div></div>'
        +'<div style="display:flex;align-items:center;gap:8px">'
        +(m.status==='completed'?'<span class="tag green">'+I('check',12)+'</span>':'<button class="btn sm '+(od?'pri':'ghost')+'">完成</button>')
        +'<button class="icon-btn plain" title="删除" onclick="event.stopPropagation();delMs(\''+m.id+'\')">'+I('trash',17)+'</button>'
        +'</div></div>';

  };

  return h;
}

/* ---------- 通用热力图 ---------- */
function heatmap(days,valFn,color){
  const t=today();
  let cells=[],start=addDays(t,-(days-1));
  const sd=parseD(start).getDay();
  for(let i=0;i<sd;i++)cells.push(null);
  for(let i=0;i<days;i++)cells.push(addDays(start,i));
  let h='<div class="heat-l">'+['日','一','二','三','四','五','六'].map(d=>'<span>'+d+'</span>').join('')+'</div><div class="heat">';
  cells.forEach(d=>{
    if(!d){h+='<div></div>';return;}
    const v=valFn(d);
    let bg='var(--bg)',bd='var(--line)',col='var(--text-3)';
    if(v>0){const a=.22+v*.78;bg='color-mix(in srgb, var(--'+color+'-deep) '+Math.round(a*100)+'%, transparent)';bd='transparent';if(v>=.7)col='#fff';}
    h+='<div class="heat-c" title="'+d+'" style="background:'+bg+';border-color:'+bd+';color:'+col+'">'+parseD(d).getDate()+'</div>';
  });
  return h+'</div>';
}

/* =======================================================================
   模块三 · 身高体重生长曲线 §3.6（WHO 儿童生长标准）
   ======================================================================= */
const MEASURES={
  weight:{n:'体重',u:'kg',c:'pink',key:'weightKg',step:.01},
  height:{n:'身长/身高',u:'cm',c:'blue',key:'heightCm',step:.1},
  head:{n:'头围',u:'cm',c:'purple',key:'headCm',step:.1}
};
let gTab='weight';

function whoAt(measure,gender,mf){
  const tbl=WHO[measure][gender];
  const max=tbl.length-1;
  const m=Math.max(0,Math.min(max,mf));
  const i=Math.floor(m),f=m-i;
  if(i>=max)return tbl[max].slice();
  return tbl[i].map((v,k)=>v+(tbl[i+1][k]-v)*f);
}
function percentileOf(measure,gender,mf,val){
  const p=whoAt(measure,gender,mf);
  if(val<=p[0])return {p:3,out:'low'};
  if(val>=p[4])return {p:97,out:'high'};
  for(let i=0;i<4;i++){
    if(val>=p[i]&&val<=p[i+1]){
      const r=(val-p[i])/(p[i+1]-p[i]);
      return {p:Math.round(PCTS[i]+(PCTS[i+1]-PCTS[i])*r),out:''};
    }
  }
  return {p:50,out:''};
}
function growthPoints(measure){
  const key=MEASURES[measure].key,b=S.profile.birthDate;
  return live(S.growth).filter(g=>g[key]!=null&&g[key]!=='').map(g=>({
    m:ageMonthsFloat(b,g.measureDate),v:+g[key],date:g.measureDate,id:g.id
  })).sort((a,b2)=>a.m-b2.m);
}

/* ---------- 手写 SVG 生长曲线图 ---------- */
function curveSVG(measure){
  const M=MEASURES[measure],g=S.profile.gender,pts=growthPoints(measure);
  const maxM=Math.max(12,Math.min(24,Math.ceil(ageMonthsFloat(S.profile.birthDate)+3)));
  const W=660,H=330,L=46,R=14,T=16,B=34;
  const iw=W-L-R,ih=H-T-B;
  let lo=Infinity,hi=-Infinity;
  for(let m=0;m<=maxM;m++){const p=whoAt(measure,g,m);lo=Math.min(lo,p[0]);hi=Math.max(hi,p[4]);}
  pts.forEach(p=>{lo=Math.min(lo,p.v);hi=Math.max(hi,p.v);});
  const pad=(hi-lo)*.07;lo-=pad;hi+=pad;
  const X=m=>L+m/maxM*iw, Y=v=>T+ih-(v-lo)/(hi-lo)*ih;

  const band=[];
  for(let k=0;k<5;k++){
    let d='';
    for(let m=0;m<=maxM;m+=.5){const v=whoAt(measure,g,m)[k];d+=(m===0?'M':'L')+X(m).toFixed(1)+' '+Y(v).toFixed(1);}
    band.push(d);
  }
  let area='';
  for(let m=0;m<=maxM;m+=.5){const v=whoAt(measure,g,m)[0];area+=(m===0?'M':'L')+X(m).toFixed(1)+' '+Y(v).toFixed(1);}
  for(let m=maxM;m>=0;m-=.5){const v=whoAt(measure,g,m)[4];area+='L'+X(m).toFixed(1)+' '+Y(v).toFixed(1);}
  area+='Z';
  let area2='';
  for(let m=0;m<=maxM;m+=.5){const v=whoAt(measure,g,m)[1];area2+=(m===0?'M':'L')+X(m).toFixed(1)+' '+Y(v).toFixed(1);}
  for(let m=maxM;m>=0;m-=.5){const v=whoAt(measure,g,m)[3];area2+='L'+X(m).toFixed(1)+' '+Y(v).toFixed(1);}
  area2+='Z';

  const cd=M.c+'-deep';
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="min-width:'+W+'px">';
  const ticks=6;
  for(let i=0;i<=ticks;i++){
    const v=lo+(hi-lo)*i/ticks,y=Y(v);
    s+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="'+(L-7)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--text-3)">'+v.toFixed(measure==='weight'?1:0)+'</text>';
  }
  const xs=maxM<=12?2:3;
  for(let m=0;m<=maxM;m+=xs){
    s+='<line x1="'+X(m).toFixed(1)+'" y1="'+T+'" x2="'+X(m).toFixed(1)+'" y2="'+(T+ih)+'" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="'+X(m).toFixed(1)+'" y="'+(H-13)+'" text-anchor="middle" font-size="11" fill="var(--text-3)">'+m+'月</text>';
  }
  s+='<path d="'+area+'" fill="var(--'+M.c+'-soft)" opacity=".55"/>';
  s+='<path d="'+area2+'" fill="var(--'+M.c+'-soft)" opacity=".8"/>';
  band.forEach((d,k)=>{
    const isMid=k===2;
    s+='<path d="'+d+'" fill="none" stroke="var(--'+cd+')" stroke-width="'+(isMid?1.8:1)+'" opacity="'+(isMid?.65:.38)+'" '+(isMid?'':'stroke-dasharray="4 4"')+'/>';
    const v=whoAt(measure,g,maxM)[k];
    s+='<text x="'+(W-R-2)+'" y="'+(Y(v)-3).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="var(--'+cd+')" opacity=".8">P'+PCTS[k]+'</text>';
  });
  if(pts.length){
    let d='';pts.forEach((p,i)=>{d+=(i?'L':'M')+X(p.m).toFixed(1)+' '+Y(p.v).toFixed(1);});
    s+='<path d="'+d+'" fill="none" stroke="var(--'+cd+')" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach(p=>{
      s+='<circle cx="'+X(p.m).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="5" fill="var(--card)" stroke="var(--'+cd+')" stroke-width="2.6"/>';
    });
    const last=pts[pts.length-1];
    s+='<text x="'+(X(last.m)-8).toFixed(1)+'" y="'+(Y(last.v)-11).toFixed(1)+'" text-anchor="end" font-size="12" font-weight="700" fill="var(--'+cd+')">'+last.v+M.u+'</text>';
  }
  s+='<line x1="'+L+'" y1="'+(T+ih)+'" x2="'+(W-R)+'" y2="'+(T+ih)+'" stroke="var(--line-2)" stroke-width="1.5"/>';
  s+='<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(T+ih)+'" stroke="var(--line-2)" stroke-width="1.5"/>';
  s+='<text x="'+(L-7)+'" y="'+(T-3)+'" text-anchor="end" font-size="10" fill="var(--text-3)">'+M.u+'</text>';
  return s+'</svg>';
}

      h+='<div class="note warm" style="margin:13px 0 0"><div class="note-i">'+I('info',18)+'</div><div>'

        +'。单次测量波动很常见，先看<b>曲线趋势是否沿着自己的轨道稳定上升</b>；如果连续 2-3 次都偏离，建议在儿保体检时和医生聊一聊。</div></div>';
    else
      h+='<div class="note good" style="margin:13px 0 0"><div class="note-i">'+I('check',18)+'</div><div>各项指标都在 WHO 标准的正常区间内，生长节奏很稳</div></div>';
    h+='</div>';
  }

  h+='<div class="card"><div class="segs" style="margin-bottom:12px">'
    +Object.keys(MEASURES).map(k=>'<button class="seg '+(gTab===k?'on':'')+'" onclick="gTab=\''+k+'\';render()">'+MEASURES[k].n+'</button>').join('')+'</div>';
  h+='<div class="chart-wrap">'+curveSVG(gTab)+'</div>';
  h+='<div class="legend">'
    +'<div class="legend-i"><span class="legend-d" style="background:var(--'+MEASURES[gTab].c+'-deep);height:3px"></span>宝宝的曲线</div>'
    +'<div class="legend-i"><span class="legend-d" style="background:var(--'+MEASURES[gTab].c+'-deep);opacity:.6"></span>WHO P50 中位数</div>'
    +'<div class="legend-i"><span class="legend-d" style="background:var(--'+MEASURES[gTab].c+'-soft);height:9px;border-radius:3px"></span>P3~P97 正常区间</div></div>';
  h+='<div class="t-tag" style="text-align:center;margin-top:9px">横轴为月龄，参照 WHO Child Growth Standards（'+(S.profile.gender==='female'?'女童':'男童')+'）</div>';
  h+='</div>';

  h+='<div class="card"><div class="card-h"><div class="t">测量历史</div><div class="x">'+recs.length+' 次</div></div>';
  if(!recs.length)h+='<div class="empty" style="padding:18px">'+I('ruler',30,'var(--text-3)',1.4)+'<div class="empty-t">还没有测量记录</div></div>';
  recs.forEach(r=>{
    const mf=ageMonthsFloat(p.birthDate,r.measureDate);

    if(r.weightKg)parts.push('体重 '+r.weightKg+'kg');

    if(r.headCm)parts.push('头围 '+r.headCm+'cm');
    h+='<div class="li"><div class="li-b"><div class="li-t">'+r.measureDate+' <span class="tag gray">'+mf.toFixed(1)+' 月龄</span></div>'
      +'<div class="li-s">'+parts.join(' · ')+'</div></div>'
      +'<button class="icon-btn plain" onclick="delGrowth(\''+r.id+'\')">'+I('trash',17)+'</button></div>';
  });
  h+='</div>';
  h+='<div class="note info"><div class="note-i">'+I('info',18)+'</div><div>内置 WHO 儿童生长标准为<b>简表（0-24 月龄，P3/P15/P50/P85/P97）</b>，用于趋势参考。正式评估请以儿保门诊测量与医生判读为准。</div></div>';
  return h;
}

function saveGrowth(){
  const d=document.getElementById('grD').value||today();
  const w=document.getElementById('grW').value,hh=document.getElementById('grH').value,c=document.getElementById('grC').value;
  if(!w&&!hh&&!c){toast('请至少填写一项数据');return;}
  const p=S.profile,mf=ageMonthsFloat(p.birthDate,d);
  const ex=live(S.growth).find(g=>g.measureDate===d);
  const rec=ex||{id:uid(),measureDate:d};
  rec.weightKg=w?+w:(ex?ex.weightKg:null);
  rec.heightCm=hh?+hh:(ex?ex.heightCm:null);
  rec.headCm=c?+c:(ex?ex.headCm:null);
  if(rec.weightKg)rec.weightPercentile=percentileOf('weight',p.gender,mf,rec.weightKg).p;
  if(rec.heightCm)rec.heightPercentile=percentileOf('height',p.gender,mf,rec.heightCm).p;
  if(!ex)S.growth.push(rec);
  S.growth.sort((a,b)=>a.measureDate.localeCompare(b.measureDate));
  save('growth');closeSheet();render();toast(ex?'已更新当日数据':'生长数据已保存');
}
function delGrowth(id){
  confirmDo('删除测量记录','确定删除这条生长记录吗？',()=>{
    const g=S.growth.find(x=>x.id===id);
    if(g){g.deleted=true;g.mtime=Date.now();save('growth');}
    render();toast('已删除');},true);
}

function eduRadarSVG(){
  const keys=Object.keys(EDU_CATS),n=keys.length;
  const cut=addDays(today(),-30);
  const counts=keys.map(k=>S.education.filter(e=>e.category===k&&e.date>=cut).length);
  const max=Math.max(3,...counts);
  const W=340,H=290,cx=W/2,cy=H/2+4,R=95;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];};
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  for(let g=1;g<=4;g++){
    const r=R*g/4;
    let d='';
    for(let i=0;i<n;i++){const[x,y]=pt(i,r);d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}
    s+='<path d="'+d+'Z" fill="'+(g===4?'var(--card-2)':'none')+'" stroke="var(--line)" stroke-width="1"/>';
  }
  for(let i=0;i<n;i++){const[x,y]=pt(i,R);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';}
  let d='';
  counts.forEach((c,i)=>{const[x,y]=pt(i,R*c/max);d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);});
  s+='<path d="'+d+'Z" fill="var(--pink)" fill-opacity=".35" stroke="var(--pink-deep)" stroke-width="2.2" stroke-linejoin="round"/>';
  counts.forEach((c,i)=>{const[x,y]=pt(i,R*c/max);s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4" fill="var(--card)" stroke="var(--pink-deep)" stroke-width="2.2"/>';});
  keys.forEach((k,i)=>{
    const[x,y]=pt(i,R+26);
    const anc=Math.abs(x-cx)<12?'middle':(x>cx?'start':'end');
    s+='<text x="'+(x-(anc==='start'?6:anc==='end'?-6:0)).toFixed(1)+'" y="'+(y+4).toFixed(1)+'" text-anchor="'+anc+'" font-size="11.5" font-weight="600" fill="var(--text-2)">'+EDU_CATS[k].n+'</text>';
    s+='<text x="'+(x-(anc==='start'?6:anc==='end'?-6:0)).toFixed(1)+'" y="'+(y+17).toFixed(1)+'" text-anchor="'+anc+'" font-size="10.5" fill="var(--pink-deep)" font-weight="700">'+counts[i]+' 次</text>';
  });
  return s+'</svg>';
}

/* =======================================================================
   早教分龄方案（0-36 月龄）· 实现模块
   ---------------------------------------------------------------------
   本模块由构建脚本注入到主内联脚本中（见 docs/content/build-inline.js）。
   结构依据：docs/SPEC-早教模块.md §2–§6、DESIGN-早教页.md、ADR-001…009。
   - Layer 1 基准库 EDU_PLAN_KB（纯数据常量，SSOT，离线、不参与同步）
   - Layer 2 AI 增量 S.edu_plan（baby_records 分区，id=m{月龄}，LWW）
   - 合并：白名单 + 硬保护字段固定取基准（mergeMonthPlan / validateIncrement）
   - 兜底：活动数 < 3 → 就近回退最近已补齐档 → 无任何已补齐档才空态
   ======================================================================= */
const EDU_KB_MAXM = 36;                       // 覆盖 0..36 共 37 档
const EDU_FALLBACK_MIN = 3;                   // 活动数 < 3 视为「未补齐」
const EDU_RENDER_MAX = 12;                    // 每档活动清单渲染上限（§2.2）
const EDU_SAFETY_FOOT = '任何活动请全程有成人看护；宝宝出现抽搐、呼吸困难、意识不清、口唇发紫，请立即拨打 120。';
/* 安全词表 SSOT = ADR-006 第 2 层（此处为唯一实现处；ADR-002 §4 只引用，不再复制） */
const EDU_DANGER = /(摇晃|抛接|高高举起|甩|拎起|提拉手|拉坐|脖圈|泳圈|学步车|趴睡|俯卧睡|独留|热水|烫|整粒坚果|果冻|爆米花|硬糖|蜂蜜|加盐|加糖|药物|剂量|按摩囟门|束缚|压迫)/;
const EDU_DOSE = /\d+\s*(mg|ml|IU|毫升|毫克|国际单位|片|粒)/i;

let EDU_SEL = null;      // 当前查看的月龄档
let EDU_GEN = {};        // month -> {mode:'gen'|'done'|'fail'|'manualFail', manual:bool}
let EDU_WHY = {};        // month -> bool（折叠展开态）

/* ---------- 基准库读写 ---------- */
function eduTier(month){
  month = Math.max(0, Math.min(EDU_KB_MAXM, month|0));
  const M = EDU_PLAN_KB.months.find(x => x.m === month);
  return M || { m:month, theme:'', stage:'', focus:[], activities:[], milestones:[], interaction:[], safety:[], warn:[], _missing:true };
}
function eduCoveredMonths(){
  return EDU_PLAN_KB.months.filter(M => (M.activities||[]).length >= EDU_FALLBACK_MIN)
    .map(M => M.m).sort((a,b) => a-b);
}
function eduIsThin(month){ return (eduTier(month).activities||[]).length < EDU_FALLBACK_MIN; }

function resolveFallbackTier(month){
  month = month|0;
  if(!eduIsThin(month)) return null;
  const covered = eduCoveredMonths();          // 升序，等距时先到者（更小月龄）胜出
  let best = null, bd = Infinity;
  for(const m of covered){
    if(m === month) continue;
    const d = Math.abs(m - month);
    if(d < bd){ bd = d; best = m; }
  }
  return best == null ? null : { month:best, fallback:true };
}

function eduEffectiveBase(month){
  const tier = eduTier(month);
  if((tier.activities||[]).length >= EDU_FALLBACK_MIN) return { tier, month:tier.m, fallback:false };
  const fb = resolveFallbackTier(month);
  if(fb) return { tier:eduTier(fb.month), month:fb.month, fallback:true };
  return { tier, month:tier.m, fallback:false };
}

/* ---------- 目录（catalog）与排序 ---------- */
function orderedActivities(acts){
  const order = Object.keys(EDU_CATS);
  const by = {}; order.forEach(k => by[k] = []);
  (acts||[]).forEach(a => { if(by[a.d]) by[a.d].push(a); });
  order.forEach(k => by[k].sort((x,y) => (x.tier||1) - (y.tier||1)));
  const out = []; let idx = 0, more = true;
  while(more){
    more = false;
    for(const k of order){ const arr = by[k]; if(arr[idx]){ out.push(arr[idx]); more = true; } }
    idx++;
  }
  return out.slice(0, EDU_RENDER_MAX);
}
function eduTipOf(inc, id){
  if(!inc || !Array.isArray(inc.activityTips)) return '';
  const hit = inc.activityTips.find(t => t && t.ref === id);
  return hit ? hit.tip : '';
}
function buildCatalog(base, inc){
  const out = orderedActivities(base.activities||[]).map(a => ({
    id:a.id, d:a.d, t:a.t, how:a.how, mins:a.mins, tier:a.tier, src:a.src, ai:false, tip:eduTipOf(inc, a.id)
  }));
  const extras = (inc && inc.extraActivities) || [];
  extras.forEach((x, i) => {
    out.push({
      id:x.id || ('ai-m' + base.m + '-' + (i+1)), d:x.d, t:x.t, how:x.how, mins:x.mins,
      ai:true, why:x.why || '', from:x.from, tip:''
    });
  });
  return out;
}
function eduBaseIndex(base){
  const idx = {}; (base.activities||[]).forEach(a => { idx[a.id] = a; }); return idx;
}
function resolveWeekPlan(items, baseIndex){
  return (items||[]).map(w => {
    const its = (w.items||[]).map(it => {
      const a = baseIndex[it.ref];
      return a ? { ref:it.ref, day:it.day || '', act:a } : null;
    }).filter(Boolean);
    const seen = {}, uniq = [];
    its.forEach(x => { const k = x.ref + '|' + x.day; if(!seen[k]){ seen[k] = 1; uniq.push(x); } });
    if(!uniq.length) return null;
    return { week:w.week, focus:w.focus || '', items:uniq };
  }).filter(Boolean);
}

/* ---------- 运行时校验（安全边界，不可绕过；§3.3） ---------- */
function validateIncrement(o, month){
  const base = eduTier(month);
  const byId = eduBaseIndex(base);
  const out = { focusNote:'', activityTips:[], extraActivities:[], cautions:[], weekPlan:[] };
  let dropped = 0;
  const bad = t => !!t && (EDU_DANGER.test(t) || EDU_DOSE.test(t));
  if(!o || typeof o !== 'object' || Array.isArray(o)) return { ok:false, value:out, dropped:0 };
  for(const k of ['milestones','safety','warn','focus','theme']){ if(k in o) return { ok:false, value:out, dropped:0 }; }

  let fn = typeof o.focusNote === 'string' ? o.focusNote.trim().slice(0,60) : '';
  if(bad(fn)){ fn = ''; dropped++; }
  out.focusNote = fn;

  const tips = Array.isArray(o.activityTips) ? o.activityTips : [];
  tips.slice(0,8).forEach(t => {
    if(!t || typeof t !== 'object'){ dropped++; return; }
    if(typeof t.ref !== 'string' || !byId[t.ref]){ dropped++; return; }
    const tip = typeof t.tip === 'string' ? t.tip.trim().slice(0,120) : '';
    if(!tip || bad(tip)){ dropped++; return; }
    out.activityTips.push({ ref:t.ref, tip:tip });
  });

  const extras = Array.isArray(o.extraActivities) ? o.extraActivities : [];
  extras.slice(0,4).forEach(x => {
    if(!x || typeof x !== 'object'){ dropped++; return; }
    const from = typeof x.from === 'string' ? x.from : '';
    const dom = x.category != null ? x.category : x.d;
    if(!from || !byId[from]){ dropped++; return; }                 // 缺 from / 未命中本档基准活动
    if(dom !== byId[from].d){ dropped++; return; }                 // 领域与锚点不一致
    if(typeof dom !== 'string' || !EDU_CATS[dom]){ dropped++; return; }
    const t = typeof x.name === 'string' ? x.name.trim().slice(0,24) : '';
    const how = typeof x.how === 'string' ? x.how.trim().slice(0,120) : '';
    const mins = x.minutes;
    const why = typeof x.why === 'string' ? x.why.trim().slice(0,80) : '';
    if(!t || !how || !(Number.isInteger(mins) && mins >= 1 && mins <= 30)){ dropped++; return; }
    if(bad(t) || bad(how) || bad(why)){ dropped++; return; }
    out.extraActivities.push({ from:from, d:dom, t:t, how:how, mins:mins, why:why });
  });

  const caut = Array.isArray(o.cautions) ? o.cautions : [];
  caut.slice(0,3).forEach(c => {
    if(!c || typeof c !== 'object'){ dropped++; return; }
    const text = typeof c.text === 'string' ? c.text.trim().slice(0,80) : '';
    const lvl = (c.level === 'watch' || c.level === 'info') ? c.level : 'info';
    if(!text || bad(text)){ dropped++; return; }
    out.cautions.push({ text:text, level:lvl });
  });

  const wp = Array.isArray(o.weekPlan) ? o.weekPlan : [];
  wp.slice(0,5).forEach(w => {
    if(!w || typeof w !== 'object'){ dropped++; return; }
    const wk = w.week;
    if(!(Number.isInteger(wk) && wk >= 1 && wk <= 5)){ dropped++; return; }
    let focus = typeof w.focus === 'string' ? w.focus.trim().slice(0,40) : '';
    if(bad(focus)) focus = '';                                     // 危险文案清除，保留周本身
    const items = [];
    const raw = Array.isArray(w.items) ? w.items : [];
    raw.slice(0,4).forEach(it => {
      if(!it || typeof it !== 'object'){ dropped++; return; }
      const ref = typeof it.ref === 'string' ? it.ref : '';
      if(!ref || !byId[ref]){ dropped++; return; }                 // ref 未命中本档基准活动 id
      const day = (typeof it.day === 'string' && /^(mon|tue|wed|thu|fri|sat|sun)$/.test(it.day)) ? it.day : '';
      if(items.some(x => x.ref === ref)) return;                   // 同周重复去重（不计数）
      items.push(day ? { ref:ref, day:day } : { ref:ref });
    });
    if(!items.length) return;                                      // 空周整段不渲染（不计数）
    out.weekPlan.push({ week:wk, focus:focus, items:items });
  });

  const ok = !!(out.focusNote || out.activityTips.length || out.extraActivities.length || out.cautions.length || out.weekPlan.length);
  return { ok:ok, value:out, dropped:dropped };
}

/* ---------- 合并 ---------- */
function mergeMonthPlan(month, inc){
  month = Math.max(0, Math.min(EDU_KB_MAXM, month|0));
  const selfTier = eduTier(month);
  const eff = eduEffectiveBase(month);
  const base = eff.tier;
  const v = inc ? validateIncrement(inc, base.m) : { ok:false, value:null, dropped:0 };
  const ai = v.ok ? v.value : null;
  const baseIdx = eduBaseIndex(base);
  return {
    month: month,
    tier: selfTier,
    base: base,
    fallback: eff.fallback,
    fallbackFrom: eff.fallback ? base.m : null,
    covered: !eduIsThin(month),
    theme: selfTier.theme || '',
    focus: (selfTier.focus||[]),
    milestones: (selfTier.milestones||[]),
    interaction: (selfTier.interaction||[]),
    safety: (selfTier.safety||[]),
    warn: (selfTier.warn||[]),
    inc: ai,
    dropped: v.dropped,
    layer: ai ? 'enhanced' : 'baseline',
    catalog: buildCatalog(base, ai),
    weekPlan: resolveWeekPlan(ai ? ai.weekPlan : [], baseIdx),
    baseIndex: baseIdx,
    baseCount: orderedActivities(base.activities||[]).length
  };
}
function eduRec(month){
  return (S.edu_plan||[]).find(x => x && x.id === ('m'+month) && !x.deleted) || null;
}

/* ---------- AI 通道（复用既有 fetch / 错误映射语义） ---------- */
async function aiChatRaw(messages, opt){
  opt = opt || {};
  const cfg = S.settings;
  const ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  let timedOut = false;
  const to = setTimeout(() => { timedOut = true; if(ctl) ctl.abort(); }, opt.timeout || 40000);
  const body = Object.assign({
    model: cfg.aiModel || 'gpt-4o-mini',
    messages: messages,
    temperature: (opt.temp != null ? opt.temp : 0.4),
    max_tokens: (opt.maxTokens || 1600)
  }, opt.json ? { response_format:{ type:'json_object' } } : {}, cfg.aiNoThink ? { thinking:{ type:'disabled' } } : {});
  let r;
  try{
    r = await fetch((cfg.aiBaseUrl||'').replace(/\/+$/,'') + '/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + cfg.aiKey },
      signal: ctl ? ctl.signal : undefined,
      body: JSON.stringify(body)
    });
  }catch(e){
    clearTimeout(to);
    if(timedOut) throw new Error('timeout');
    throw new Error('网络/跨域错误（' + (e && e.message ? e.message : '请求被浏览器拦截') + '）—— 请确认 Base URL 正确，且该接口允许浏览器跨域调用');
  }
  clearTimeout(to);
  if(!r.ok){
    let detail = '';
    try{ const j = await r.json(); detail = (j && (j.error && j.error.message || j.message)) || ''; }catch(_){}
    if(r.status === 401) throw new Error('HTTP 401：API Key 无效、未填写或余额不足');
    if(r.status === 404) throw new Error('HTTP 404：接口路径或模型名不存在');
    if(r.status === 400) throw new Error('HTTP 400：' + (detail || '请求参数错误'));
    throw new Error('HTTP ' + r.status + (detail ? ('：' + detail) : ''));
  }
  const j = await r.json();
  const ch = j && j.choices && j.choices[0];
  const t = ch && ch.message && ch.message.content;
  if(!t) throw new Error('返回内容为空');
  if(ch.finish_reason === 'length') throw new Error('length');
  return String(t);
}
function parseIncrement(text){
  let s = String(text || '').trim();
  s = s.replace(/^\uFEFF/, '');
  s = s.replace(/^```[a-zA-Z]*\s*/, '').replace(/```\s*$/, '').trim();
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a < 0 || b <= a) return null;
  try{ return JSON.parse(s.slice(a, b+1)); }catch(e){ return null; }
}
function eduInputDigest(month){
  const cut = addDays(today(), -30);
  const eds = (S.education||[]).filter(e => e && !e.deleted && e.date >= cut);
  const by = {}; eds.forEach(e => { by[e.category] = (by[e.category]||0) + 1; });
  const cov = Object.keys(EDU_CATS).filter(k => by[k]);
  const last = eds.map(e => e.date).sort().pop() || '';
  return { ageMonths:month, eduCount30d:eds.length, coveredDomains:cov, lastEduAt:last };
}
function eduInputHash(month){
  const d = eduInputDigest(month);
  const s = JSON.stringify([d.ageMonths, d.eduCount30d, d.coveredDomains.join(','), d.lastEduAt]);
  let h = 0; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return ('0000000' + h.toString(16)).slice(-8);
}
function eduSystemPrompt(){

function eduUserPrompt(month, base){
  const acts = orderedActivities(base.activities||[]);

async function genEduPlan(month, force){
  const key = 'm' + month;
  if(!force){ const ex = eduRec(month); if(ex) return ex; }
  const eff = eduEffectiveBase(month);
  const base = eff.tier;
  const text = await aiChatRaw(
    [ { role:'system', content: eduSystemPrompt() }, { role:'user', content: eduUserPrompt(month, base) } ],
    { temp:0.4, maxTokens:1600, timeout:40000, json:true }
  );
  const obj = parseIncrement(text);
  const v = validateIncrement(obj, base.m);
  if(!v.ok) throw new Error('invalid');
  const rec = {
    id: key, month: month, baseSchema: EDU_PLAN_KB.schema,
    genAt: Date.now(), genBy: MY_NAME || '', mtime: Date.now(), deleted: false,
    model: S.settings.aiModel || '', inputHash: eduInputHash(month), inputDigest: eduInputDigest(month),
    focusNote: v.value.focusNote,
    activityTips: v.value.activityTips,
    extraActivities: v.value.extraActivities.map((x, i) => Object.assign({ id:'ai-m' + month + '-' + (i+1) }, x)),
    cautions: v.value.cautions,
    weekPlan: v.value.weekPlan,
    dropped: v.dropped
  };
  const arr = S.edu_plan || (S.edu_plan = []);
  const idx = arr.findIndex(x => x && x.id === key);
  if(idx >= 0) arr[idx] = rec; else arr.push(rec);
  save('edu_plan');
  return rec;
}
function eduAiReady(){
  const c = S.settings || {};
  return !!(c.aiEnabled && c.aiBaseUrl && c.aiKey);
}
function eduPlanState(month){
  const rec = eduRec(month);
  const g = EDU_GEN[month];
  if(g && g.mode === 'gen') return 'generating';
  if(!eduAiReady()) return 'baseline';
  if(rec && g && g.mode === 'manualFail') return 'manualFail';
  if(rec) return 'cached';
  if(g && g.mode === 'fail') return 'autoFail';
  return 'baseline';
}
function eduMaybeGenerate(month){
  if(!eduAiReady()) return;
  if(eduRec(month)) return;
  if(EDU_GEN[month]) return;
  EDU_GEN[month] = { mode:'gen', manual:false };
  genEduPlan(month, false).then(() => {
    EDU_GEN[month] = { mode:'done' };
    if(route === 'edu') render();
  }).catch(() => {
    EDU_GEN[month] = { mode:'fail' };
    if(route === 'edu') render();
  });
}
function eduRegen(month){
  if(!eduAiReady()){ toast('尚未接入 AI，去「设置 → AI 大模型接入」开启'); return; }
  EDU_GEN[month] = { mode:'gen', manual:true };
  render();
  genEduPlan(month, true).then(() => {
    EDU_GEN[month] = { mode:'done' };
    if(route === 'edu') render();
    toast('个性化建议已更新');
  }).catch(() => {
    EDU_GEN[month] = { mode:'manualFail' };
    if(route === 'edu') render();
  });
}

   —— 靠 `_lock` 记录，低优先级只能收紧、不能放宽。
   分工边界（SPEC §5.2）：
   - 即时微调：仅「今天」+ slot 晚于当前时刻 + 未打卡 + 未 touched
   - 次日重排：跨天，「今天 + 明天」全量走 mergePlans
   - `adjusted` 字段：即时微调改过的行，次日重排不再二次叠加
