function momHasSym(state, key){
  if(!state || !Array.isArray(state.symptoms)) return false;
  return state.symptoms.indexOf(key) >= 0;
}

/* =====================================================================
   纯函数 1/5 · generateDayPlan —— 生成当日基准计划
   ---------------------------------------------------------------------
   契约（SPEC §3 第 5 条）：
     1) 纯函数：不读 S、不读 Date.now()、不写库、不碰 DOM
     2) 同 (dateStr, state, signals, kb) → **逐字节相同**
     3) id 稳定派生：'mp|'+dateStr+'|'+kind+'|'+slot+'|'+(order||0)
   ===================================================================== */

function momPlanRowId(dateStr, kind, slot, order){
  return momPlanId(dateStr, kind, slot, order);
}
function momHash(str){
  let h = 2166136261;
  for(let i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = (h * 16777619) >>> 0;
  }
  return h >>> 0;
}
function momPick(pool, seedKey){
  if(!pool || !pool.length) return null;
  return pool[momHash(seedKey) % pool.length];
}
function momMakeRow(dateStr, kind, slot, order, content, seed){
  return {
    id: momPlanRowId(dateStr, kind, slot, order),
    date: dateStr,
    kind: kind,
    slot: slot,
    order: order || 0,
    title: content.title || '',
    why: content.why || '',
    items: Array.isArray(content.items) ? content.items.slice() : [],
    count: content.count || null,
    minutes: (kind === 'move') ? (content.minutes == null ? null : content.minutes) : null,
    intensity: (kind === 'move') ? (content.intensity || 'light') : null,
    kcalBand: null,
    src: 'auto',
    touched: false,
    seed: seed,
    done: null,
    doneAt: null,
    skipReason: null,
    execNote: null,
    adjusted: false,
    mtime: 0,
    by: '',
    deleted: false
  };
}

/* 每日条数档位（降档下限 1，上限 3；SPEC §5.1 + 产品 §D.4）
   adjust.level 由 signals/state 推导：3=完整档，2=降一档，1=最低档 */
function momPlanLevel(state, signals){
  let level = 3;
  const s = signals || {}, st = state || {};
  const depr = s.deprivation && s.deprivation.level;
  if(depr === 'severe') level -= 2;
  else if(depr === 'marked') level -= 1;
  if(s.nightFeeds != null && s.nightFeeds >= 4) level -= 1;
  if(st.energy != null && st.energy <= 2) level -= 1;
  if(momHasSym(st, 'lochia')) level -= 1;
  if(momHasSym(st, 'wound_pain')) level -= 1;
  if(s.doneCount > 0) level += 1;
  /* 🔴 闸门未通过时不做任何加减：计划本身已交给就医引导卡（SPEC 裁决 4） */
  return Math.max(MOM_PLAN_MIN_ITEMS, Math.min(3, level));
}

function generateDayPlan(dateStr, state, signals, kb){
  kb = kb || MOM_KB;
  const st = state || null;
  const sg = signals || {};
  const out = [];
  const level = momPlanLevel(st, sg);

  const mealCount = level;
  for(let i = 0; i < mealCount; i++){
    const slot = MOM_MEAL_SLOTS[i];
    const seedKey = 'M|' + dateStr + '|' + slot;
    let c = momPick(kb.meals, seedKey);
    if(momHasSym(st, 'breast_pain') && c && c.id === 'warm_drink'){
      const alt = (kb.meals || []).filter(x => x.id !== 'warm_drink');
      c = momPick(alt, seedKey + '|alt');
    }
    if(!c) continue;
    out.push(momMakeRow(dateStr, 'meal', slot, i, c, 'M|' + c.id + '|' + dateStr + '|L' + level));
  }

  const moveCount = level;
  const usedIds = {};
  for(let i = 0; i < moveCount; i++){
    const slot = MOM_MOVE_SLOTS[i];
    const seedKey = 'V|' + dateStr + '|' + slot;
    let pool = (kb.moves || []).filter(m => !usedIds[m.id]);
    if(i === 0){
      const feedPool = pool.filter(m => m.bind === 'feed');
      if(feedPool.length) pool = feedPool;
    }
    if(!pool.length) pool = (kb.moves || []).filter(m => !usedIds[m.id]);
    if(st && Array.isArray(st.symptoms)){
      const banned = {};
      st.symptoms.forEach(k => (kb.symptomExclude && kb.symptomExclude[k] ? kb.symptomExclude[k] : []).forEach(t => banned[t] = 1));
      const filtered = pool.filter(m => !banned[m.tag]);
      if(filtered.length) pool = filtered;
    }
    let c = momPick(pool, seedKey);
    if(!c) break;
    usedIds[c.id] = 1;
    out.push(momMakeRow(dateStr, 'move', slot, i, c, 'V|' + c.id + '|' + dateStr + '|L' + level));
  }
  return out;
}

/* =====================================================================
   纯函数 2/5 · applyRules —— 规则表驱动调整
   ---------------------------------------------------------------------
   契约（SPEC §3 第 6 条）：
     1) 纯函数
     2) 按 pri 升序应用（数字小=优先级高）；高优先级 cap/exclude **不可被低覆盖**
     3) 结果去重：同 slot 同 title 只保留一条
     4) 被规则改动的行：touched 保持原值、adjusted 置 true、记录 why
   实现要点：**两阶段**——先按 pri 升序把所有命中规则的约束收进「约束集」，
   再一次性施加。这样优先级只体现在「谁先写入约束集」，不会因逐条 filter
   产生顺序依赖。
   ===================================================================== */
function applyRules(basePlan, signals, state){
  const rules = MOM_RULES.slice().sort((a, b) => a.pri - b.pri);   // pri 小 = 优先级高
  const src = Array.isArray(basePlan) ? basePlan : [];
  const sg = signals || {};
  const st = state || null;
  const env = Object.assign({}, sg, { state: st, redline: sg.redline || null });

  const rows = src.map(r => Object.assign({}, r, { items: (r.items || []).slice() }));
  const applied = [];

  let cap = null;                   // 强度上限（rank 越小越轻）
  const excludeIds = {};            // 排除的池 id
  const excludeTags = {};           // 排除的动作 tag
  const skipSlots = {};             // 排除的时段 slot
  let maxMinutes = null;            // 单项时长上限（取所有命中规则中的最小）
  let maxItems = null;              // 条数上限（取最小）
  let keepTags = null;              // 只保留这些 tag（首个命中的规则说了算）
  let keepMeals = null;             // 只保留这些饮食池 id（首个命中的规则说了算）

  for(const rule of rules){
    let hit = false;
    try { hit = !!rule.when(env); } catch(e){ hit = false; }
    if(!hit) continue;
    const T = rule.then || {};
    const mv = T.move || {}, ml = T.meal || {};

    if(mv.cap && (cap == null || MOM_INTENSITY_RANK[mv.cap] < MOM_INTENSITY_RANK[cap])) cap = mv.cap;
    if(Array.isArray(mv.excludeIds)) mv.excludeIds.forEach(k => excludeIds[k] = 1);
    if(Array.isArray(mv.excludeTags)) mv.excludeTags.forEach(k => excludeTags[k] = 1);
    if(Array.isArray(mv.skipSlots)) mv.skipSlots.forEach(k => skipSlots[k] = 1);
    if(mv.maxMinutes != null && (maxMinutes == null || mv.maxMinutes < maxMinutes)) maxMinutes = mv.maxMinutes;
    if(mv.maxItems != null && (maxItems == null || mv.maxItems < maxItems)) maxItems = mv.maxItems;
    if(keepTags == null && Array.isArray(mv.keepTags) && mv.keepTags.length) keepTags = mv.keepTags.slice();
    if(keepMeals == null && Array.isArray(ml.keep) && ml.keep.length) keepMeals = ml.keep.slice();
    if(Array.isArray(ml.exclude)) ml.exclude.forEach(k => excludeIds[k] = 1);

    applied.push({ id:rule.id, why:rule.why || '' });
  }
  if(!applied.length) return rows;   // 无命中：原样返回（保持引用等价性便于测试）

  let out = rows.slice();
  out = out.filter(r => !skipSlots[r.slot]);
  out = out.filter(r => {
    if(r.kind === 'move'){
      const km = momKbMoveOf(r, env.kb);
      if(km && (excludeIds[km.id] || excludeTags[km.tag])) return false;
    }
    return true;
  });
  out = out.filter(r => {
    if(r.kind === 'meal'){
      const kmm = momKbMealOf(r, env.kb);
      if(kmm && excludeIds[kmm.id]) return false;
    }
    return true;
  });
  if(maxMinutes != null){
    out = out.filter(r => !(r.kind === 'move' && r.minutes != null && r.minutes > maxMinutes));
  }
  if(keepTags){
    const narrowed = out.filter(r => {
      if(r.kind !== 'move') return true;
      const km = momKbMoveOf(r, env.kb);
      return km && keepTags.indexOf(km.tag) >= 0;
    });
    if(narrowed.some(r => r.kind === 'move')) out = narrowed;
  }
  if(keepMeals){
    const narrowed = out.filter(r => {
      if(r.kind !== 'meal') return true;
      const kmm = momKbMealOf(r, env.kb);
      return kmm && keepMeals.indexOf(kmm.id) >= 0;
    });
    if(narrowed.some(r => r.kind === 'meal')){
      out = narrowed;
    }else{
      const pool = keepMeals
        .map(id => (env.kb && env.kb.meals ? env.kb.meals : MOM_KB.meals).find(m => m.id === id))
        .filter(Boolean);
      if(pool.length){
        let mi = 0;
        out = out.map(r => {
          if(r.kind !== 'meal') return r;
          const c = pool[Math.min(mi++, pool.length - 1)];
          return Object.assign({}, r, {
            title: c.title, why: c.why, items: (c.items || []).slice(), seed: 'K|' + c.id
          });
        });
      }
    }
  }
  if(maxItems != null){
    let n = 0;
    const capped = out.filter(r => {
      if(r.kind !== 'move') return true;
      n++;
      return n <= Math.max(MOM_PLAN_MIN_ITEMS, maxItems);
    });
    if(capped.some(r => r.kind === 'move')) out = capped;
  }
  if(cap != null){
    out.forEach(r => {
      if(r.kind !== 'move' || r.intensity == null) return;
      if(MOM_INTENSITY_RANK[r.intensity] > MOM_INTENSITY_RANK[cap]) r.intensity = cap;
    });
  }

  const seenSlot = {}, seenTitle = {};
  out = out.filter(r => {
    const ks = r.kind + '|' + r.slot, kt = r.kind + '|' + r.title;
    if(seenSlot[ks] || seenTitle[kt]) return false;
    seenSlot[ks] = 1; seenTitle[kt] = 1;
    return true;
  });

  const counters = { meal:0, move:0 };
  out.forEach(r => {
    if(r.kind === 'meal' || r.kind === 'move'){
      const o = counters[r.kind]++;
      r.order = o;
      r.id = momPlanRowId(r.date, r.kind, r.slot, o);
    }
  });

  const why = (applied[0] && applied[0].why) || '';
  out.forEach(r => {
    r.adjusted = true;
    if(!r.whyChanged) r.whyChanged = why;
  });
  out.ruleNotes = applied.map(x => ({ id:x.id, why:x.why }));
  return out;
}
function momKbMealOf(row, kb){
  kb = kb || MOM_KB;
  if(!row || row.kind !== 'meal') return null;
  return (kb.meals || []).find(x => x.title === row.title) || null;
}
function momKbMoveOf(row, kb){
  kb = kb || MOM_KB;
  if(!row || row.kind !== 'move') return null;
  return (kb.moves || []).find(x => x.title === row.title) || null;
}

/* =====================================================================
   纯函数 3/5 · mergePlans —— 三段式合并（touched 是硬保护位）
   ---------------------------------------------------------------------
   契约（SPEC §3 第 7 条 + 技术调研 D.3）：
     ── 保留（不覆盖）──
     1) touched===true 的行：原样保留
     2) done!==null 的行：原样保留（已打卡记录不可改，否则打卡失去所指）
     3) 历史日（date < 目标日）的行：原样保留
     ── 合并 ──
     4) 未 touched 且未打卡的行：用 generated 同 (kind,slot) 的新内容替换
        title/why/items/count/minutes/intensity，**保留原 id 与 done**
     ── 新增/删除 ──
     5) generated 有而 existing 无的 (kind,slot)：新增
     6) existing 未 touched 未打卡但 generated 已无该 slot：软删（deleted=true）
     ── 幂等 ──
     7) f(x) = f(f(x))
   ===================================================================== */
function mergePlans(existing, generated, dateStr, kb){
  const ex = (Array.isArray(existing) ? existing : []).filter(Boolean);
  const gen = (Array.isArray(generated) ? generated : []).filter(Boolean);
  const out = [];
  const others = ex.filter(r => r.date !== dateStr || r.kind === 'stat');
  const sameDay = ex.filter(r => r.date === dateStr && r.kind !== 'stat');

  const protectedRows = sameDay.filter(r => momIsProtected(r, dateStr));
  const mutableRows = sameDay.filter(r => !momIsProtected(r, dateStr));

  const usedGen = {};
  const result = [];
  const resultKeys = {};
  protectedRows.forEach(r => {
    const key = r.kind + '|' + r.slot;
    resultKeys[key] = 1;
    result.push(r);
  });
  const protectedKeys = resultKeys;

  const gMap = {};
  gen.forEach(g => { gMap[g.kind + '|' + g.slot] = g; });
  mutableRows.forEach(r => {
    const key = r.kind + '|' + r.slot;
    if(protectedKeys[key]) return;           // 该槽位已被受保护行占据 → 丢弃这条可改行（不重复渲染）
    const g = gMap[key];
    if(g){
      usedGen[key] = 1;
      result.push(Object.assign({}, r, {
        title: g.title, why: g.why, items: (g.items || []).slice(),
        count: g.count, minutes: g.minutes, intensity: g.intensity, kcalBand: g.kcalBand,
        seed: g.seed
      }));
    }else{
      result.push(Object.assign({}, r, { deleted: true }));
    }
  });

  gen.forEach(g => {
    const key = g.kind + '|' + g.slot;
    if(protectedKeys[key] || usedGen[key]) return;
    result.push(Object.assign({}, g));
  });

  return others.concat(result);
}
function momIsProtected(r, dateStr){
  if(!r) return false;
  if(r.touched === true) return true;
  if(r.done !== null && r.done !== undefined) return true;
  if(r.date && dateStr && r.date < dateStr) return true;
  return false;
}

/* =====================================================================
   纯函数 4/5 · prunePlans —— 60 天裁剪 + (ISO周, kind) 聚合
   ---------------------------------------------------------------------
   契约（SPEC §3 第 8 条 + 技术调研 A.4）：
     1) date >= today - keepDays：原样保留
     2) date <  today - keepDays：按 (ISO周, kind) 聚合成 {kind:'stat', week, planned, done, skipped}
     3) 汇总行 id 稳定：'stat|' + week + '|' + kind
     4) 已是 kind:'stat' 的行幂等保留（不二次聚合）
     5) 幂等：f(x) = f(f(x))
   🔴 必须实现（不是「以后优化」）：1 年 2,190 行 ≈ 657 KB → 会撞 localStorage 5 MB 配额
   ===================================================================== */
function momIsoWeek(dateStr){
  const d = parseD(dateStr);
  if(!d) return '';
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = (t.getDay() + 6) % 7;              // 周一 = 0
  t.setDate(t.getDate() - day + 3);              // 移到本周周四
  const isoYear = t.getFullYear();
  const jan4 = new Date(isoYear, 0, 4);
  const jan4Day = (jan4.getDay() + 6) % 7;
  const week1Thu = new Date(isoYear, 0, 4 - jan4Day + 3);
  const week = 1 + Math.round((t - week1Thu) / (7 * 864e5));
  return isoYear + '-W' + (week < 10 ? '0' + week : week);
}
function momStatRowId(week, kind){ return momStatId(week, kind); }
function momStatTitle(week, kind){
  return '第 ' + momWeekNum(week) + ' 周 · ' + (kind === 'meal' ? '饮食' : '运动');
}
function prunePlans(rows, todayStr, opts){
  const o = opts || {};
  const keepDays = (o.keepDays == null) ? MOM_PLAN_MAX_DAYS : o.keepDays;
  const arr = Array.isArray(rows) ? rows : [];
  if(!todayStr) todayStr = today();
  const cutoff = addDays(todayStr, -keepDays);   // date >= cutoff 保留明细

  const keep = [];      // 明细：保留
  const stats = [];     // 汇总行：原样透传（**不参与任何聚合**，否则二次调用会重复计数）
  const old = [];       // 明细：待聚合
  arr.forEach(r => {
    if(!r) return;
    if(r.kind === 'stat'){ stats.push(r); return; }
    if(r.date && r.date >= cutoff) keep.push(r);
    else old.push(r);
  });

  const bucket = {};
  old.forEach(r => {
    const w = momIsoWeek(r.date);
    const k = r.kind + '|' + w;
    if(!bucket[k]) bucket[k] = { week:w, kind:r.kind, planned:0, done:0, skipped:0 };
    const b = bucket[k];
    b.planned++;
    if(r.done === true) b.done++;
    else if(r.done === false) b.skipped++;
  });

  const statMap = {};
  const statOrder = [];
  const pushStat = (key, week, srcKind, planned, done, skipped, srcRow) => {
    if(!statMap[key]){
      statMap[key] = {
        id: momStatRowId(week, srcKind),
        date: (srcRow && srcRow.date) ? srcRow.date : addDays(todayStr, -keepDays),
        kind: 'stat',
        srcKind: srcKind,
        slot: 'week',
        order: 0,
        week: week,
        planned: planned,
        done: done,
        skipped: skipped,
        title: momStatTitle(week, srcKind),
        src: 'auto',
        touched: false,
        seed: 'stat',
        doneFlag: null,
        adjusted: false,
        mtime: (srcRow && srcRow.mtime) || 0,
        by: (srcRow && srcRow.by) || '',
        deleted: !!(srcRow && srcRow.deleted)
      };
      statOrder.push(key);
    }else{
      const s = statMap[key];
      s.planned += planned; s.done += done; s.skipped += skipped;
    }
  };
  const seenStat = {};
  stats.forEach(r => {
    const srcKind = r.srcKind || (r.id ? String(r.id).split('|')[2] : null) || 'meal';
    const w = r.week || momIsoWeek(r.date);
    const key = w + '|' + srcKind;
    if(seenStat[key]){                      // 同周同类型的重复 stat 行 → 归并（不新增行）
      const s = statMap[key];
      s.planned += (r.planned || 0); s.done += (r.done || 0); s.skipped += (r.skipped || 0);
      return;
    }
    seenStat[key] = 1;
    pushStat(key, w, srcKind, r.planned || 0, r.done || 0, r.skipped || 0, r);
  });
  Object.keys(bucket).forEach(key => {
    const b = bucket[key];
    pushStat(key, b.week, b.kind, b.planned, b.done, b.skipped, null);
  });

  return keep.concat(statOrder.map(k => statMap[k]));
}
function momWeekNum(week){
  const m = /-W(\d+)$/.exec(String(week || ''));
  return m ? m[1] : '';
}

/* =====================================================================
   纯函数 5/5 · planProgress —— 进度计算
   ---------------------------------------------------------------------
   契约（SPEC §3 第 11 条 + §6.2 禁忌）：
     - 只输出**正向事实**（已记 N 件），**不输出分母形式**（严禁 '2/3'）
     - 空数据返回中性结果，不做任何负向措辞
   ===================================================================== */
function planProgress(rows, dateStr){
  const arr = (Array.isArray(rows) ? rows : []).filter(r => !r.deleted);
  const day = arr.filter(r => r.date === dateStr && r.kind !== 'stat');
  const doneList = day.filter(r => r.done === true);
  const mealDone = doneList.filter(r => r.kind === 'meal').length;
  const moveDone = doneList.filter(r => r.kind === 'move').length;
  return {
    date: dateStr,
    planned: day.length,
    done: doneList.length,
    mealDone: mealDone,
    moveDone: moveDone,
    anyDone: doneList.length > 0,
    backUp: doneList.length > 0,
    ids: doneList.map(r => r.id)
  };
}

 {k:['母乳','不够','奶水','下奶','追奶','奶量','吃饱'],q:'怎么判断母乳够不够宝宝吃？',a:'主要看这几点：① 小便次数：出生1周后每天尿湿6片以上且尿色浅；② 大便：母乳喂养宝宝大便金黄软糊；③ 体重：前3个月每月增重约600-1000g，或每周≥125g；④ 吃完后宝宝满足、能睡1.5-3小时。若长期尿少、体重不增、哭闹多，建议儿保医生评估，先排查衔乳姿势和喂养频次（每天8-12次），不要盲目加奶粉。',s:'中国0-6岁儿童健康管理服务规范 / WHO母乳喂养指南'},
 {k:['配方奶','奶粉','混合','人工','选奶','一段','二段'],q:'母乳不足时怎么选配方奶？',a:'优先保证母乳喂养，不足部分用婴儿配方奶补充，不要给1岁内宝宝喝鲜奶或普通牛奶。选择正规渠道的一段（0-6月）或二段（6-12月）配方奶，按说明冲调（先水后粉、水温约40-50℃），不要额外加浓。转奶或换品牌时逐步过渡，观察消化与过敏。',s:'中国居民膳食指南（婴幼儿部分）'},
 {k:['喂奶量','每次吃多少','频次','间隔','多久喂','喂几次'],q:'小婴儿每次吃多少、多久喂一次？',a:'按需喂养，不严格定时。大致参考：每天喂8-12次；配方奶出生第1周每次约30-60ml，随周龄增加，1-3月每次90-150ml、约每3-4小时一次。以宝宝饥饱信号（张嘴、觅食）和尿量体重为准，而非死板按毫升。',s:'AAP 喂养建议 / 中国膳食指南'},
 {k:['吐奶','溢奶','呛','反流','喷'],q:'宝宝经常吐奶正常吗？',a:'小婴儿贲门松弛，溢奶吐奶很常见，多数到6-12月自然好转。缓解：喂奶时头高位、少量多餐、喂完竖抱拍嗝15-20分钟、避免立刻平躺。警惕：若呕吐呈喷射状、含胆汁（绿色）或血丝、体重不增、哭闹拒食，需就医。',s:'诸福棠实用儿科学'},
 {k:['肠绞痛','胀气','肠痉挛','哭闹不止','黄昏闹','频繁哭闹','肠胀气'],q:'宝宝傍晚哭得厉害、肚子胀，是肠绞痛吗？',a:'肠绞痛多发生在2周-4月宝宝，表现为每天固定时段（常傍晚）持续哭闹≥3小时、≥3天/周，难以安抚，但吃睡体重基本正常。可尝试：飞机抱、顺时针揉腹、排气操、I Love You 腹部按摩、白噪音、襁褓包裹。多数4-6月自愈。若伴发热、血便、呕吐、精神差要就医。',s:'诸福棠实用儿科学 / AAP'},
 {k:['拍嗝','嗝','竖抱'],q:'每次喂奶都要拍嗝吗？',a:'建议每次喂奶中间和结束后竖抱拍嗝10-15分钟，尤其易吐奶的宝宝。手法：让宝宝趴肩头或坐腿上，空心掌由下往上轻拍背部。不打出嗝也没关系，竖抱一会儿即可，关键是喂完别马上平躺。',s:'育儿护理常规'},
 {k:['辅食','添加辅食','什么时候加辅食','满6月','第一口'],q:'什么时候给宝宝加辅食？',a:'通常满6月龄（约180天）开始添辅食，同时满足：能抬头稳、靠坐、挺舌反射消失、对食物表现出兴趣。最早不早于4月，最晚不晚于6月。第一口建议富铁食物（强化铁米粉、肉泥），而非蛋黄或米汤。',s:'中国居民膳食指南（婴幼儿部分） / WHO'},
 {k:['辅食','米粉','肉泥','蛋黄','蔬菜','水果','顺序','怎么加'],q:'辅食先加什么、怎么加？',a:'由单一到多样、由稀到稠、由细到粗。顺序举例：强化铁米粉→菜泥（南瓜、胡萝卜、西兰花）→果泥（苹果、香蕉）→肉泥（禽畜肉、鱼）→蛋黄（约8月后可试，从1/4起）。每次只加一种新食物，观察3天无过敏再添下一种。1岁内不加盐、糖、蜂蜜、整粒坚果。',s:'中国居民膳食指南 / 诸福棠'},
 {k:['过敏','湿疹','起疹','腹泻','便血','新食物','过敏原'],q:'加新食物后怎么判断过敏？',a:'常见过敏表现：口周或全身皮疹、呕吐、腹泻、便血、喘息、口唇肿胀，重者可过敏性休克。新食物每次只加一种、连续观察3天；出现疑似过敏立即停该食物并记录。轻度可观察，反复或严重（呼吸困难、面肿）立即就医。',s:'AAP / 中国儿童保健'},
 {k:['维生素D','VD','D3','补剂','缺钙'],q:'宝宝要不要补维生素D？',a:'要。足月儿出生后数天起每天补充维生素D 400 IU（国际单位），母乳喂养和配方奶都建议补（配方奶若每天达1000ml可酌情减），至少补到2岁，早产儿遵医嘱加量。维生素D促进钙吸收、防佝偻病。它与钙剂不是一回事，正常喂养一般不额外补钙。',s:'中国0-6岁儿童健康管理服务规范'},
 {k:['DHA','铁','贫血','缺铁','补铁'],q:'需要补DHA和铁吗？',a:'DHA：母乳和配方奶通常已含，足月儿一般无需额外补；添加辅食后多吃富含DHA的鱼类即可。铁：满6月后体内储存铁逐渐耗尽，应通过富铁辅食（红肉泥、肝泥、强化铁米粉）补充，必要时遵医嘱补铁剂；早产儿、低体重儿更早需补铁。具体剂量遵儿保医生。',s:'中国膳食指南 / 儿保规范'},
 {k:['睡眠','安全睡眠','趴睡','仰卧','襁褓','夜醒','睡整觉','婴儿床'],q:'怎么让宝宝睡得安全？',a:'安全睡眠要点：① 始终仰卧睡觉（1岁内），不要趴睡；② 单独睡婴儿床，与父母同房不同床；③ 床垫硬实、不加枕头和松软被褥、可用睡袋防踢被；④ 远离二手烟。可降低婴儿猝死综合征（SIDS）风险。夜醒多为正常发育现象，随月龄减少。',s:'AAP 安全睡眠指南 / 中国儿保规范'},
 {k:['睡眠','睡多久','睡眠时长','新生儿睡'],q:'宝宝每天该睡多久？',a:'大致参考：新生儿（0-3月）每天14-17小时（含多次小睡）；4-12月约12-16小时；1-2岁约11-14小时。个体差异大，看宝宝精神、发育和清醒时状态更重要，不必强求。建立固定睡前程序（洗澡、抚触、关灯、轻哼）有助规律作息。',s:'AAP / 中国儿童睡眠健康'},
 {k:['哄睡','抱睡','奶睡','自主入睡','睡渣'],q:'宝宝非要抱着睡、奶睡怎么办？',a:'抱睡、奶睡短期能用，但长期易形成依赖。可逐步培养自主入睡：建立固定睡前程序；困但还醒时放床；用轻拍、白噪音、安抚物替代怀抱；逐步拉长响应间隔（循序渐进、别硬熬）。6月后可训练，注意方式温和、保证安全感。',s:'育儿指导 / AAP'},
 {k:['疫苗','接种','程序','一类','二类','时间表','什么时候打','免疫规划'],q:'宝宝疫苗怎么安排？',a:'按《国家免疫规划疫苗儿童免疫程序表（2021年版）》：出生接种乙肝疫苗第1针和卡介苗；1、2、3、4、5、6月各1针乙肝；2、3、4月脊灰；3、4、5月百白破；以及麻腮风、乙脑、流脑、甲肝、白破等（具体以程序表为准）。本工作台「提醒」页已按宝宝生日自动推算。一类免费，二类（如13价肺炎、轮状、手足口、流感）自费自愿。',s:'国家免疫规划疫苗程序表（2021版）'},
 {k:['疫苗','接种后','发热','红肿','反应','硬结'],q:'打完疫苗发烧、针眼红肿正常吗？',a:'多数轻微：低热（＜38.5℃）、注射部位红肿硬结、烦躁嗜睡，1-2天自行缓解。护理：多休息、适当补水、红肿处可冷敷（勿揉）。需就医：体温≥38.5℃持续、高热不退、抽搐、呼吸困难、广泛皮疹、异常哭闹不止。接种后留观30分钟再离开。',s:'免疫接种规范 / 诸福棠'},
 {k:['疫苗','禁忌','感冒','能打','推迟'],q:'宝宝有点感冒或腹泻能打疫苗吗？',a:'一般轻症（如轻微流涕、咳嗽、低烧已退）可正常接种；若正发热、处于急性病期、严重湿疹或既往疫苗严重过敏，应暂缓并咨询医生。具体以接种门诊评估为准，不要自行判断后长期拖延一类疫苗。',s:'免疫接种规范'},
 {k:['发育','抬头','翻身','坐','爬','站','走','里程碑','大运动','不会'],q:'宝宝各阶段大运动大概什么时候会？',a:'大致范围（个体差异大）：抬头1-2月、翻身3-5月、独坐5-7月、爬行7-10月、扶站9-12月、独走12-18月。早产宝宝按矫正月龄评估。若明显落后（如6月不会抬头、9月不会坐、18月不会走）或一侧肢体活动少，建议儿保评估。',s:'中国0-6岁儿童健康管理服务规范 / AAP'},
 {k:['语言','说话','发音','咿呀','第一个词','不说话'],q:'宝宝语言发育有什么规律？',a:'0-3月会笑出声、发啊哦；4-6月咿呀学语（ba ma da）；7-12月能听懂简单指令、模仿发音、约10-14月说第一个有意义词；1岁半词汇约10-20个。多和宝宝面对面说话、读绘本、回应其发音有助语言发展。明显落后（如1岁无意识发音、2岁不会说词）建议评估。',s:'中国儿保规范 / AAP'},
 {k:['早教','互动','陪玩','亲子','游戏','怎么陪'],q:'平时怎么和宝宝互动好？',a:'高质量陪伴胜过刻意早教：多面对面说话唱歌、做表情回应；清醒时每天累计短多次俯卧抬头练习；追视摇铃、看黑白卡；抚触按摩；读绘本；让宝宝在安全环境自由探索。重点是敏感回应宝宝信号、提供爱与安全感，而非超前灌输知识。',s:'早教指南 / AAP'},
 {k:['发热','发烧','体温','退热','高烧'],q:'宝宝发烧怎么办？',a:'先测准体温（肛温、耳温较准，腋温偏低约0.5℃）。38.5℃以下、精神好可先物理降温（减衣、温水擦、多补水），不必急着退烧药；≥38.5℃或明显不适可用对乙酰氨基酚（≥2月）或布洛芬（≥6月），按体重算剂量、间隔≥4-6小时，不交替滥用。3月内婴儿发热、高热不退、精神萎靡、抽搐、皮疹瘀点立即就医。',s:'诸福棠实用儿科学 / 中国儿童发热指南'},
 {k:['退烧药','对乙酰氨基酚','布洛芬','用药','剂量'],q:'退烧药怎么用安全？',a:'对乙酰氨基酚（≥2月龄）和布洛芬（≥6月龄）是儿童常用退烧药，按体重算剂量，24小时不超过4次、间隔≥4-6小时；不可两种混用或随意交替；不要用阿司匹林（瑞氏综合征风险）；不推荐酒精擦浴、捂汗。用药后精神差、持续高热或出现新症状及时就医。',s:'中国儿童发热规范 / 诸福棠'},
 {k:['咳嗽','鼻塞','感冒','鼻涕','鼻炎','流鼻涕'],q:'宝宝鼻塞、咳嗽怎么护理？',a:'多为普通感冒，自限。护理：生理盐水滴鼻或吸鼻器清理、抬高上半身、空气保湿、多喂母乳或水。不推荐2岁内用非处方复方感冒咳嗽药和镇咳药。若出现呼吸急促、喘息、持续高热、吃奶差、口唇青紫、精神差，或咳嗽超过1-2周加重，就医。',s:'AAP / 诸福棠'},
 {k:['腹泻','拉肚子','便稀','脱水','蛋花'],q:'宝宝腹泻怎么处理？',a:'关键是防脱水：继续母乳或配方奶，口服补液盐（ORS）少量多次；观察尿量减少、囟门凹陷、口唇干、精神差等脱水征。便后温水洗屁屁防红臀。若出现血便、高热、频繁呕吐、尿极少、嗜睡，立即就医。不自行用止泻药。',s:'诸福棠 / 中国腹泻病诊疗'},
 {k:['黄疸','皮肤黄','胆红素','黄'],q:'新生儿黄疸要紧吗？',a:'生理性黄疸多在出生后2-3天出现、2周内消退，多吃多排、适当避强直射强光的户外有助。需就医：出生24小时内出现、黄疸重或蔓延快、手足心发黄、伴嗜睡拒奶、大便发白、超过2周不退（母乳性或早产需医生判断）。监测胆红素，必要时光疗，谨防胆红素脑病。',s:'中国新生儿保健 / 诸福棠'},
 {k:['湿疹','皮疹','皮肤干','红疹','护肤','奶癣'],q:'宝宝湿疹（奶癣）怎么护理？',a:'核心是保湿加避刺激：每天涂婴儿润肤霜2-3次（沐浴后趁湿涂）；洗澡水温37℃左右、不超过10分钟、用温和沐浴露；穿纯棉、避免过热出汗；严重时遵医嘱用弱效激素药膏（短期规范用安全），不轻信纯天然偏方。母乳妈妈一般不必盲目忌口。',s:'中国儿童特应性皮炎指南 / AAP'},
 {k:['红屁股','尿布疹','臀红','尿布'],q:'宝宝红屁股（尿布疹）怎么办？',a:'预防为主：勤换尿布、便后温水洗、轻拍干、涂含氧化锌的护臀霜隔离；尽量晾屁屁。已发红：加强护理加氧化锌，若破溃渗液、伴白色念珠菌感染（边缘隆起小疹）或化脓，就医。少用湿巾反复擦。',s:'育儿护理常规 / 诸福棠'},
 {k:['洗澡','水温','频率','新生儿洗澡','几天洗'],q:'宝宝多久洗一次澡、水温多少？',a:'新生儿建议隔天或每周2-3次，不必每天；水温37-38℃（手肘试温不烫）；室温26℃左右；每次5-10分钟；用温和无泪配方沐浴露，清水也可；重点洗颈褶、腋下、腹股沟、屁股。脐带未脱落前注意防水，脱落后保持干燥。',s:'中国儿保规范 / 育儿护理'},
 {k:['抚触','按摩','亲子依恋','怎么做'],q:'抚触按摩对宝宝有什么好处？',a:'规律抚触有助神经系统发育、改善睡眠、缓解肠绞痛、增强亲子依恋。每次10-15分钟、宝宝清醒愉悦时做；手法轻柔，配合抚触油；顺序可做 I Love You 腹部按摩加四肢向心按摩。宝宝抗拒、哭闹或刚吃完奶则暂停。',s:'早教/抚触指南'},
 {k:['出牙','长牙','流口水','牙龈','咬','磨牙'],q:'宝宝出牙不适怎么缓解？',a:'多数4-10月出牙，流口水、爱咬、烦躁、低热（＜38℃）常见。缓解：干净牙胶冷敷、磨牙棒（不过度甜）、干净手指轻按摩牙龈；保持口周干爽防口水疹。若高热、腹泻、明显精神差，不一定是出牙，要排查其他疾病。',s:'中国儿保规范 / AAP'},
 {k:['坠床','摔','磕','撞','安全','掉下'],q:'宝宝从床上摔下来要紧吗？',a:'先别慌，观察：若立刻大哭、意识清、无呕吐，多无大碍，后续24-48小时留意有无嗜睡、呕吐、抽搐、瞳孔不等大、耳鼻流出血性脑脊液、烦躁尖叫。出现任一立即就医（警惕颅内出血）。平时加床护栏、地垫，不单独留宝宝在高处。',s:'儿童意外伤害防护 / 诸福棠'},
 {k:['呛','异物','噎','窒息','海姆立克','卡住'],q:'怎么预防宝宝呛咳和异物窒息？',a:'1岁内不吃整粒坚果、葡萄、果冻、爆米花、硬糖；食物切小、碾碎；吃奶时头高位、不逗笑嬉闹；小物件放高处防误吞。一旦呛噎窒息（不能哭不能呼吸），1岁内用背部拍击5次加胸部冲击5次交替，并立即呼救或打120。',s:'儿童异物窒息急救 / AAP'},
 {k:['晒太阳','户外','维生素D合成','日光'],q:'多晒太阳能补维生素D吗？',a:'皮肤日照可合成维生素D，但婴幼儿皮肤娇嫩，不推荐刻意暴晒（有晒伤和皮肤癌风险），且受季节、纬度、防晒影响不稳定。仍建议按规范每天补400 IU维生素D，而非靠晒太阳。适度户外活动好处是感官与运动发育，每天可安排。',s:'AAP / 中国儿保规范'},

function aiEmergency(q){

function aiSearch(q){
  q=(q||'').toLowerCase();
  const scored=KB.map(x=>{
    let s=0;
    x.k.forEach(k=>{if(q.indexOf(k.toLowerCase())>=0)s+=2;});
    if(s===0&&q.length>1){ // 弱匹配：答案或问题里出现查询片段
      if((x.q+x.a).toLowerCase().indexOf(q)>=0)s+=1;
    }
    return {x,s};
  }).filter(o=>o.s>0).sort((a,b)=>b.s-a.s);
  return scored.slice(0,3).map(o=>o.x);
}

function buildBabyContext(){

async function aiCallLLM(history){
  const cfg=S.settings;

    if(m.role==='ai')return {role:'assistant',content:m.content};

      const content=[];
      if(m.content)content.push({type:'text',text:m.content});
      content.push({type:'image_url',image_url:{url:m.img}});
      return {role:'user',content:content};
    }
    return {role:'user',content:m.content};
  }));
  let r;
  try{
    r=await fetch(cfg.aiBaseUrl.replace(/\/+$/,'')+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.aiKey},
      body:JSON.stringify(Object.assign({model:cfg.aiModel||'gpt-4o-mini',messages:ms,temperature:0.45}, cfg.aiNoThink?{thinking:{type:'disabled'}}:{}))
    });
  }catch(e){

  }
  if(!r.ok){
    let detail='';
    try{ const j=await r.json(); detail=(j&&(j.error&&j.error.message||j.message))||''; }catch(_){}
    if(r.status===401) throw new Error('HTTP 401：API Key 无效、未填写或余额不足');
    if(r.status===404) throw new Error('HTTP 404：接口路径或模型名不存在（检查 Base URL 是否拼对、模型名是否填对，如 deepseek-v4-flash）');
    if(r.status===400) throw new Error('HTTP 400：'+(detail||'请求参数错误（如该模型不支持 thinking 字段）'));
    if(r.status===413) throw new Error('HTTP 413：图片过大，请换一张更小的照片');
    throw new Error('HTTP '+r.status+(detail?('：'+detail):''));
  }
  const j=await r.json();
  const ch=j&&j.choices&&j.choices[0];
  const t=ch&&ch.message&&ch.message.content;
  if(!t)throw new Error('返回内容为空（'+(typeof j==='object'?JSON.stringify(j).slice(0,160):'')+'）');
  let out=t.trim();
  if(ch.finish_reason==='length') out+='\n\n（回答较长，已达输出上限被自动截断。可把问题拆得更具体，或开启「关闭思考模式」让回答更紧凑。）';
  return out;
}

function aiAsk(q){const i=document.getElementById('aiInp');if(i){i.value=q;aiSend();}}
function aiSend(){
  const inp=document.getElementById('aiInp');if(!inp)return;
  const txt=inp.value.trim();
  if(!txt && !aiDraftImg)return;
  const hadImg=!!aiDraftImg;
  const um={role:'user',content:txt};
  if(aiDraftImg)um.img=aiDraftImg;
  S.ai_chat.push(um);
  S.ai_chat=aiCap(S.ai_chat,60);
  aiLastQuery=txt||'(图片)';
  const emerg=aiEmergency(txt);
  S.ai_chat.push({role:'ai',content:'',loading:true,emerg:emerg});
  inp.value=''; aiDraftImg=null; aiDraftTxt='';
  const prev=document.getElementById('aiImgPrev'); if(prev)prev.innerHTML='';
  save('ai_chat');render();
  const online=S.settings.aiEnabled&&S.settings.aiBaseUrl&&S.settings.aiKey;
  if(online){
    aiCallLLM(S.ai_chat).then(ans=>finishAI(ans,false)).catch(err=>finishAI(aiBuildAnswer(txt),true,err));
  }else{
    const extra=hadImg?'\n\n（离线模式无法识别图片，已忽略图片、仅按文字回复；开启「使用 AI 大模型」后可由 AI 看图回答）':'';
    setTimeout(()=>finishAI(aiBuildAnswer(txt)+extra,false),140);
  }
}
function finishAI(ans,fellBack,err){
  const m=S.ai_chat[S.ai_chat.length-1];
  if(!m)return;
  m.content=ans;m.loading=false;
  if(fellBack){
    m.note='（大模型调用失败，已切换为离线知识库回答）';
    if(err)m.err=String(err&&err.message?err.message:err);
  }else{
    m.err='';
  }
  save('ai_chat');render();
}
function aiClear(){confirmDo('清空对话','确定清空当前 AI 问答记录吗？',()=>{S.ai_chat=[];save('ai_chat');render();toast('已清空');},true);}
function compressImage(file, cb){
  try{
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height; const max=800;
        if(w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        cb(cv.toDataURL('image/jpeg',0.82));
      };
      img.onerror=()=>cb(null);
      img.src=rd.result;
    };
    rd.onerror=()=>cb(null);
    rd.readAsDataURL(file);
  }catch(e){ cb(null); }
}
function aiPickImg(e){
  const f=e&&e.target&&e.target.files&&e.target.files[0];
  if(f){ aiDraftTxt=(document.getElementById('aiInp')||{}).value||''; }
  compressImage(f, d=>{
    if(!d){ if(f)toast('图片读取失败'); return; }
    aiDraftImg=d; render();
  });
  if(e&&e.target)e.target.value='';
}
function aiRemoveImg(){ aiDraftImg=null; const p=document.getElementById('aiImgPrev'); if(p)p.innerHTML=''; }
function imgPrevHTML(){
  if(!aiDraftImg)return '';
  return '<div style="display:inline-flex;align-items:center;gap:7px;margin:7px 2px 0;padding:5px 9px;background:rgba(0,0,0,.04);border-radius:11px;max-width:100%">'
    +'<img src="'+aiDraftImg+'" style="width:42px;height:42px;object-fit:cover;border-radius:7px;border:1px solid rgba(0,0,0,.08)">'
    +'<span style="font-size:12px;color:var(--text-3)">已选图片，将随问题发送</span>'
    +'<button onclick="aiRemoveImg()" class="btn sm ghost" style="padding:2px 8px">移除</button></div>';
}

/* ---------- 喂奶提醒（手机通知栏） ----------
 * 按喂奶间隔自动推算下次喂奶时间，提前 N 分钟通过系统通知栏提醒。
 * 调用 Web Notifications API；优先走 Service Worker 的 showNotification，
 * 使通知在手机（已添加到主屏的 PWA）通知栏中常驻显示。
 */
let _feedNextAt=0, _feedFiredCycle=0, _feedChecker=null, _todoChecker=null;

function lastFeedTime(){
  if(!S.feeding||!S.feeding.length) return 0;
  let mx=0;
  for(const f of S.feeding){
    const t=parseD(f.startTime).getTime();
    if(!isNaN(t)&&t>mx)mx=t;
  }
  return mx;
}

function feedNextTime(lastMs, intervalMs){
  const iv=intervalMs>0?intervalMs:3*3600*1000;
  const base=lastMs||Date.now();
  let next=base+iv;
  const now=Date.now();
  while(next < now+2000) next+=iv; // 跳过已过去的时间点，对齐到下一次
  return next;
}

function feedAvgGapMs(){
  const days=S.settings.feedAvgDays||7;
  const minGap=2*3600*1000, maxGap=24*3600*1000;
  if(!S.feeding||S.feeding.length<2) return 0;
  const cut=Date.now()-days*24*3600*1000;
  const ts=S.feeding.map(f=>parseD(f.startTime).getTime()).filter(t=>!isNaN(t)&&t>=cut).sort((a,b)=>a-b);
  const gaps=[];
  for(let i=1;i<ts.length;i++){
    const g=ts[i]-ts[i-1];
    if(g>=minGap && g<=maxGap) gaps.push(g);
  }
  if(gaps.length<2) return 0;
  return gaps.reduce((a,b)=>a+b,0)/gaps.length;
}

function feedEffectiveIntervalMs(){
  const avg=feedAvgGapMs();
  return avg>0 ? avg : (S.settings.feedInterval||3)*3600*1000;
}

function feedAvgInfo(){
  const days=S.settings.feedAvgDays||7;
  const avg=feedAvgGapMs();
  if(avg<=0) return '近'+days+'天记录不足，暂用默认间隔 '+(S.settings.feedInterval||3)+' 小时推算';
  const h=avg/3600/1000, hh=Math.floor(h), mm=Math.round((h-hh)*60);
  return '近'+days+'天平均喂奶间隔约 '+hh+' 小时'+(mm?(' '+mm+' 分'):'')+'，据此自动推算下次时间';
}

function feedReminderTick(){
  if(!S.settings.feedReminder){ _feedNextAt=0; renderFeedReminderPreview(); return; }
  const intervalMs=feedEffectiveIntervalMs();
  const leadMs=(S.settings.feedLead||10)*60*1000;
  const next=feedNextTime(lastFeedTime(), intervalMs);
  _feedNextAt=next;
  const fireAt=next-leadMs;
  const now=Date.now();
  if(now>=fireAt && now<next && _feedFiredCycle!==next){
    _feedFiredCycle=next;
    fireFeedReminder();
  }
  renderFeedReminderPreview();
}

function fireFeedReminder(){
  const t=new Date(_feedNextAt);
  const hh=pad(t.getHours()), mm=pad(t.getMinutes());
  showAppNotification('该准备喂奶啦', '下次喂奶约 '+hh+':'+mm+'，现在可以备好奶瓶 / 母乳了');
}

function showAppNotification(title, body){
  if(!('Notification' in window)){ toast(body); return; }
  const fire=()=>doShowNotification(title,body);
  if(Notification.permission==='granted'){ fire(); }
  else if(Notification.permission!=='denied'){
    try{ Notification.requestPermission().then(p=>{ if(p==='granted') fire(); else toast(body); }).catch(()=>toast(body)); }
    catch(e){ toast(body); }
  } else { toast(body); }
}

function doShowNotification(title,body){
  const opts={ body, icon:'./icon-192.png', badge:'./icon-192.png', tag:'anbaby-feed', renotify:true, vibrate:[200,100,200], requireInteraction:false };
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(reg=>{
        if(reg&&reg.showNotification) reg.showNotification(title,opts);
        else if('Notification' in window) new Notification(title,opts);
        else toast(body);
      }).catch(()=>{ if('Notification' in window) new Notification(title,opts); else toast(body); });
      return;
    }
  }catch(e){}
  if('Notification' in window) new Notification(title,opts);
  else toast(body);
}

function renderFeedReminderPreview(){
  const el=document.getElementById('feedNextPreview');
  if(!el) return;
  if(!S.settings.feedReminder){ el.textContent='未开启'; return; }
  if(!_feedNextAt){ el.textContent='计算中…'; return; }
  const t=new Date(_feedNextAt);
  el.textContent='下次喂奶约 '+pad(t.getHours())+':'+pad(t.getMinutes())+'（提前 '+(S.settings.feedLead||10)+' 分钟提醒）';
}

function toggleFeedReminder(){
  S.settings.feedReminder=!S.settings.feedReminder;
  save('settings');
  if(S.settings.feedReminder){
    if('Notification' in window && Notification.permission==='default'){
      try{ Notification.requestPermission().then(()=>{ feedReminderTick(); render(); }); }
      catch(e){ feedReminderTick(); render(); }
    } else { feedReminderTick(); render(); }
  } else { _feedNextAt=0; render(); }
}

function testFeedReminder(){
  if(!('Notification' in window)){ toast('当前环境不支持系统通知，已用应用内提示代替'); return; }
  const send=()=>{ _feedNextAt=Date.now()+10*60000; fireFeedReminder(); };
  if(Notification.permission==='default'){
    try{ Notification.requestPermission().then(p=>{ if(p==='granted') send(); else toast('未授权通知权限，无法发送'); }).catch(()=>toast('未授权通知权限，无法发送')); }
    catch(e){ toast('未授权通知权限，无法发送'); }
  } else if(Notification.permission==='granted'){ send(); }
  else { toast('通知权限被拒绝，请在浏览器设置中开启'); }
}

function startFeedReminder(){
  if(_feedChecker) clearInterval(_feedChecker);
  feedReminderTick();
  _feedChecker=setInterval(feedReminderTick, 30000);
  if(!_todoChecker)_todoChecker=setInterval(todoReminderTick, 60000);
  todoReminderTick();
}

function downloadBlob(filename,blob,text){
  const a=document.createElement('a');a.download=filename;
  if(URL.createObjectURL){
    a.href=URL.createObjectURL(blob);
    a.click();
    setTimeout(()=>{try{URL.revokeObjectURL(a.href);}catch(e){}},3000);
  }else{
    a.href='data:'+(blob.type||'application/octet-stream')+';charset=utf-8,'+encodeURIComponent(text||'');
    a.click();
  }
}

      let cnt=0;
      TABLES.forEach(t=>{

        if(Array.isArray(d[t])){cnt+=d[t].length;S[t]=d[t];}
        else S[t]=d[t];

      if(!S.profile)S.profile=defaultProfile();

    }catch(err){toast('文件格式不正确，请选择本工作台导出的 JSON 备份');}
  };
  r.readAsText(file);
}

      render();
      toast(cloudFail?'本地已清空，但云端部分记录未能清除，恢复网络后会尝试同步':'已清空并恢复初始状态');
    },true);
  },true);
}

/* ---------- 图片压缩上传 §8.2 ---------- */
function handleImg(file){
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const max=400,sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=img.width*sc;cv.height=img.height*sc;
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      S.profile.photo=cv.toDataURL('image/jpeg',.8);
      save('profile');render();toast('头像已更新');
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

/* =======================================================================
   模块 · 睡眠记录 §SPEC-睡眠记录模块-v1
   主路径：手动录入起止时刻（≤2 击）；辅助：一键计时（open 段落库，跨会话保留）
   三视图：今日 / 日历热力 / 趋势；两类提醒：建议入睡 + 长时间未记录
   数据契约见 Spec §5；交互契约见 §6；Token 见 §7。
   ======================================================================= */

/* ---------- 常量与词表（零新增颜色 Token，均复用现有语义色） ---------- */
const SLEEP_SETTLE=[
  ['feed','喂奶哄睡'],['rock','抱摇哄睡'],['pat','拍睡'],['sing','哼唱/白噪音'],
  ['self','自主入睡'],['stroller','推车/外出'],['other','其他']
];
const SLEEP_SETTLE_LABEL=(function(){const m={};SLEEP_SETTLE.forEach(([k,n])=>m[k]=n);return m;})();
const SLEEP_KIND_LABEL={night:'夜睡',nap:'小睡'};
const SLEEP_WAKE_QUICK=[['now','刚刚'],['m15','15 分钟前'],['m30','30 分钟前'],['notyet','还没醒 · 转计时'],['custom','自定义']];
const SLEEP_START_QUICK=[['now','刚刚'],['m30','30 分钟前'],['h1','1 小时前'],['h2','2 小时前'],['custom','自定义']];

/* ---------- 纯函数：数据判定（供视图/测试/同步共用） ---------- */
function sleepDay(r){ return dstr(parseD(r.startTime)); }
function sleepMinutes(r){
  if(r.minutes!=null && !isNaN(r.minutes)) return r.minutes;
  const a=parseD(r.startTime), b=parseD(r.endTime);
  if(!a||!b) return null;
  return Math.round((b-a)/60000);
}
function sleepKindByHour(startTime){
  const d=parseD(startTime); if(!d) return 'nap';
  const h=d.getHours();
  return (h>=20||h<6)?'night':'nap';
}
function openSleep(){
  const opens=live(S.sleep).filter(r=>r.open);
  if(!opens.length) return null;
  return opens.slice().sort((a,b)=>(rmt(b)-rmt(a)))[0];
}
function openSleepMinutes(r){ r=r||openSleep(); if(!r) return 0; const a=parseD(r.startTime); if(!a) return 0; return Math.max(0,Math.round((Date.now()-a)/60000)); }
function sleepOverdue(r){
  if(!r) return false;
  const m = r.open ? openSleepMinutes(r) : sleepMinutes(r);
  if(m==null) return false;
  return r.kind==='night' ? m>12*60 : m>5*60;
}
function lastSettle(){
  const arr=live(S.sleep).filter(r=>r.settle).sort((a,b)=>((parseD(b.startTime)||0)-(parseD(a.startTime)||0)));
  return arr.length?arr[0].settle:'feed';
}
function lastWakeAt(){
  const closed=live(S.sleep).filter(r=>!r.open&&r.endTime);
  let mx=0;
  closed.forEach(r=>{ const t=parseD(r.endTime); if(t&&t.getTime()>mx) mx=t.getTime(); });
  if(mx) return mx;
  const o=openSleep();
  if(o){ const t=parseD(o.startTime); if(t) return t.getTime(); }
  return 0;
}
function sleepWakeDue(){
  if(!S.settings.sleepWakeReminder) return false;
  const gapH=(S.settings.sleepWakeGap||1.5)*3600*1000;
  const lw=lastWakeAt();
  if(!lw) return false;
  if(openSleep()) return false;         // 正在睡 → 不提醒
  return (Date.now()-lw)>=gapH;
}
function sleepLongGapDue(){
  const gapH=(S.settings.sleepLongGap||3)*3600*1000;
  const arr=live(S.sleep);
  if(!arr.length) return false;
  let mx=0;
  arr.forEach(r=>{ const e=r.endTime?parseD(r.endTime):parseD(r.startTime); if(e&&e.getTime()>mx) mx=e.getTime(); });
  if(!mx) return false;
  if(openSleep()) return false;
  return (Date.now()-mx)>=gapH;
}
function sleepByDay(days){
  const map={};
  live(S.sleep).forEach(r=>{
    if(r.open) return;                 // 进行中段不计入统计
    const m=sleepMinutes(r); if(m==null||m<=0) return;
    const day=sleepDay(r);
    if(!map[day]) map[day]={day:day,nightMin:0,napMin:0,naps:0};
    if(r.kind==='night') map[day].nightMin+=m; else { map[day].napMin+=m; map[day].naps++; }
  });
  const out=[];
  const t=today();
  for(let i=days-1;i>=0;i--){
    const day=addDays(t,-i);
    const e=map[day]||{day:day,nightMin:0,napMin:0,naps:0};
    e.totalMin=e.nightMin+e.napMin;
    out.push(e);
  }
  return out;
}
function sleepToday(){
  const t=today();
  let night=0,nap=0,naps=0;
  live(S.sleep).forEach(r=>{
    if(r.open) return;
    if(sleepDay(r)!==t) return;
    const m=sleepMinutes(r); if(m==null||m<=0) return;
    if(r.kind==='night') night+=m; else { nap+=m; naps++; }
  });
  return {nightMin:night,napMin:nap,totalMin:night+nap,naps:naps};
}
function fmtDur(min){
  min=Math.max(0,Math.round(min||0));
  const h=Math.floor(min/60), m=min%60;
  if(!h) return m+' 分钟';
  return h+' 小时'+(m?' '+m+' 分':'');
}

/* ---------- 交互：一键计时（辅助路径，Spec §6.2） ---------- */
function startSleep(){
  const o=openSleep();
  if(o){ endSleep(); return; }        // 已在睡 → 视为「醒了」（AC-04）
  const now=dtLocal();
  S.sleep.push({ id:uid(), startTime:now, endTime:null, minutes:null,
    kind:sleepKindByHour(now), settle:lastSettle(), note:'', open:true, mtime:Date.now() });
  save('sleep'); render(); haptic(10);
  toastUndo('已记下宝宝开始睡了', '撤销', () => {
    const r=live(S.sleep).filter(x=>x.open).sort((a,b)=>rmt(b)-rmt(a))[0];
    if(r){ r.deleted=true; r.mtime=Date.now(); save('sleep'); render(); toast('已撤销'); }
  });
}
function endSleep(){
  const o=openSleep();
  if(!o){ toast('当前没有进行中的睡眠'); return; }
  const end=dtLocal();
  o.endTime=end; o.open=false; o.mtime=Date.now();
  o.minutes=Math.round((parseD(end)-parseD(o.startTime))/60000);
  if(o.minutes<0) o.minutes=0;
  save('sleep'); render(); haptic(10);
  const prev={endTime:o.endTime,open:o.open,minutes:o.minutes,mtime:o.mtime};
  const wasEnd=o.endTime, wasOpen=o.open, wasMin=o.minutes, wasMt=o.mtime;
  toastUndo('宝宝醒了 · 睡了 '+fmtDur(wasMin), '撤销', () => {
    o.endTime=null; o.open=true; o.minutes=null; o.mtime=Date.now();
    save('sleep'); render(); toast('已撤销，继续计时');
  });
}

/* ---------- 交互：手动录入（主路径，Spec §6.1） ---------- */
let SLP={};
function sleepSheet(prefill){
  prefill=prefill||{};
  const now=new Date();
  const start=prefill.startTime||shiftLocal(now,-30);   // 默认「30 分钟前」开始
  const end=prefill.endTime||shiftLocal(now,0);         // 默认「刚刚」醒来
  SLP={
    startTime:start, endTime:end,
    kind:prefill.kind||sleepKindByHour(start),
    kindDirty: !!prefill.kind,   // 显式预填类型视为用户已定，改时刻不覆盖
    settle:prefill.settle||lastSettle(),
    note:'', startQ:'m30', endQ:'now', endNull:false
  };
  const foot='<button class="btn ghost" onclick="closeSheet()">取消</button>'
    +'<button class="btn pri" onclick="saveSleep()">'+I('save',17)+'保存记录</button>';
  openSheet('记录睡眠',sleepBody(),foot,sleepMount);
}
function shiftLocal(d,min){ const x=new Date(d.getTime()); x.setMinutes(x.getMinutes()+min); return dtLocal(x); }
function sleepBody(){
  let h='';
  h+='<div class="field"><label class="label">入睡时刻</label><div class="opts" id="slpStartQ">'
    +SLEEP_START_QUICK.map(([k,n])=>'<button class="opt'+(SLP.startQ===k?' on':'')+'" data-k="'+k+'" onclick="spQuick(\'start\',\''+k+'\')">'+n+'</button>').join('')
    +'</div><input type="datetime-local" class="inp" id="slpStart" style="margin-top:9px" value="'+SLP.startTime+'" onchange="SLP.startTime=this.value;SLP.startQ=\'custom\';spSyncKind()"></div>';
  h+='<div class="field"><label class="label">醒来时刻</label><div class="opts" id="slpEndQ">'
    +SLEEP_WAKE_QUICK.map(([k,n])=>'<button class="opt'+(SLP.endQ===k?' on':'')+'" data-k="'+k+'" onclick="spQuick(\'end\',\''+k+'\')">'+n+'</button>').join('')
    +'</div><input type="datetime-local" class="inp" id="slpEnd" style="margin-top:9px" value="'+SLP.endTime+'" onchange="SLP.endTime=this.value;SLP.endQ=\'custom\'"></div>';
  h+='<div id="slpDur" class="t-tag" style="text-align:center;margin:-4px 0 12px"></div>';
  h+='<div class="field"><label class="label">类型</label><div class="opts" id="slpKind">'
    +Object.keys(SLEEP_KIND_LABEL).map(k=>'<button class="opt" data-k="'+k+'" onclick="spKind(\''+k+'\')">'+I(k==='night'?'moon':'nap',15,k==='night'?'var(--purple-deep)':'var(--blue-deep)',1.8)+SLEEP_KIND_LABEL[k]+'</button>').join('')
    +'</div></div>';
  h+='<div class="field"><label class="label">哄睡方式</label><div class="opts" id="slpSettle">'
    +SLEEP_SETTLE.map(([k,n])=>'<button class="opt" data-k="'+k+'" onclick="spSettle(\''+k+'\')">'+n+'</button>').join('')
    +'</div></div>';
  h+='<div class="field"><label class="label">备注（选填）</label><textarea class="inp" id="slpNote" placeholder="例如：夜里醒了两次，拍拍又睡了"></textarea></div>';
  return h;
}
function sleepMount(){
  spKindUI(SLP.kind); spSettle(SLP.settle); spTickDur();
}
function spQuick(which,k){
  const now=new Date();
  const map={now:0,m15:-15,m30:-30,h1:-60,h2:-120};
  if(k==='custom'){ return; }        // 自定义：交给 input 手动改，不再算
  if(which==='end' && k==='notyet'){
    SLP.endQ='notyet'; SLP.endTime=null;
    const el=document.getElementById('slpEnd'); if(el) el.value='';
    document.querySelectorAll('#slpEndQ .opt').forEach(b=>b.classList.toggle('on',b.dataset.k==='notyet'));
    spTickDur(); return;
  }
  const off=map[k];
  if(which==='start'){
    SLP.startQ=k;
    if(off==null) return;
    SLP.startTime=shiftLocal(now,off);
    document.getElementById('slpStart').value=SLP.startTime;
    spSyncKind();
  }else{
    SLP.endQ=k;
    if(off==null) return;
    SLP.endTime=shiftLocal(now,off);
    if(parseD(SLP.endTime)<=parseD(SLP.startTime)) SLP.endTime=shiftLocal(parseD(SLP.startTime),15);
    document.getElementById('slpEnd').value=SLP.endTime;
  }
  document.querySelectorAll('#slp'+(which==='start'?'StartQ':'EndQ')+' .opt').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  spTickDur();
}
function spKindUI(k){
  SLP.kind=k;
  document.querySelectorAll('#slpKind .opt').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
}
function spKind(k){
  spKindUI(k); SLP.kindDirty=true;
}
function spSyncKind(){
  if(SLP.kindDirty) return;
  spKindUI(sleepKindByHour(SLP.startTime));
}
function spSettle(k){
  SLP.settle=k;
  document.querySelectorAll('#slpSettle .opt').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
}
function spTickDur(){
  const el=document.getElementById('slpDur'); if(!el) return;
  if(SLP.endQ==='notyet' || !SLP.endTime){
    const a=parseD(SLP.startTime);
    el.textContent = a ? ('计时中 · 已睡 '+fmtDur(Math.max(0,Math.round((Date.now()-a)/60000)))) : '';
    return;
  }
  const a=parseD(SLP.startTime), b=parseD(SLP.endTime);
  if(!a||!b){ el.textContent=''; return; }
  const m=Math.round((b-a)/60000);
  el.textContent=m>0?('本次时长 '+fmtDur(m)):'醒来时刻需晚于入睡时刻';
}
function saveSleep(){
  const a=parseD(SLP.startTime);
  const note=(document.getElementById('slpNote')||{}).value||'';
  if(SLP.endQ==='notyet' || !SLP.endTime){
    if(!a){ toast('请选择入睡时刻'); return; }
    S.sleep.push({
      id:uid(), startTime:SLP.startTime, endTime:null, minutes:null,
      kind:SLP.kind, settle:SLP.settle, note:note.trim(), open:true, mtime:Date.now()
    });
    save('sleep'); closeSheet(); render();
    toast('已转为计时中 · 宝宝正在睡');
    return;
  }
  const b=parseD(SLP.endTime);
  if(!a||!b){ toast('请选择入睡与醒来时刻'); return; }
  if(b<=a){ toast('醒来时刻需晚于入睡时刻'); return; }
  S.sleep.push({
    id:uid(), startTime:SLP.startTime, endTime:SLP.endTime,
    minutes:Math.round((b-a)/60000), kind:SLP.kind, settle:SLP.settle,
    note:note.trim(), open:false, mtime:Date.now()
  });
  save('sleep'); closeSheet(); render();
  toast('睡眠记录已保存 · '+fmtDur(Math.round((b-a)/60000)));
}
function sleepFixOpen(){
  const o=openSleep(); if(!o){ return; }
  const now=dtLocal();
  const suggested=shiftLocal(parseD(o.startTime), o.kind==='night'?8*60:60);
  SLP={ startTime:o.startTime, endTime:(parseD(suggested)<=parseD(now)?suggested:now),
       kind:o.kind, kindDirty:true, settle:o.settle||lastSettle(), note:o.note||'',
       startQ:'custom', endQ:'custom', fixId:o.id };
  openSheet('补录醒来时刻',
    '<div class="note warm"><div class="note-i">'+I('alert',18)+'</div><div>这段睡眠已经持续 <b>'+fmtDur(openSleepMinutes(o))+'</b>，可能忘记点「醒了」。请补上醒来时刻，或直接保存为当前时刻。</div></div>'
    +sleepBody(),
    '<button class="btn ghost" onclick="closeSheet()">取消</button><button class="btn ok" onclick="saveFixOpen()">'+I('check',17)+'确认醒来</button>',
    ()=>{ spKindUI(SLP.kind); spSettle(SLP.settle); spTickDur(); });
}
function saveFixOpen(){
  const r=S.sleep.find(x=>x.id===SLP.fixId);
  if(!r){ closeSheet(); toast('记录已变化，请重试'); return; }
  const a=parseD(SLP.startTime), b=parseD(SLP.endTime);
  if(!a||!b||b<=a){ toast('醒来时刻需晚于入睡时刻'); return; }
  r.endTime=SLP.endTime; r.minutes=Math.round((b-a)/60000); r.open=false;
  r.kind=SLP.kind; r.settle=SLP.settle; r.mtime=Date.now();
  save('sleep'); closeSheet(); render(); toast('已补录醒来 · 睡了 '+fmtDur(r.minutes));
}

    });
    h+='</div>';
  }
  return h;
}
function sleepTimeBar(list){
  let h='<div class="tl-bar">';

  });
  h+='</div>';

}

function sleepCalView(){

    +'</div>';

function budgetAlpha(min){ return Math.max(0,Math.min(1, min/(18*60))); }
function heatmapSleep(days){
  const byDay={};
  sleepByDay(days).forEach(d=>byDay[d.day]=d.totalMin);
  const t=today();
  let cells=[],start=addDays(t,-(days-1));
  const sd=parseD(start).getDay();
  for(let i=0;i<sd;i++)cells.push(null);
  for(let i=0;i<days;i++)cells.push(addDays(start,i));
  let h='<div class="heat-l">'+['日','一','二','三','四','五','六'].map(d=>'<span>'+d+'</span>').join('')+'</div><div class="heat">';
  cells.forEach(d=>{
    if(!d){h+='<div></div>';return;}
    const min=byDay[d];
    if(min==null||min<=0){
      h+='<div class="heat-c" title="'+d+' 无记录" style="background:var(--bg);border-color:var(--line);color:var(--text-3)">'+parseD(d).getDate()+'</div>';
      return;
    }
    const a=0.22+budgetAlpha(min)*0.78;
    h+='<div class="heat-c" title="'+d+' 共 '+fmtDur(min)+'" style="background:color-mix(in srgb, var(--purple-deep) '+Math.round(a*100)+'%, transparent);border-color:transparent;color:'+(a>=0.6?'var(--card)':'var(--text-2)')+'">'+parseD(d).getDate()+'</div>';
  });
  return h+'</div>';
}

function sleepLineSVG(data){
  const W=680,H=200,padL=40,padR=12,padT=14,padB=26;
  const x0=padL,x1=W-padR,y0=H-padB,y1=padT;
  const maxH=Math.max(18, Math.max.apply(null,data.map(d=>d.totalMin/60))+1);
  const X=i=>x0+(data.length<=1?0:i/(data.length-1)*(x1-x0));
  const Y=h=>y0-(h/maxH)*(y0-y1);
  let s='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto">';
  s+='<rect x="'+x0+'" y="'+Y(17).toFixed(1)+'" width="'+(x1-x0)+'" height="'+(Y(14)-Y(17)).toFixed(1)+'" fill="color-mix(in srgb, var(--green-soft) 70%, transparent)"/>';
  for(let i=0;i<=4;i++){ const yy=y1+(y0-y1)*i/4; const val=maxH-(maxH)*i/4; s+='<line x1="'+x0+'" y1="'+yy+'" x2="'+x1+'" y2="'+yy+'" stroke="var(--line)"/>'; s+='<text x="'+(x0-6)+'" y="'+(yy+4)+'" font-size="10" fill="var(--text-3)" text-anchor="end">'+val.toFixed(0)+'h</text>'; }
  let d='';
  data.forEach((dd,i)=>{ const v=dd.totalMin/60; d+=(d?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' '; });
  s+='<path d="'+d+'" fill="none" stroke="var(--purple-deep)" stroke-width="2.2" stroke-linejoin="round"/>';
  data.forEach((dd,i)=>{ s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(dd.totalMin/60).toFixed(1)+'" r="2.6" fill="var(--purple-deep)"/>'; });
  [0,Math.floor(data.length/2),data.length-1].forEach(i=>{ if(i<0||i>=data.length)return; const dd=data[i]; s+='<text x="'+X(i).toFixed(1)+'" y="'+(y0+16)+'" font-size="10" fill="var(--text-3)" text-anchor="middle">'+parseD(dd.day).getMonth()+1+'/'+parseD(dd.day).getDate()+'</text>'; });
  s+='</svg>';
  return '<div style="width:100%">'+s+'</div>';
}
function sleepBarSVG(data){
  const W=680,H=130,padL=40,padR=12,padT=12,padB=26;
  const x0=padL,x1=W-padR,y0=H-padB,y1=padT;
  const maxN=Math.max(1,Math.max.apply(null,data.map(d=>d.naps)));
  const bw=(x1-x0)/Math.max(1,data.length)*0.6;
  const X=i=>x0+(data.length<=1?0:i/data.length*(x1-x0))+(x1-x0)/Math.max(1,data.length)*0.2;
  const Y=n=>y0-(n/maxN)*(y0-y1);
  let s='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto">';
  for(let i=0;i<=maxN;i++){ const yy=Y(i); s+='<line x1="'+x0+'" y1="'+yy+'" x2="'+x1+'" y2="'+yy+'" stroke="var(--line)"/>'; s+='<text x="'+(x0-6)+'" y="'+(yy+4)+'" font-size="10" fill="var(--text-3)" text-anchor="end">'+i+'</text>'; }
  data.forEach((dd,i)=>{ if(dd.naps>0) s+='<rect x="'+X(i).toFixed(1)+'" y="'+Y(dd.naps).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(y0-Y(dd.naps)).toFixed(1)+'" rx="3" fill="var(--blue-deep)"/>'; });
  [0,Math.floor(data.length/2),data.length-1].forEach(i=>{ if(i<0||i>=data.length)return; const dd=data[i]; s+='<text x="'+X(i).toFixed(1)+'" y="'+(y0+16)+'" font-size="10" fill="var(--text-3)" text-anchor="middle">'+parseD(dd.day).getMonth()+1+'/'+parseD(dd.day).getDate()+'</text>'; });
  s+='</svg>';
  return '<div style="width:100%">'+s+'</div>';
}

/* =======================================================================
   渲染与启动
   ======================================================================= */
/* =======================================================================
   宝妈 Care 模块 · UI 层（B1 阶段 C）
   =======================================================================
   施工图：docs/SPEC-B1-宝妈UI层.md（§2 骨架 / §3 计划卡 / §4 打卡写入 / §5 安全呈现）
   设计详案：docs/调研-宝妈Care-设计.md（§A 信息架构 / §B 计划卡 / §C 状态采集 / §E 红线 / §F 空态）

   🔴 本层铁律（违反即返工）：
     1) 措辞禁忌（父 SPEC §5.4）：绝不输出分母（'2/3' / 百分比）、不渲染「跳过」按钮、
        不置灰未完成条目（.locked 只用于闸门关闭）、不出现「你已 N 天没记录 / 记录率 /
        红点 / 连击 / 坚持记录 N 天」、禁止「安抚前置」。
     2) 折叠态只显示正向事实（'今天已记 N 件'，只数做了的）。
     3) 打卡严禁 confirmDo（低风险可撤销操作，二次确认是纯摩擦）；取消同样零摩擦。
     4) 所有用户来源文本（note/title/why）渲染时必须 esc()。
     5) 零新增颜色 Token；类名严格照设计 §G 使用，不自造。
     6) 时间工具复用 dstr/parseD/today/addDays/dtLocal，不新增时间源。
     7) 生成链路顺序不可调换（SPEC-B1 §3.1）；planGate 每次进入都重算（父 SPEC 裁决 4）。
   ======================================================================= */

const MOM_DUR_STEPS = [3, 5, 10];              // 运动时长档位（仅 UI 态，默认不选中）
const MOM_LIVE_DUR = 44;                       // 活动条（区块 0）显示时长：本轮打卡可撤销窗口

const MOM_DOT = {
  '🙂': 'var(--green)', '😊': 'var(--blue)', '😐': 'var(--warn)',
  '😔': 'var(--purple)', '😢': 'var(--danger)'
};

/* 🔴 MOM_UI 由纯函数层（planProgress 之后）声明 —— 本层**只赋值不重复声明**，
      否则 'Identifier MOM_UI has already been declared' 会让整个 <script> 拒绝执行。 */
MOM_UI = { dur: {}, adjust: false, ref: false, draft: {}, more: false, liveUntil: 0 };

/* ---------- 时间 / 信号 ---------- */
function momToday(){ return today(); }

/* 当日信号组装（SPEC-B1 §2）。
   🔴 redlineCheck 的输入必须包含状态 note —— 妈妈可能在备注里写下危险信号。 */
function momSignalsOf(dateStr){
  const d = dateStr || momToday();
  const state = momStateOf(d);
  const prog = planProgress(live(S.mom_plan), d);
  const redline = redlineCheck(state && state.note ? state.note : '');
  return {
    nightFeeds:    nightFeedCount(S.feeding, d),
    longestSleep:  longestSleepStreak(S.sleep, d, { includeOpen: false }),
    deprivation:   sleepDeprivation(S.sleep, d, { days: MOM_SLEEP_DAYS }),
    doneCount:     prog.done,
    state:         state,
    redline:       redline
  };
}

/* ---------- 生成链路（顺序不可调换，SPEC-B1 §3.1） ---------- */
function momEnsurePlan(dateStr){
  const d = dateStr || momToday();
  const signals = momSignalsOf(d);
  const state = signals.state;

  /* 🔴 planGate 每次进入都要重算（父 SPEC 裁决 4）：状态恶化后不得继续生成计划 */
  const gate = momGate(d, signals);

  if(gate.blocked) return live(S.mom_plan).filter(r => r.date === d);

  const base = generateDayPlan(d, state, signals, MOM_KB);
  const ruled = applyRules(base, signals, state);

  /* 🔴 运动闸门只吃运动行（exerciseGuard 是「运动安全闸门」）：
     它的 E_BLOCK / 白名单校验都按「动作名」判定 —— 若把饮食行也喂进去，
     饮食标题既不在动作白名单、又会在 E 条命中时被 E_BLOCK 全数拒绝，
     **饮食计划会被整段吞掉**（实测：E9 未复查时 6 行全灭、计划卡空白）。
     故此处按 kind 切分：运动行过 exerciseGuard，饮食行直接进 dietGuard。
     🔴 但「切分」只解决「别误伤饮食」，**不解决「运动为什么没了」要说出来** ——
        guard 的 blocked/reasons 必须原样透传给视图层渲染，见 §.mom-guard-note 与 viewMomPlan。
        这正是上一轮踩坑的根因：`blocked/reasons` 是给人看的安全提示，不是内部状态，
        不渲染它 = 运动静默消失、无解释（安全文档 §A.1「停止生成计划 ≠ 模块关闭」）。 */
  const moves  = ruled.filter(r => r.kind === 'move');
  const meals  = ruled.filter(r => r.kind !== 'move');
  const moveGuard = exerciseGuard(moves, momGuardCtx(state, signals));
  const dietGuardRes = dietGuard(meals);
  const guarded = moveGuard.allowed;
  const dieted  = dietGuardRes.allowed;
  MOM_UI.guard = {
    moveBlocked: moveGuard.blocked === true,
    moveReasons: (moveGuard.reasons || []).slice(),
    moveHint:    moveGuard.hint || '',
    dietReasons: (dietGuardRes.reasons || []).slice(),
    dietHint:    dietGuardRes.hint || ''
  };

  const mergedMove = mergePlans(live(S.mom_plan).filter(r => r.date === d && r.kind === 'move'), guarded, d, MOM_KB);
  const mergedMeal = mergePlans(live(S.mom_plan).filter(r => r.date === d && r.kind !== 'move' && r.kind !== 'stat'), dieted, d, MOM_KB);
  const merged = mergedMeal.concat(mergedMove.filter(r => r.kind !== 'stat'))
    .concat(mergedMove.filter(r => r.kind === 'stat'));

  if(momPlanDiffers(d, merged)) S.mom_plan = live(S.mom_plan).filter(r => r.date !== d).concat(merged);
  return merged.filter(r => r.date === d && r.kind !== 'stat');
}

function momReview6wDone(st){
  if(!st) return false;
  const v = st.review6w;
  if(v === 'normal' || v === 'minor') return true;
  if(v === 'none') return false;
  return st.review6wDone === true;
}

function momGate(dateStr, signals){
  const sg = signals || momSignalsOf(dateStr);
  const st = sg.state || null;
  const sl = live(S.sleep).filter(r => r.date === dateStr || sleepDay(r) === dateStr);
  const ctx = {
    review6wDone:      momReview6wDone(st),
    diastasisFingers:  (st && typeof st.diastasisFingers === 'number') ? st.diastasisFingers : null,
    lochiaActive:      momHasSym(st, 'lochia'),
    cSectionUnhealed:  momHasSym(st, 'wound_pain'),
    perinealUnhealed:  momHasSym(st, 'wound_pain'),
    pelvicIssue:       momHasSym(st, 'pelvic_sign'),
    severeAnemia:      momHasSym(st, 'severe_anemia'),
    moodCrisis:        !!(sg.redline && sg.redline.level === 'emergency'),
    fever:             momHasSym(st, 'fever'),
    bpUncontrolled:    momHasSym(st, 'bp_uncontrolled'),
    note:              (st && st.note) || ''
  };
  return { gate: planGate(S.profile, st, sg.redline), ctx: ctx, sleep: sl };
}

function momGuardCtx(state, signals){
  const st = state || {};
  const sl = live(S.sleep);
  return {
    review6wDone:     momReview6wDone(st),
    diastasisFingers: (typeof st.diastasisFingers === 'number') ? st.diastasisFingers : null,
    lochiaActive:     momHasSym(st, 'lochia'),
    cSectionUnhealed: momHasSym(st, 'wound_pain'),
    perinealUnhealed: momHasSym(st, 'wound_pain'),
    pelvicIssue:      momHasSym(st, 'pelvic_sign'),
    severeAnemia:     momHasSym(st, 'severe_anemia'),
    moodCrisis:       !!(signals && signals.redline && signals.redline.level === 'emergency'),
    fever:            momHasSym(st, 'fever'),
    bpUncontrolled:   momHasSym(st, 'bp_uncontrolled'),
    note:             st.note || ''
  };
}

function momPlanDiffers(dateStr, merged){
  const cur = live(S.mom_plan).filter(r => r.date === dateStr);
  if(cur.length !== merged.length) return true;
  const sig = r => [r.id, r.kind, r.slot, r.title, r.why, r.order, r.minutes,
                    r.intensity, r.touched, r.adjusted, r.done, r.deleted].join('\u0001');
  const a = cur.map(sig).sort().join('\u0002');
  const b = merged.map(sig).sort().join('\u0002');
  return a !== b;
}

/* ---------- 区块 0 · 活动条 ----------
   SPEC-B1 §4.1 裁决：「顺手记一下状态」入口不能塞进 toastUndo（撤销按钮已占用），

function viewMomLive(){

/* ---------- 区块 0.5 · 危重卡（emergency，逐字文案见 SPEC-B1 §5） ---------- */
function viewMomCrit(hits, gate){
  const cats = [];
  (hits || []).forEach(h => { if(cats.indexOf(h.cat) < 0) cats.push(h.cat); });
  (gate && gate.reasons ? gate.reasons : []).forEach(r => {
    if(r.code !== 'S6' && cats.indexOf(r.label) < 0) cats.push(r.label);
  });
  let h = '<div class="mom-crit">';
  h += '<div class="mom-crit-h"><span class="mc-ico">' + I('alert', 26, '#fff', 2) + '</span><span>现在先别急着看计划</span></div>';
  h += '<div class="mom-crit-p">你描述的情况按字面看，属于需要马上处理的。这不是诊断结论，是让你别耽误。</div>';
  cats.forEach(c => {
    h += '<div class="mom-crit-li"><span class="mc-d">▸</span><span>' + esc(c) + '</span></div>';
  });
  h += '<div class="mom-crit-warn">下面这些情况需要尽快联系医院，别等到明天。</div>';
  h += '<div class="mom-crit-act">'
    + '<a class="btn" href="tel:120" style="text-decoration:none">' + I('alert', 18, 'var(--danger)', 2) + '拨打 120</a>'
    + '<a class="btn" href="tel:120" style="text-decoration:none">' + I('info', 18, 'var(--danger)', 2) + '联系建档医院 / 产科</a>'
    + '</div>';
  h += '<div class="mom-crit-p" style="margin:11px 0 0">' + esc(gate && gate.resumeHint ? gate.resumeHint : MOM_GATE_RESUME_HINT) + '</div>';
  h += '<div class="mom-crit-foot">不要等明天，不要先睡一觉看看。把上面这句话原样告诉医生。</div>';
  h += '<div class="mom-crit-foot">这不是诊断，只是提醒。你自己最清楚身体的感觉。</div>';
  h += '</div>';
  return h;
}

/* ---------- 区块 0.5 · refer 警告条（可收起但不可消失） ---------- */
function viewMomRef(hits){

  h += '<div class="mom-ref-b">';
  h += '<div style="font-size:13.5px;line-height:1.7">你记的内容里提到了 <b>' + esc(cats.join('、')) + '</b>，这一类情况早点处理通常很快缓解，拖久了会更麻烦。</div>';
  h += '<div class="mom-crit-li" style="color:var(--text);margin-top:9px"><span class="mc-d">▸</span><span style="font-size:13.5px;font-weight:400">挂产科或妇科，今天或明天去</span></div>';
  h += '<div class="mom-crit-li" style="color:var(--text)"><span class="mc-d">▸</span><span style="font-size:13.5px;font-weight:400">去之前把不舒服的地方记下来，说给医生听</span></div>';
  h += '<div class="mom-crit-li" style="color:var(--text)"><span class="mc-d">▸</span><span style="font-size:13.5px;font-weight:400">出现发烧、出血变多，就按急症处理，立刻去医院</span></div>';
  h += '<div style="font-size:12.5px;color:var(--text-2);margin-top:9px;line-height:1.65">这不是诊断，只是提醒。你自己最清楚身体的感觉。</div>';
  h += '<div class="mom-skip" onclick="momToggleRef()">收起</div>';
  h += '</div></div>';

}

/* 复查闸门（E9）专用提示条 —— 逐字文案见 SPEC-B1 §7.2 ② 与安全文档 §A.4：
     「未完成产后 6 周复查」→ 运动**暂停**；饮食不停 → 转为 refer（提醒复查）。
   🔴 不能静默丢行。设计文档 §E.2 规则 1：「不是隐藏计划 —— 隐藏会让她以为应用坏了」。
   🔴 入口按钮「我做过复查了 →」是闸门唯一的解除路径（P0-5 问询的落地触点）。 */
function viewMomReviewGate(){
  let h = '<div class="mom-ref' + (MOM_UI.ref ? ' on' : '') + '">';
  h += '<div class="note warm"><div class="mom-ref-t" onclick="momToggleRef()">'
    + '<span class="note-i">' + I('info', 18, 'var(--warn-deep)', 1.9) + '</span>'
    + '<span class="mr-txt">运动计划等复查做完再开始</span>'
    + '<span class="mr-cv">' + I('down', 16, 'var(--warn-deep)', 2) + '</span></div>';
  h += '<div class="mom-ref-b">';
  h += '<div style="font-size:13.5px;line-height:1.7">你还没记录 42 天复查的结果。复查没问题之前，先只做呼吸和走动这类最轻的。</div>';
  h += '<div style="font-size:12.5px;color:var(--text-2);margin-top:9px;line-height:1.65">吃饭不用等复查，今天照常。</div>';
  h += '<button class="btn ghost blk" style="margin-top:11px" onclick="momSheetReview6w()">我做过复查了 →</button>';
  h += '</div></div>';
  return h;
}

/* 通用规则（非仅 E9）：所有 blocked 理由必须可见（SPEC-B1 §7.2 ④）。
   `exerciseGuard(...).blocked === true` 时逐条渲染 reasons（形如「运动今天先缓一缓：{label}」），
   `dietGuard` 同理。🔴 严禁静默丢行 —— blocked/hint 是给人看的，不是内部状态。 */
function viewMomGuardNote(g){
  if(!g) return '';
  const items = [];
  (g.moveReasons || []).forEach(r => {
    if(r && r.label) items.push('<div class="mg-li">运动今天先缓一缓：' + esc(r.label) + '</div>');
  });
  if(g.moveBlocked && g.moveHint){
    items.push('<div class="mg-li">' + esc(g.moveHint) + '</div>');
  }
  (g.dietReasons || []).forEach(r => {
    if(r && r.label) items.push('<div class="mg-li">饮食里有项先不排：' + esc(r.label) + '</div>');
  });
  if(!items.length) return '';
  return '<div class="note warm" style="margin:11px 0 0"><div class="note-i">'
    + I('info', 18, 'var(--warn-deep)', 1.9) + '</div><div>' + items.join('') + '</div></div>';
}

/* ---------- 区块 1 · 今日计划卡 ---------- */
function viewMomPlan(rows, gate){
  const list = (rows || []).filter(r => !r.deleted && r.kind !== 'stat');
  const meals = list.filter(r => r.kind === 'meal');
  const moves = list.filter(r => r.kind === 'move');
  const locked = !!(gate && gate.blocked);
  const d = momToday();
  const g = MOM_UI.guard || null;
  const moveHeld = !!(g && g.moveBlocked);
  const reviewHeld = !!(moveHeld && (g.moveReasons || []).some(r => r && r.code === 'E9'));

  let h = '<div class="card">';
  h += '<div class="card-h"><div class="chip-ico" style="background:var(--yellow-soft)">' + I('meal', 17, 'var(--yellow-deep)', 1.9) + '</div>'
    + '<div class="t">今日怎么过</div>'
    + '<div class="x">已记 ' + esc(String(planProgress(live(S.mom_plan), d).done)) + ' 件</div></div>';

  /* 🔴 闸门拦住运动时渲染可见提示条（不再静默丢弃）—— 一律在计划卡顶部 */
  if(reviewHeld) h += viewMomReviewGate();
  h += viewMomGuardNote(g);

  h += '<div class="mom-plan">';

  if(locked){
    h += '<div class="note warm" style="margin-bottom:0"><div class="note-i">' + I('alert', 18, 'var(--warn-deep)', 1.9) + '</div>'
      + '<div>今天先不用按计划走。上面提醒的事情处理完，我们再一起排。</div></div>';
  }

  if(!meals.length && !moves.length){
    /* 空态不是残缺态：空态下方仍渲染通用基准计划（设计 §F.1 / 父 SPEC §6.5） */
    h += '<div class="empty" style="padding:16px"><div class="empty-t">计划还没排出来。先按通用版来，记得越多越贴合你。</div></div>';
  }

  meals.concat(moves).forEach(r => { h += momPlanItem(r, locked); });

  if(meals.length) h += '<div class="mom-plan-fallback">' + esc(momMealFallback(meals)) + '</div>';
  if(moves.length) h += '<div class="mom-plan-fallback">今天实在没力气？躺着抬抬腿也算。</div>';
  h += '</div></div>';
  return h;
}

function momMealFallback(meals){
  const kb = momKbMealOf(meals[0], MOM_KB);
  return (kb && kb.fallback) ? kb.fallback : '今天什么都顾不上？喝够水就算过。';
}

/* 单条计划行（SPEC-B1 §3.2） */
function momPlanItem(r, locked){
  const isMove = r.kind === 'move';
  const done = r.done === true;
  const ic = isMove ? 'stretch' : 'meal';
  let h = '<div class="mom-plan-item' + (done ? ' done' : '') + (locked ? ' locked' : '') + '" id="mp-' + esc(r.id) + '">';
  h += '<div class="mom-plan-t">' + I(ic, 16, done ? 'var(--green-deep)' : 'var(--text-2)', 1.9) + '<span>' + esc(r.title) + '</span></div>';
  if(r.why) h += '<div class="mom-plan-w">' + esc(r.why) + '</div>';

  if(isMove && !done && !locked){
    const cur = MOM_UI.dur[r.id];
    h += '<div class="mom-dur">' + MOM_DUR_STEPS.map(m =>
      '<button class="seg' + (cur === m ? ' on' : '') + '" onclick="momSetDur(\'' + esc(r.id) + '\',' + m + ')">' + m + ' 分</button>'
    ).join('') + '</div>';
  }

  if(locked){
    h += '<div class="mom-plan-cta">' + I('alert', 18) + '<span>先处理上面的提醒</span></div>';
  } else if(done){
    const dur = (isMove && r.minutes != null) ? (' · ' + r.minutes + ' 分') : '';
    h += '<div class="mom-plan-cta" onclick="momCheckPlan(\'' + esc(r.id) + '\')">'
      + I('check', 18) + '<span>已记下' + dur + ' · 点此取消</span></div>';
  } else {
    h += '<div class="mom-plan-cta" onclick="momCheckPlan(\'' + esc(r.id) + '\')">'
      + I('check', 18) + '<span>' + (isMove ? '我做完了' : '我吃到了') + '</span></div>';
  }
  h += '</div>';
  return h;
}

/* ---------- 区块 2 · 今天已经做了什么 ---------- */
function viewMomDone(rows){
  const d = momToday();
  /* 🔴 只数做了的（正向事实），绝不出现分母 */
  const done = (rows || []).filter(r => !r.deleted && r.kind !== 'stat' && r.done === true);
  let h = '<div class="card">';
  h += '<div class="card-h"><div class="chip-ico" style="background:var(--green-soft)">' + I('check', 17, 'var(--green-deep)', 2) + '</div>'
    + '<div class="t">今天已经做了什么</div>'
    + (done.length ? '<div class="x">已记 ' + done.length + ' 件</div>' : '') + '</div>';

  if(!done.length){
    h += '<div class="empty" style="padding:16px"><div class="empty-t">今天还没有打卡记录</div>'
      + '<div style="font-size:12.5px;color:var(--text-3);margin-top:6px;line-height:1.6">想动了随时点一下，不想动也没关系。</div></div>';
  } else {
    h += '<div class="mom-done">';
    done.forEach(r => {
      const isMove = r.kind === 'move';
      const sub = (isMove && r.minutes != null) ? (r.minutes + ' 分钟') : (isMove ? '已动，未记时长' : '今天吃的');
      h += '<div class="mom-done-item">'
        + '<div class="mom-done-ck" onclick="momUndoPlan(\'' + esc(r.id) + '\')">' + I('check', 16, 'currentColor', 2.2) + '</div>'
        + '<div class="mom-done-b"><div class="mom-done-t">' + esc(r.title) + '</div>'
        + '<div class="mom-done-s">' + esc(sub) + (r.doneAt ? ' · ' + esc(momTimeOf(r.doneAt)) : '') + '</div></div>'
        + '</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}
function momTimeOf(s){
  const m = /T(\d{2}:\d{2})/.exec(String(s || ''));
  return m ? m[1] : '';
}

/* ---------- 区块 3 · 系统调了什么 ---------- */
function viewMomAdjust(signals){
  const rows = live(S.mom_plan).filter(r => r.date === momToday() && r.kind !== 'stat' && r.adjusted === true);
  if(!rows.length) return '';                    // 无调整 → 整段不渲染（不显示「暂无调整」）
  let h = '<div class="mom-adjust' + (MOM_UI.adjust ? ' on' : '') + '">';
  h += '<div class="mom-adjust-t" onclick="momToggleAdjust()">'
    + '<span>' + I('refresh', 17, 'var(--blue-deep)', 1.9) + '</span>'
    + '<span class="ma-txt">今天的计划调过了</span>'
    + '<span class="ma-cv">' + I('down', 16, 'var(--blue-deep)', 2) + '</span></div>';
  h += '<div class="mom-adjust-b">';
  rows.slice(0, 4).forEach(r => {
    h += '<div class="mom-adjust-it">'
      + '<div class="mai-h">' + esc(r.title) + '</div>'
      + '<div class="mai-w">' + esc(momAdjustWhy(r, signals)) + '</div></div>';
  });
  h += '<div class="mom-adjust-end">明天还会看一遍。不合适就告诉我。</div>';
  h += '</div></div>';
  return h;
}
function momAdjustWhy(r, signals){
  const sg = signals || {};
  const why = (r && r.whyChanged) ? String(r.whyChanged) : '';
  if(why) return why;
  return '按今天的记录排的，不合适就告诉我。';
}

/* ---------- 区块 4 · 我现在的状态 ---------- */
const MOM_SYM_LABEL = {
  wound_pain: '伤口痛', breast_pain: '乳房胀', headache: '头痛',
  back_pain: '腰痛', lochia: '恶露异常', none: '都没有'
};
function viewMomState(state){
  let h = '<div class="card">';
  h += '<div class="card-h"><div class="chip-ico" style="background:var(--pink-soft)">' + I('heart', 17, 'var(--pink-deep)', 1.9) + '</div>'
    + '<div class="t">我现在的状态</div></div>';
  h += '<div style="font-size:12.5px;color:var(--text-3);line-height:1.6;margin-bottom:11px">随手记，用来调整明天给你的计划</div>';
  if(state){
    const tags = [];
    if(state.mood != null) tags.push('心情 ' + esc(momScaleWord('mood', state.mood)));
    if(state.energy != null) tags.push('体力 ' + esc(momScaleWord('energy', state.energy)));
    if(state.sleepQuality != null) tags.push('昨晚睡得 ' + esc(momScaleWord('sleep', state.sleepQuality)));
    if(Array.isArray(state.symptoms) && state.symptoms.length){
      tags.push('不舒服：' + esc(state.symptoms.map(s => MOM_SYM_LABEL[s] || s).join('、')));
    }
    if(tags.length) h += '<div class="mom-state-sum">' + tags.map(t => '<span class="tag gray">' + t + '</span>').join('') + '</div>';
    h += '<div class="note good" style="margin:0 0 11px"><div class="note-i">' + I('check', 18, 'var(--green-deep)', 2) + '</div><div>今天的状态已记下 ✓</div></div>';
  } else {
    h += '<div style="font-size:13.5px;color:var(--text-2);line-height:1.7;margin-bottom:12px">记一下今天的状态，之后的计划会更贴合你。不记也没关系。</div>';
  }
  h += '<button class="btn ghost blk" onclick="momSheetState()">' + I('heart', 17) + '顺手记一下状态</button>';
  h += '</div>';
  return h;
}
function momScaleWord(kind, v){
  const M = {
    mood:  ['很好', '还行', '一般', '低落', '很差'],
    energy:['充沛', '还行', '一般', '偏累', '透支'],
    sleep: ['很好', '还行', '一般', '偏浅', '很差']
  };
  const arr = M[kind] || M.mood;
  const i = Math.max(0, Math.min(4, (+v || 5) - 1));
  return arr[i];
}

/* ---------- 区块 5 · 免责页脚（常驻，不可关闭） ---------- */
function viewMomDisc(){
  return '<div class="mom-disc">这里的提醒来自你记录的内容，不是医生说的话。<br>'
    + '它不能替代就医，也不能当诊断用。<br>'
    + '真觉得不对劲，就去医院，宁可白跑一趟。</div>';
}

/* ---------- 渲染入口（区块顺序 = 设计 §A.2） ---------- */
function viewMom(){
  const d = momToday();
  const signals = momSignalsOf(d);
  const gate = momGate(d, signals);
  /* 🔴 先清 guard 再重算：momEnsurePlan 可能因 planGate 关闭而**提前返回**（不重算 guard），
     此时若沿用上一轮的 guard 会渲染出与当前状态不符的理由 —— 闸门提示必须是当下的真相。 */
  MOM_UI.guard = null;
  const rows = momEnsurePlan(d);

  const crit = (signals.redline && signals.redline.level === 'emergency');
  const ref  = (signals.redline && signals.redline.level === 'refer');

  let h = '<div class="mom-wrap">';
  if(crit) h += viewMomCrit(signals.redline.hits, gate.gate);      // 0.5 emergency —— 独占视图最顶部
  else if(ref) h += viewMomRef(signals.redline.hits);              // 0.5 refer —— 可收起不可消失
  h += viewMomLive();                                             // 0
  h += viewMomPlan(rows, gate.gate.blocked ? gate.gate : null);    // 1
  h += viewMomDone(rows);                                         // 2
  h += viewMomAdjust(signals);                                    // 3（无调整时为空串）
  h += viewMomState(signals.state);                               // 4
  h += viewMomDisc();                                             // 免责页脚（常驻）
  h += '</div>';
  return h;
}

/* ---------- 交互 · 打卡（一次点按，无确认） ---------- */
function momCheckPlan(rowId){
  const row = live(S.mom_plan).find(r => r.id === rowId);
  if(!row || row.done === true) return;
  if(momGate(momToday(), null).gate.blocked) return;
  if(MOM_UI.dur[rowId] != null) row.minutes = MOM_UI.dur[rowId];   // 可选时长；不点则保持 null
  row.done   = true;
  row.doneAt = dtLocal(new Date());
  row.mtime  = Date.now();
  row.by     = MY_NAME || '';
  MOM_UI.liveUntil = Date.now() + 3600 * 1000;                     // 活动条当日常驻（见 viewMomLive）
  save('mom_plan');                     // ← 唯一同步出口
  haptic(12);
  render();
  toastUndo('已记下 · ' + (row.kind === 'meal' ? '今天吃的' : '今天动的'), '撤销', () => momUndoPlan(rowId));
}

/* ---------- 交互 · 取消打卡（零摩擦，绝不弹「确认要取消吗」） ---------- */
function momUndoPlan(rowId){
  const row = live(S.mom_plan).find(r => r.id === rowId);
  if(!row) return;
  row.done   = null;
  row.doneAt = null;
  row.mtime  = Date.now();
  save('mom_plan'); render(); toast('已取消');
}

/* ---------- 交互 · 时长档位（仅 UI 态，不打分不写库） ---------- */
function momSetDur(rowId, min){
  if(MOM_UI.dur[rowId] === min) delete MOM_UI.dur[rowId];          // 再点一次取消预选
  else MOM_UI.dur[rowId] = min;
  haptic(10); render();
}

/* ---------- 交互 · 折叠开关 ---------- */
function momToggleAdjust(){ MOM_UI.adjust = !MOM_UI.adjust; render(); }
function momToggleRef(){ MOM_UI.ref = !MOM_UI.ref; render(); }

/* ---------- 交互 · 42 天复查问询 Sheet（P0-5 落地，SPEC-B1 §7.2 ③） ----------
   产品文档 §D6 裁决「A：做」的理由：这是运动建议的**安全准入闸门**，不问就给建议是安全风险。
   产品文档 L208 明确它是**一次性问答**（三档），故做成独立 Sheet，同时**置顶**于状态采集 Sheet
   —— 它既是准入闸门又是例行记录，分两处会让妈妈重复劳动。 */
const MOM_REVIEW6W_LABEL = {
  none:   '还没做',
  normal: '做了，一切正常',
  minor:  '做了，医生说有点小问题'
};
function momSheetReview6w(){
  const st = momStateOf(momToday()) || {};
  MOM_UI.draft = Object.assign({}, MOM_UI.draft || {}, { review6w: st.review6w || null });
  let b = '';
  b += '<div class="mom-q"><div class="mom-q-t">你做过 42 天复查了吗？</div>'
    + '<div class="mom-opts g2">' + Object.keys(MOM_REVIEW6W_LABEL).map(k =>
      '<button class="mom-opt g2' + (MOM_UI.draft.review6w === k ? ' on' : '') + '" data-rev="' + k + '" '
      + 'onclick="momPickReview6w(\'' + k + '\')">' + MOM_REVIEW6W_LABEL[k] + '</button>'
    ).join('') + '</div>'
    + '<div class="mom-care-note" id="momReviewNote" style="display:none">'
    + '医生说的小问题，通常在产后康复门诊能处理，记得带上复查报告去问一次。</div>'
    + '</div>';
  const foot = '<button class="btn pri" style="flex:1" onclick="momSaveReview6w()">' + I('save', 17) + '记好了</button>';
  openSheet('42 天复查', b, foot, () => momSyncReviewNote());
}
function momPickReview6w(k){
  MOM_UI.draft.review6w = (MOM_UI.draft.review6w === k) ? null : k;   // 再点一次取消
  haptic(10);
  document.querySelectorAll('.mom-opt[data-rev]').forEach(b => {
    b.classList.toggle('on', b.dataset.rev === MOM_UI.draft.review6w);
  });
  momSyncReviewNote();
}
function momSyncReviewNote(){

function momQ(label, key, emo, words){

  const a = MOM_UI.draft.symptoms;

    MOM_UI.draft.symptoms = (a.indexOf('none') >= 0) ? [] : ['none'];
  } else {

    if(i >= 0) a.splice(i, 1);

  const rl = redlineCheck(note);
  /* 🔴 复查档位与 4 问同屏，但落库语义不同：它只有在**本次明确选了**时才写入。
     未选（null）→ 写 null，不覆盖历史值 —— momStateOf 的可空字段补齐会让旧值继续生效，
     这正是「一次问一次答、不必反复问」的兑现方式。 */
  const rev = (d.review6w === 'none' || d.review6w === 'normal' || d.review6w === 'minor') ? d.review6w : null;
  S.mom_state.push({
    id: uid(), date: momToday(),

const MOM_FW_SINGLE = { '／':'/', '＼':'\\', '．':'.', '，':',', '％':'%', '（':'(', '）':')',
                        '　':' ', '～':'~', '：':':', '；':';', '？':'?', '！':'!',
                        '℃':'℃', '°':'°' };
const MOM_CN_NUM = { '零':0,'〇':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,
                     '六':6,'七':7,'八':8,'九':9,'十':10,'廿':20,'卅':30 };
const MOM_CN_UNITS = { '十':10, '百':100 };
const MOM_CN_COMPOUND = /[零〇一二两三四五六七八九十百廿卅]{2,}/g;
const MOM_CN_ONE_MAP = { '一':1, '两':2, '二':2 };
/* 「一」+量词 → 1。🔴「一起」**必须排除**（否则「带着宝宝一起走」会变成「1起走」）。 */
const MOM_YI_RE = /一(?=\s*(?:个|只|片|块|张|遍|次|根|条|小时|钟头|天|夜|阵|升|杯|趟|回))/g;
const MOM_CN_SPOKEN = [
  ['三九', '39'], ['三八', '38'], ['三七', '37'], ['四零', '40'], ['三六', '36']
];

function momCnToNum(s){
  for(const [a, b] of MOM_CN_SPOKEN){ if(s.indexOf(a) >= 0) s = s.split(a).join(b); }
  s = s.replace(MOM_CN_COMPOUND, function(seg){
    if(!/[十百廿卅]/.test(seg)) return seg;      // 无单位 → 不动（保留「三九」等原样）
    let total = 0, section = 0, ok = false;
    for(const ch of seg){
      if(MOM_CN_UNITS[ch]){
        const unit = MOM_CN_UNITS[ch];
        section = (section || 1) * unit;
        total += section; section = 0; ok = true;
      } else if(MOM_CN_NUM[ch] != null){
        section = MOM_CN_NUM[ch]; ok = true;
      } else { return seg; }
    }
    total += section;
    return ok ? String(total) : seg;
  });
  s = s.replace(MOM_YI_RE, '1');
  return s;
}

function normText(text){ return momNorms(text).flat; }
const MOM_PUNCT_RE = /[，,。:：；;！!？?、…~～“”"'‘’（）()【】\[\]《》〈〉—－·]/g;

const MOM_PUNCT_TEST = new RegExp(MOM_PUNCT_RE.source); // 非全局派生：momPuncPos 循环 test 专用，防 g 的 lastIndex 污染
function momNorms(text){
  let s = (text == null) ? '' : String(text);
  if(!s) return { flat: '', punc: '' };
  s = s.replace(/[\s\u3000]+/g, '');
  for(const [a, b] of MOM_T2S_PHRASES){ if(s.indexOf(a) >= 0) s = s.split(a).join(b); }
  let out = '';
  for(const ch of s){ out += (MOM_T2S[ch] != null ? MOM_T2S[ch] : ch); }
  s = out;
  out = '';
  for(const ch of s){
    const i = MOM_FW_MAP.indexOf(ch);
    if(i >= 0){ out += MOM_FW_DST[i]; continue; }
    out += (MOM_FW_SINGLE[ch] != null ? MOM_FW_SINGLE[ch] : ch);
  }
  out = momCnToNum(out);
  const punc = out;
  return { flat: punc.replace(MOM_PUNCT_RE, ''), punc: punc };
}
