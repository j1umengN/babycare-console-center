const MOM_RL_QUOTE_STRONG = /(网上说|网上|听说|据说|新闻|科普|书上|文章|视频|群里|大家都说|别人说|医生(说|讲)|大夫(说|讲)|我朋友|闺蜜说|月嫂说)/;
const MOM_RL_QUOTE_WEAK   = /(如果|要是|万一|假如|是不是|会不会|能不能|要不要|怎么|如何|吗|呢|说会|说要)/;
const MOM_MARK_QUOTE = new RegExp(MOM_RL_QUOTE_STRONG.source + '|' + MOM_RL_QUOTE_WEAK.source.replace(/^\^|\$$/g, ''));
const MOM_MARK_THIRD = /(宝宝|孩子|娃|婴儿|老公|婆婆|公公|她|他|她们|他们|家里人|家人|人家|亲戚|同事|闺蜜|月嫂|阿姨|大家|有人)/;
const MOM_MARK_SELF = /我/;
const MOM_MARK_CRISIS = /(伤口|化脓|流血|出血|恶露|血|小腿|腿|胸|心口|晕|头痛|头疼|说话|手|脚|没劲|不想活|想死|自杀|伤害|宝宝|孩子|发烧|发热|寒战|抽搐|呼吸|意识)/;

const MOM_RL_CTX_WINDOW = 10;   // 命中词前 10 字内做上下文判定
const MOM_RL_THIRD_WINDOW = 8;  // 第三人称窗口

/* 子句边界（中文句读）。🔴 只认真正的句读，**不含**顿号「、」与括号引号 ——
   顿号连接的是并列成分（「又红、又肿、又烫」属同一命题），
   若把它当边界会让同句内的症状无法互相升级。 */
const MOM_CLAUSE_BOUNDARY = /[，,。.；;！!？?：:…~～]/;

/* =======================================================================
   3b. 双轨坐标映射（flat ↔ punc）
   =======================================================================
   🔴 为什么必须精确映射，而不能「近似」：
      momClausePrefix 曾经被写成 momClausePrefix(rawP, pre.length) —— 拿 **flat 坐标的
      长度** 当 **rawP 的字符串下标** 去切分。两者只在「无标点」时才相等；
      一旦原文有标点（本次的 6 个失败用例全都有），切出来的根本不是前缀，
      而是**命中词之后**的一段文本。后果：
        · 「伤口还有点疼,比前几天好多了」→ 切出「比前几天好多了」（后置文本）
          → 恢复语境标记「好多了」不在判定范围内 → 误报；
        · 「恶露已经干净了,但今天又有点红」→ 切出「但今天又有点红」
          → 完成语境标记「干净了」丢失（方向相反的错）→ 漏报。
      即：同一个 bug 同时造成误报与漏报。故必须用 O(n) 映射取**真前缀**。
   ======================================================================= */

function momPuncPos(rawP, idx){
  if(idx <= 0) return 0;
  let n = 0;
  for(let i = 0; i < rawP.length; i++){
    if(!MOM_PUNCT_TEST.test(rawP[i])){
      n++;
      if(n === idx) return i + 1;
    }
  }
  return rawP.length;
}

function momClausePrefix(raw, rawP, idx, back){
  if(idx <= 0) return '';
  const startFlat = Math.max(0, idx - back);
  const sub = raw.slice(startFlat, idx);              // flat 子句窗口（不含命中词）
  if(!sub) return '';
  const startP = momPuncPos(rawP, startFlat);
  const endP   = momPuncPos(rawP, idx);
  const seg    = rawP.slice(startP, endP);            // 对应的 punc 段（含标点）
  let lb = -1;
  for(let i = 0; i < seg.length; i++){ if(MOM_CLAUSE_BOUNDARY.test(seg[i])) lb = i; }
  return (lb < 0 ? seg : seg.slice(lb + 1)).replace(new RegExp(MOM_PUNCT_RE.source, 'g'), '');
}

function momTail(rawP, puncIdx, span, fwd){
  const p = momPuncPos(rawP, puncIdx + span);
  const seg = rawP.slice(p, p + fwd);
  let lb = -1;
  for(let i = 0; i < seg.length; i++){ if(MOM_CLAUSE_BOUNDARY.test(seg[i])){ lb = i; break; } }
  const clean = function(t){ return t.replace(new RegExp(MOM_PUNCT_RE.source, 'g'), ' '); };
  return {
    all:    clean(seg),
    before: clean(lb < 0 ? seg : seg.slice(0, lb)),
    after:  clean(lb < 0 ? ''  : seg.slice(lb + 1))
  };
}


function momResolveContext(raw, rawP, idx, span, prefixNegated){
  const preFlat   = raw.slice(Math.max(0, idx - MOM_RL_CTX_WINDOW), idx);
  const preClause = momClausePrefix(raw, rawP, idx, MOM_RL_CTX_WINDOW);
  const tail = momTail(rawP, idx, span, 8);
  const postBefore = tail.before;

  const hasSelf = MOM_MARK_SELF.test(preClause) || MOM_MARK_SELF.test(postBefore);

  if(MOM_MARK_CLOSED.test(preClause) && !MOM_TURN_MARK.test(preClause)) return true;

  if(!hasSelf && MOM_MARK_THIRD.test(preClause)) return true;

  if(!hasSelf && MOM_RL_QUOTE_STRONG.test(preClause)) return true;
  if(!hasSelf && MOM_RL_QUOTE_WEAK.test(preClause))   return true;
  if(!hasSelf && MOM_RL_QUOTE_STRONG.test(postBefore))  return true;

  if(/(这种话|那种话|这话|这种念头|那种念头|这种想法|那种想法|这样的话|这样的念头|这种事)/.test(postBefore)) return true;
  if(/(说过|想过|提过|讲过|聊过|看到过|听过|算是|才怪|这种|那种|一句|半句|字面上的|嘴上说)/.test(preClause)) return true;

  if(MOM_MARK_NEG.test(preClause)){
    if(!/不/.test(preClause) || MOM_MARK_SELF.test(preClause) || prefixNegated) return true;
  }
  return false;
}

/* =======================================================================
   4. redlineCheck —— 红线文本检测（SPEC §3 契约 9）
   =======================================================================
   → { level:'emergency'|'refer'|null, hits:[], categories:[] }
   🔴 只做文本信号检测，不做诊断，不读取 mom_state，不产生任何建议文案。
   🔴 必须可在无 AI 情况下独立运行（无副作用纯函数）。
   ======================================================================= */
function momRedlineHits(raw, rawP, table, levelName){
  const out = [];
  if(!raw) return out;
  for(const [re, weight, cat] of table){
    re.lastIndex = 0;
    const m = re.exec(raw);
    if(!m) continue;
    const pre6 = raw.slice(Math.max(0, m.index - 6), m.index);
    const prefixNegated = /(不想|没|没有|未曾|从未|不是|别|未|无|否)$/.test(pre6);
    if(momResolveContext(raw, rawP, m.index, m[0].length, prefixNegated)) continue;
    /* 后置恢复语境（安全文档 §B.4.4「伤口还有点疼，比前几天好多了」→ null）。
       🔴 这里取 `before + after`（即整段 all）而非只取 before：
          「伤口还有点疼**,**比前几天好多了」的恢复语境恰在逗号**之后**。
          这与 hasSelf 的取法相反（那里绝不能取 after）—— 因为两者的语义相反：
          恢复语境是「对症状的补充说明」，第一人称豁免是「叙述者可能换人」。
       🔴 只对 **soft** 命中生效：hard 命中（如「伤口一直好不了」）绝不因后置文本降级。
          soft 误报的代价是「打扰」，hard 漏报的代价是「危险」—— 两个方向不可同日而语。 */
    if(weight === MOM_RL_SOFT){
      const t = momTail(rawP, m.index, m[0].length, 14);
      if(MOM_MARK_RECOVER.test(t.before) || MOM_MARK_RECOVER.test(t.after) ||
         MOM_MARK_BENIGN_CAUSE.test(t.before) || MOM_MARK_BENIGN_CAUSE.test(t.after)) continue;
    }
    out.push({ level: levelName, cat: cat, weight: weight, text: m[0], index: m.index });
  }
  return out;
}

function redlineCheck(text){
  const n = momNorms(text);
  const raw = n.flat, rawP = n.punc;
  if(!raw) return { level: null, hits: [], categories: [] };

  const emg  = momRedlineHits(raw, rawP, MOM_RL_EMERGENCY, 'emergency');
  const ref  = momRedlineHits(raw, rawP, MOM_RL_REFER, 'refer');
  const allSoft = emg.concat(ref).filter(h => h.weight === MOM_RL_SOFT);

  /* ---- 升级判定（安全文档 §B.4.3 升降级矩阵）----
     ⚠️ 本实现**不采用** §B.4.3 里「soft 聚集 → 升一级」的字面口径，
        而改用**类目内异义词聚集**，理由（已实测）：
          · 「恶露又变红了」自身就会命中两条（(又|重新).{0,3}变红 + 恶露.{0,4}变红），
            按「命中条数」计数会**恒为 2** → 任何单句都误升 emergency；
          · 安全的软信号（「胸口有点闷」+「心跳快」）与同义重复（「又变红」+「变红了」）
            必须区分对待，否则升级规则会把「一次误报」放大成「一次急诊误报」。
        最终口径：同**类目**下命中 **≥2** 条时升级，且这几条必须落在**不同的语义簇**上。 */
  const softClusters = {};
  allSoft.forEach(h => {
    const g = h.level + '|' + h.cat;
    if(!softClusters[g]) softClusters[g] = {};
    softClusters[g][momSoftCluster(h.text)] = 1;
  });
  const clustered = Object.keys(softClusters).some(g => Object.keys(softClusters[g]).length >= 2);
  const intensified = allSoft.length > 0 && MOM_RL_INTENSIFIER.test(raw);

  if(emg.length){
    return { level: 'emergency', hits: emg, categories: momUniq(emg.map(h => h.cat)) };
  }
  if(ref.length && (clustered || intensified)){
    return { level: 'emergency', hits: ref, categories: momUniq(ref.map(h => h.cat)) };
  }
  if(ref.length){
    return { level: 'refer', hits: ref, categories: momUniq(ref.map(h => h.cat)) };
  }
  return { level: null, hits: [], categories: [] };
}

const MOM_SOFT_CLUSTERS = [
  { k: 'lochia_red',     re: /(变红|鲜红|红起来|出红)/ },
  { k: 'lochia_more',    re: /(量|多|增加)/ },
  { k: 'lochia_odor',    re: /(臭|异味|难闻|腥)/ },
  { k: 'chest',          re: /(闷|堵|难受|疼|痛)/ },
  { k: 'breathe',        re: /(喘|气短|憋|呼吸)/ },
  { k: 'heart',          re: /(心跳|心慌|心率)/ },
  { k: 'leg',            re: /(腿|脚|肿|硬)/ },
  { k: 'vision',         re: /(看不清|看不见|视|眼前)/ },
  { k: 'wound_surface',  re: /(红|肿|热|烫)/ },
  { k: 'wound_flow',     re: /(渗|流|水|液)/ },
  { k: 'breast_pain',    re: /(碰|疼|痛|胀)/ },
  { k: 'mood',           re: /(撑不住|熬不住|扛不住|不想说话|不想见人|躲着)/ },
  { k: 'appetite_sleep', re: /(吃不下|睡不着)/ },
  { k: 'head',           re: /(晕|头痛|头疼)/ },
  { k: 'fever',          re: /(体温|温度|发烧|发热|37)/ }
];
function momSoftCluster(text){
  for(const c of MOM_SOFT_CLUSTERS){ if(c.re.test(text)) return c.k; }
  return 'other|' + text;
}

function momUniq(arr){
  const seen = {}, out = [];
  for(const x of arr){ if(!seen[x]){ seen[x] = 1; out.push(x); } }
  return out;
}

/* =======================================================================
   5. 信号推导 R1–R3（SPEC §3 契约 1–3）
   ======================================================================= */

function nightFeedCount(rows, dateStr){
  const arr = live(rows);
  let n = 0;
  for(const r of arr){
    const d = parseD(r.startTime);
    if(!d) continue;
    if(dstr(d) !== dateStr) continue;
    if(d.getHours() < MOM_NIGHT_FEED_END_HOUR) n++;
  }
  return n;
}

function longestSleepStreak(rows, dateStr, opts){
  const includeOpen = !!(opts && opts.includeOpen);
  const best = live(rows).filter(r => sleepDay(r) === dateStr).reduce(function(mx, r){
    let m;
    if(r.open){
      if(!includeOpen) return mx;
      m = openSleepMinutes(r);
    } else {
      m = sleepMinutes(r);   // 复用既有：minutes 字段优先，缺失回退 endTime-startTime 差值
    }
    if(m == null || isNaN(m) || m <= 0) return mx;
    return (mx == null || m > mx) ? m : mx;
  }, null);
  return best;
}

function sleepDeprivation(rows, todayStr, opts){
  const days = (opts && opts.days) || MOM_SLEEP_DAYS;
  const arr = live(rows).filter(r => r.kind === 'night');
  let total = 0, valid = 0;
  for(let i = days - 1; i >= 0; i--){
    const d = addDays(todayStr, -i);
    const day = arr.filter(r => sleepDay(r) === d);
    if(!day.length) continue;
    let sum = 0, has = false;
    for(const r of day){
      if(r.open) continue;                       // open 段不参与（与契约 2 同口径）
      const m = sleepMinutes(r);
      if(m != null && !isNaN(m) && m > 0){ sum += m; has = true; }
    }
    if(!has) continue;                           // 当日只有 open 段 → 视为无有效数据
    valid++; total += sum;
  }
  if(valid < MOM_SLEEP_MIN_VALID_DAYS){
    return { level: null, totalMinutes: total, days: valid, avgMinutes: null, band: 'insufficient' };
  }
  const avg = Math.round(total / valid);
  let level = null, band = 'ok';
  for(const b of MOM_SLEEP_DEPRIVATION_BANDS){
    if(avg < b.maxExclusive){ level = b.level; band = 'low'; break; }
  }
  return { level: level, totalMinutes: total, days: valid, avgMinutes: avg, band: band };
}

/* =======================================================================
   6. 安全闸门 planGate —— 8 条 stop 条件（安全文档 §A.1 / SPEC §3 契约 12）
   =======================================================================
   → { blocked, reasons:[{code,level,label}], resumeHint, crisis }
   🔴 每次生成计划前必须**重新调用**（裁决 4）。
   🔴 闸门关闭 ≠ 模块不可用：状态采集 / 红线检测 / 心理援助入口仍可用。
   🔴 本函数只输出「能不能生成计划」与原因，**不放任何建议文案**（呈现层查表）。
   ======================================================================= */
const MOM_GATE_RESUME_HINT = '先按上面提示看医生，处理完了我们再一起排计划。';
const MOM_GATE_CRISIS_HINT = '现在别一个人待着，叫上家人陪着你，一起联系医院或拨打 120。';

const MOM_GATE_SYMPTOM_LABEL = {
  wound_pain:  { code: 'S2', level: 'refer',     label: '伤口未愈或有感染征象' },
  breast_pain: { code: 'S6', level: 'refer',     label: '乳房疼痛需就医确认' },
  headache:    { code: 'S4', level: 'refer',     label: '头痛（需结合血压判断）' },
  back_pain:   { code: null, level: null,        label: '腰背疼痛（不单独关闭闸门）' },
  lochia:      { code: 'S1', level: 'emergency', label: '恶露异常（仍鲜红 / 量多 / 重新变红）' },
  none:        { code: null, level: null,        label: '无异常' }
};
const MOM_GATE_TEXT_PATTERNS = [
  { code: 'S3', level: 'emergency', label: '发热 / 寒战',
    re: /(发烧|发热|寒战|打冷战|打寒战|高烧|体温3[89]|3[89]度|4\d度|烧到3[89]|低烧)/ },
  { code: 'S5', level: 'emergency', label: '单侧小腿肿痛 / 胸闷气短 / 胸痛',
    re: /(小腿.{0,5}(肿|痛|疼)|一边腿|单侧.{0,3}(肿|痛|疼)|胸闷|胸口闷|气短|喘不上|胸痛|呼吸困难)/ },
  { code: 'S7', level: 'emergency', label: '重度贫血伴症状（头晕 / 心悸 / 黑蒙）',
    re: /(重度贫血|贫血.{0,6}(头晕|心悸|黑蒙)|站起来.{0,4}(眼前发黑|发黑)|头晕.{0,4}心悸|心悸.{0,4}头晕)/ },
  { code: 'S8', level: 'emergency', label: '无法进食 / 持续呕吐 / 明显脱水',
    re: /(吃不下|无法进食|吃什么都吐|持续呕吐|一直吐|喝水就吐|脱水|尿少|尿很黄|尿色深)/ },
  { code: 'S1', level: 'emergency', label: '恶露仍鲜红 / 量多 / 重新变红',
    re: /(恶露.{0,4}(鲜红|变红|又变红|量多|变多|增加)|鲜红.{0,4}恶露|恶露.{0,4}有血块)/ }
];

function planGate(profile, momState, redlineResult){
  const reasons = [];
  const seen = {};
  /* 🔴 同一 code 重复命中时**取最高档**，而不是「先到先得」。
     实测踩坑：S4 会先由 MOM_GATE_SYMPTOM_LABEL.headache 以 refer 推入，
     随后「血压 ≥140/90 + 头痛」的组合判定想追加 emergency ——
     若 push 只认第一次，emergency 会被静默丢弃，闸门停在 refer。
     闸门是安全件，**宁可高报不可低报**，故按 level 就高。 */
  const GATE_RANK = { refer: 1, emergency: 2 };
  function push(code, level, label){
    if(seen[code]){
      const cur = reasons[seen[code] - 1];
      if((GATE_RANK[level] || 0) > (GATE_RANK[cur.level] || 0)){
        cur.level = level;
        cur.label = label;
      }
      return;
    }
    seen[code] = reasons.length + 1;
    reasons.push({ code: code, level: level, label: label });
  }

  /* ---- 数据收集：note 文本 + 红线结果 ----
     🔴 调用方可能传 (profile, state) 两参 —— 此时第 3 参为 state、redlineResult 为 undefined，
        用「是否含 level 字段」判定，避免把 momState 误当红线结果。 */
  const st = momState || {};
  let rl = null;
  if(redlineResult && typeof redlineResult === 'object' && 'level' in redlineResult) rl = redlineResult;

  /* ---- S1/S3/S5/S7/S8：文本层（note + 红线命中）---- */
  const noteRaw = normText(st.note);
  for(const p of MOM_GATE_TEXT_PATTERNS){
    if(noteRaw && p.re.test(noteRaw)){ push(p.code, p.level, p.label); continue; }
    if(rl && rl.hits) for(const h of rl.hits){
      if(h.cat && p.label.indexOf(h.cat.slice(0, 2)) >= 0){ push(p.code, p.level, p.label); break; }
    }
  }
  /* note 为空但电话红线命中 → 至少按红线类别补一条，避免「红线红了闸门却全开」 */
  if(!noteRaw && rl && rl.level === 'emergency'){
    push('S1', 'emergency', '红线提示的紧急情况（' + (rl.categories || []).join('/') + '）');
  }

  const syms = Array.isArray(st.symptoms) ? st.symptoms : [];
  for(const s of syms){
    const m = MOM_GATE_SYMPTOM_LABEL[s];
    if(m && m.code) push(m.code, m.level, m.label);
  }
  if(syms.indexOf('headache') >= 0){
    const bp = (noteRaw.match(/(\d{2,3})\s*\/\s*(\d{2,3})/) || []);
    if(bp.length === 3 && (+bp[1] >= 140 || +bp[2] >= 90)){
      push('S4', 'emergency', '血压高伴症状（≥140/90 且有头痛 / 视物模糊 / 上腹痛 / 水肿）');
    }
  }
  if(rl && rl.level === 'emergency' &&
     (rl.categories || []).some(c => c === '产后精神病')){
    push('S6', 'emergency', '情绪危机（不想活 / 伤害自己或宝宝 / 幻觉）');
  }
  /* S6 兜底：note 里出现明确的情绪危机措辞（与 E-5 同源，但走独立短路，防红线被误消解） */
  if(noteRaw && /(不想活|想死|自杀|寻死|伤害宝宝|伤害自己|听到有人|宝宝不是我的)/.test(noteRaw)){
    push('S6', 'emergency', '情绪危机（不想活 / 伤害自己或宝宝 / 幻觉）');
  }

  /* 🔴 红线兜底（2026-09-21 补，P0 安全缺陷修复）：redlineCheck 的 emergency 裁决必须
     **无条件**关闭闸门 —— 闸门与红线必须是「或」语义，不是「与」。
     实测踩坑：note 非空（如「血哗哗的，止不住」）且红线命中「晚期产后出血」时，
     note 文本本身不匹配任何 S1–S8 正则，类目前缀「晚期」与 S1 标签也无子串交集，
     而下方原兜底只覆盖 note 为空的情形 → 红线已 emergency、闸门却保持全开，
     计划照常生成且可打卡（mom_ui.test.js 必测6 抓出）。
     原则：宁可高报不可低报；具体归因交给 UI 层展示的 categories，闸门只管关。 */
  if(rl && rl.level === 'emergency' && !reasons.some(r => r.level === 'emergency')){
    push('RL', 'emergency', '红线提示的紧急情况（' + (rl.categories || []).join('/') + '）');
  }

  const blocked = reasons.length > 0;
  const crisis = reasons.some(r => r.code === 'S6');
  return {
    blocked: blocked,
    reasons: reasons,
    resumeHint: blocked ? (crisis ? MOM_GATE_CRISIS_HINT : MOM_GATE_RESUME_HINT) : '',
    crisis: crisis
  };
}

/* =======================================================================
   7. 运动安全闸门 exerciseGuard（安全文档 §A.2，E1–E11 + 动作白名单）
   =======================================================================
   → { blocked, reasons:[{code,level,label}], allowed, rejected, hint }
   🔴 白名单是主防线（裁决 3）：不在白名单内 = 不允许，与黑名单无关。
   🔴 EXERCISE_DANGER 正则只作**输出侧冗余校验**，防模板/AI/数据污染漏网。
   🔴 白名单校验与 E 条 block 解耦：即使未被 block，非法动作也一律被拒。
   ======================================================================= */
/* 动作白名单（SPEC §5.3 / 安全文档 §A.2.2）：只有这些能出现 */
const MOM_EXERCISE_WHITELIST = [
  '腹式呼吸', '横膈膜呼吸', '凯格尔', '盆底肌', '骨盆倾斜', '骨盆时钟',
  '死虫式', '臀桥', '鸟狗式', '慢走', '快走', '游泳', '水中活动',
  '产后瑜伽', '猫牛式', '拉伸', '上肢', '弹力带'
];
/* 动作黑名单（安全文档 §A.2.3 + §A.2.4 的 EXERCISE_DANGER 正则）。
   🔴 正则里 `.` 是通配符，此处全部用中文字面量，无点号，避免假匹配。
   🔴 本行由构建脚本生成：正则字面量**不得跨物理行**（JS 里 RegExp 字面量不允许含换行，
      跨行会触发 "Invalid regular expression: missing /" 并让整个 <script> 拒绝执行）。
      下面这行以占位符形式给出，由 _mom_insert.js 在注入时替换为字面量。 */
const EXERCISE_DANGER = /(仰卧起坐|卷腹|sit-?up|crunch|俄罗斯转体|平板支撑|plank|跳绳|开合跳|蹦床|HIIT|搏击操|跳操|跑步|慢跑|长跑|快跑|深蹲|硬拉|卧推|举重|负重|倒立|手倒立|跳跃|弹跳|burpee|波比|仰卧抬腿|抬腿|久站|高抬腿|登山跑|壶铃|杠铃|冲刺)/i;

const MOM_EXERCISE_BLOCKS = [
  { code: 'E1',  label: '恶露未净',
    when: c => c.lochiaActive === true },
  { code: 'E2',  label: '剖宫产伤口未愈',
    when: c => c.cSectionUnhealed === true },
  { code: 'E3',  label: '会阴伤口未愈',
    when: c => c.perinealUnhealed === true },
  { code: 'E4',  label: '腹直肌分离 >2 指',
    when: c => typeof c.diastasisFingers === 'number' && c.diastasisFingers > 2 },
  { code: 'E5',  label: '盆底问题未评估',
    when: c => c.pelvicIssue === true },
  { code: 'E6',  label: '血栓风险',
    when: c => c.vteRisk === true },
  { code: 'E7',  label: '贫血症状',
    when: c => c.severeAnemia === true },
  { code: 'E8',  label: '情绪危机',
    when: c => c.moodCrisis === true },
  { code: 'E9',  label: '未完成 6 周（42 天）复查',
    when: c => c.review6wDone !== true },
  { code: 'E10', label: '发热',
    when: c => c.fever === true },
  { code: 'E11', label: '血压未控制',
    when: c => c.bpUncontrolled === true }
];
const MOM_CORE_EXERCISE_KEYWORDS = /(死虫式|臀桥|鸟狗式|核心|腹部|平板)/;

function exerciseGuard(planRows, ctx){
  const c = ctx || {};
  const rows = Array.isArray(planRows) ? planRows : [];
  const reasons = [];
  for(const b of MOM_EXERCISE_BLOCKS){
    if(b.when(c)) reasons.push({ code: b.code, level: 'block', label: b.label });
  }
  /* 🔴 运动总闸门开启时，**所有**运动条目一律拒绝，理由集完整返回（不短路） */
  const blocked = reasons.length > 0;

  const allowed = [], rejected = [];
  for(const it of rows){
    const name = (it && (it.title || it.name || '')).toString();
    if(!name){ continue; }
    let reject = blocked ? { code: 'E_BLOCK', label: '存在运动禁止条件' } : null;
    if(!reject && EXERCISE_DANGER.test(name)) reject = { code: 'BLACKLIST', label: '动作在黑名单内' };
    if(!reject && !MOM_EXERCISE_WHITELIST.some(w => name.indexOf(w) >= 0)){
      reject = { code: 'NOT_WHITELISTED', label: '动作不在白名单内' };
    }
    if(!reject && typeof c.diastasisFingers === 'number' && c.diastasisFingers > 2 &&
       MOM_CORE_EXERCISE_KEYWORDS.test(name)){
      reject = { code: 'E4', label: '腹直肌分离 >2 指，腹部动作不可做' };
    }
    if(reject) rejected.push({ name: name, code: reject.code, label: reject.label });
    else allowed.push(it);
  }
  return {
    blocked: blocked,
    reasons: reasons,
    allowed: allowed,
    rejected: rejected,
    hint: blocked ? '今天先不做运动计划，等上面这几条处理完再开始。' : ''
  };
}

/* =======================================================================
   8. 饮食安全闸门 dietGuard（安全文档 §A.3，D1–D7 零容忍 + D5 剂量禁令）
   =======================================================================
   → { blocked, reasons:[{code,label}], allowed, rejected, hint }
   🔴 D1 含酒精食材**零容忍**：含**烹饪用**料酒 / 醪糟 / 月子酒（最易漏的一条）。
   🔴 D5 剂量数字禁令：出现 mg/ml/IU/片/粒/克 等剂量即拒绝（延续 ADR-006）。
   🔴 D1–D7 全为 per-item 拒绝，**不关闭整个饮食计划**（酒这一条拒掉，其余照给）——
      与安全文档 §A.3.1「零容忍」一致：「零容忍」指该项绝不出现，不是「整天不吃饭」。
   ======================================================================= */
const MOM_DIET_ZERO_TOLERANCE = [
  { code: 'D1', label: '含酒精食材（含烹饪用）',
    re: /(米酒|黄酒|料酒|醪糟|酒酿|月子酒|月子水|娘酒|客家娘酒|啤酒|红酒|白酒|醉虾|醉蟹|酒心巧克力|酒糟|花雕|加饭酒|老酒|酒精)/ },
  { code: 'D2', label: '高汞鱼类',
    re: /(鲨鱼|剑鱼|旗鱼|方头鱼|马林鱼|王鲭|大耳马鲛|大眼金枪鱼|金枪鱼)/ },
  { code: 'D3', label: '生食',
    re: /(生鱼片|刺身|生腌|溏心蛋|生鸡蛋|生蛋|半熟蛋|未煮熟|五分熟|三分熟|生肉)/ },
  { code: 'D4', label: '未经巴氏消毒的奶制品',
    re: /(生牛乳|生奶|未消毒|未经巴氏|未杀菌|生奶酪|蓝纹奶酪|布里奶酪)/ },
  { code: 'D6', label: '自行服用的下奶 / 催奶中药材',
    re: /(桃仁|红花|下奶方|催奶药|通草|王不留行|穿山甲|自行服用.{0,4}中药)/ },
  { code: 'D7', label: '刺激性泻药作排毒用途',
    re: /(番泻叶|泻药|排毒茶|通便茶|肠清茶)/ }
];
const MOM_DIET_DOSE = /(\d+(\.\d+)?\s*(mg|毫克|ml|毫升|g|克|IU|国际单位|片|粒|丸|支|袋|包|剂|滴|勺|杯|碗|盒))|(服用|吃药|用药|剂量|处方|药片|胶囊|冲剂|每日\s*\d|一天\s*\d)/i;
const MOM_DIET_MED_TERM = /(诊断|治疗|康复方案|处方|疗效|治愈)/;

function dietGuard(planRows){
  const rows = Array.isArray(planRows) ? planRows : [];
  const allowed = [], rejected = [];
  for(const it of rows){
    const text = momDietText(it);
    if(!text){ continue; }
    let rej = null;
    for(const d of MOM_DIET_ZERO_TOLERANCE){
      if(d.re.test(text)){ rej = { code: d.code, label: d.label }; break; }
    }
    if(!rej && MOM_DIET_DOSE.test(text)) rej = { code: 'D5', label: '出现剂量 / 单位 / 药物表述' };
    if(!rej && MOM_DIET_MED_TERM.test(text)) rej = { code: 'D5', label: '出现医疗判断词' };
    if(rej) rejected.push({ name: (it.title || it.name || '').toString(), code: rej.code, label: rej.label });
    else allowed.push(it);
  }
  return {
    blocked: false,   // 单项拒绝，不关闭整天饮食计划（见上方契约说明）
    reasons: momUniq(rejected.map(r => r.code)).map(c => ({ code: c })),
    allowed: allowed,
    rejected: rejected,
    hint: rejected.length ? '这几项这次没有排进去，换成了另外的做法。' : ''
  };
}
function momDietText(it){
  if(!it) return '';
  const parts = [];
  if(it.title) parts.push(String(it.title));
  if(it.name) parts.push(String(it.name));
  if(it.why) parts.push(String(it.why));
  if(Array.isArray(it.items)) parts.push(it.items.join(' '));
  return parts.join(' ');
}

    re: /(腿|脚|脚踝).{0,4}(有点酸|酸|有点肿|肿了)/ },

    re: /(昨天|前天).{0,6}(没做|没打卡|没记|没完成)|(忘了记录|补一下)/ }

const MOM_TRIAGE_RANK = { stop: 3, hold: 2, adjust: 1 };
/* 连续 N 天 hold 同一项 → 升格为 stop（安全文档 §C.1.2 定死为 3） */
const MOM_HOLD_ESCALATE_DAYS = 3;

function feedbackTriage(text, opts){
  const opts2 = (opts && typeof opts === 'object' && !Array.isArray(opts)) ? opts : {};
  const raw = normText(text);
  const priorCodes = Array.isArray(opts2.priorHoldCodes) ? opts2.priorHoldCodes : [];
  let escalatedCode = null;
  if(priorCodes.length){
    const tally = {};
    priorCodes.forEach(c => { tally[c] = (tally[c] || 0) + 1; });
    for(const c of Object.keys(tally)){
      if(tally[c] >= MOM_HOLD_ESCALATE_DAYS - 1){ escalatedCode = c; break; }
    }
  }

  let best = null;
  if(raw){
    for(const t of MOM_FEEDBACK_TRIAGE){
      t.re.lastIndex = 0;
      const m = t.re.exec(raw);
      if(!m) continue;
      const hit = { level: t.level, code: t.code, label: t.label, hit: m[0], order: t.order };
      if(!best ||
         MOM_TRIAGE_RANK[hit.level] > MOM_TRIAGE_RANK[best.level] ||
         (MOM_TRIAGE_RANK[hit.level] === MOM_TRIAGE_RANK[best.level] && hit.order < best.order)){
        best = hit;
      }
    }
  }

  if(best){
    if(best.level === 'hold' && escalatedCode === best.code){
      return { level: 'stop', code: best.code, label: best.label,
               hit: best.hit, escalated: true, escalateReason: '连续 3 天同一项 hold' };
    }
    return { level: best.level, code: best.code, label: best.label, hit: best.hit, escalated: false };
  }

  if(escalatedCode){
    const t = MOM_FEEDBACK_TRIAGE.filter(x => x.code === escalatedCode)[0];
    return { level: 'stop', code: escalatedCode, label: t ? t.label : escalatedCode,
             hit: '', escalated: true, escalateReason: '连续 3 天同一项 hold' };
  }
  return { level: 'adjust', code: null, label: '无异常信号', hit: '', escalated: false };
}

/* 状态归并（SPEC §3 契约 10）
   - 取 live(S.mom_state) 中 r.date === dateStr 的行
   - 同日多行（多设备各写一行，同步层无唯一约束）→ 取 mtime 最大者为主
   - 可空字段（mood/energy/sleepQuality/symptoms/note/review6w/review6wAt）若主行为空，
     用同日其余行中「该字段非空」且 mtime 次大者补齐
   - 🔴 不做任何写库操作（读时归并，天然幂等）
   - 无匹配行 → 返回 null
   返回对象的字段：{id,date,mood,energy,sleepQuality,symptoms,review6w,review6wAt,note,mtime,by}
   - 🔴 review6w / review6wAt 为 2026-09-20 B1 裁决新增（SPEC-宝妈Care模块 §2.2）：
       产品侧 P0-5「42 天复查分档问询」是运动动作池的准入闸门，
       缺这两个字段则 exerciseGuard 的 E9（review6wDone !== true）永远成立。
*/
function momStateOf(dateStr){
  if(!dateStr) return null;
  const rows = live(S.mom_state).filter(r => r && r.date === dateStr);
  if(!rows.length) return null;

  const sorted = rows.slice().sort((a, b) => (b.mtime || 0) - (a.mtime || 0));
  const main = sorted[0];

  const out = {
    id:           main.id == null ? null : main.id,
    date:         main.date,
    mood:         main.mood == null ? null : main.mood,
    energy:       main.energy == null ? null : main.energy,
    sleepQuality: main.sleepQuality == null ? null : main.sleepQuality,
    symptoms:     Array.isArray(main.symptoms) ? main.symptoms.slice() : null,
    review6w:     (typeof main.review6w === 'string' && main.review6w.length > 0) ? main.review6w : null,
    review6wAt:   (typeof main.review6wAt === 'string' && main.review6wAt.length > 0) ? main.review6wAt : null,
    note:         (typeof main.note === 'string' && main.note.length > 0) ? main.note : null,
    mtime:        main.mtime == null ? null : main.mtime,
    by:           main.by == null ? '' : main.by
  };

  /* 可空字段补齐：按 mtime 降序遍历剩余行，🔴 逐字段独立先到先得。
     主行 energy 为空而次新行 symptoms 非空（或反之）时，字段之间不得互相「截胡」——
     故每个字段必须在各自循环里，取自己遇到的第一个非空值（即该字段的「次大者」）。 */
  for(let i = 1; i < sorted.length && out.mood == null; i++){
    if(sorted[i].mood != null) out.mood = sorted[i].mood;
  }
  for(let i = 1; i < sorted.length && out.energy == null; i++){
    if(sorted[i].energy != null) out.energy = sorted[i].energy;
  }
  for(let i = 1; i < sorted.length && out.sleepQuality == null; i++){
    if(sorted[i].sleepQuality != null) out.sleepQuality = sorted[i].sleepQuality;
  }
  for(let i = 1; i < sorted.length && out.symptoms == null; i++){
    if(Array.isArray(sorted[i].symptoms)) out.symptoms = sorted[i].symptoms.slice();
  }
  for(let i = 1; i < sorted.length && out.review6w == null; i++){
    if(typeof sorted[i].review6w === 'string' && sorted[i].review6w.length > 0) out.review6w = sorted[i].review6w;
  }
  for(let i = 1; i < sorted.length && out.review6wAt == null; i++){
    if(typeof sorted[i].review6wAt === 'string' && sorted[i].review6wAt.length > 0) out.review6wAt = sorted[i].review6wAt;
  }
  for(let i = 1; i < sorted.length && out.note == null; i++){
    if(typeof sorted[i].note === 'string' && sorted[i].note.length > 0) out.note = sorted[i].note;
  }
  return out;
}

function cvTimeline(rows){
  if(!rows.length)return null;const tf=cvTimeField(rows);if(!tf)return null;
  const nums=Object.keys(rows[0]).filter(k=>k!==tf&&typeof rows[0][k]==='number');if(!nums.length)return null;
  const pts=rows.map(r=>({t:new Date(r[tf]),v:r})).filter(p=>!isNaN(p.t)).sort((a,b)=>a.t-b.t);if(pts.length<2)return null;
  const W=960,H=240,padL=46,padR=16,padT=16,padB=30;const x0=padL,x1=W-padR,y0=H-padB,y1=padT;
  const tmin=pts[0].t,tmax=pts[pts.length-1].t,tspan=Math.max(tmax-tmin,1);
  const series={};for(const n of nums){const vs=pts.map(p=>p.v[n]).filter(x=>x!=null);if(vs.length<2)continue;series[n]={vals:pts.map(p=>p.v[n])};}
  const sKeys=Object.keys(series);if(!sKeys.length)return null;
  let gmin=Infinity,gmax=-Infinity;for(const k of sKeys)for(const v of series[k].vals){if(v<gmin)gmin=v;if(v>gmax)gmax=v;}
  if(gmin===gmax){gmin-=1;gmax+=1;}
  const colors=['#6FA8E0','#19b36b','#f5a623','#E08A8A','#8B79C9','#00b4d8'];

  for(let i=0;i<=4;i++){const yy=y1+(y0-y1)*i/4;const val=gmax-(gmax-gmin)*i/4;svg+='<line x1="'+x0+'" y1="'+yy+'" x2="'+x1+'" y2="'+yy+'" stroke="var(--line)"/>';svg+='<text x="'+(x0-8)+'" y="'+(yy+4)+'" font-size="11" fill="var(--text-3)" text-anchor="end">'+val.toFixed(1)+'</text>';}
  const xt=[pts[0],pts[Math.floor(pts.length/2)],pts[pts.length-1]];xt.forEach(p=>{svg+='<text x="'+X(p.t).toFixed(1)+'" y="'+(y0+18)+'" font-size="11" fill="var(--text-3)" text-anchor="middle">'+(p.t.getMonth()+1)+'/'+p.t.getDate()+'</text>';});
  sKeys.forEach((k,idx)=>{const col=colors[idx%colors.length];let d='';pts.forEach(p=>{const v=p.v[k];if(v==null)return;d+=(d?'L':'M')+X(p.t).toFixed(1)+' '+Y(v).toFixed(1)+' ';});svg+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linejoin="round"/>';pts.forEach(p=>{const v=p.v[k];if(v==null)return;svg+='<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.6" fill="'+col+'"/>';});});

  const leg=document.createElement('div');leg.className='cv-legend';sKeys.forEach((k,idx)=>{const col=colors[idx%colors.length];leg.innerHTML+='<span><i style="background:'+col+'"></i>'+esc(k)+'</span>';});wrap.appendChild(leg);

function chartTypesFor(p){

function statBuckets(catKey,range,period){
  const cat=STAT_CATS.find(c=>c.k===catKey); if(!cat) return [];
  const tt={}; cat.panels.forEach(p=>{ if(!(p.table in tt)) tt[p.table]=p; });
  let days=[];
  if(range!=='all'){ const n=Math.max(1,parseInt(range,10)||30); const t=today(); for(let i=n-1;i>=0;i--) days.push(addDays(t,-i)); }
  else {
    let min=null;
    for(const tb in tt){ const p=tt[tb]; for(const r of live(S[tb]||[])){
      let ds=null;
      if(p.dayFn){ ds=p.dayFn(r); }
      else { const d=parseD(r[p.time]); if(d&&!isNaN(d)) ds=dstr(d); }
      if(ds){ if(min==null||ds<min) min=ds; }
    } }
    if(min==null) return [];
    let cur=min, last=today(), guard=0;
    while(cur<=last && guard++<400){ days.push(cur); cur=addDays(cur,1); }
    days=days.slice(-366);
  }
  if(!days.length) return [];
  if(period==='day') return days.map(d=>({key:d,label:d.slice(5),days:[d]}));
  if(period==='week'){
    const groups=[]; for(let i=0;i<days.length;i+=7) groups.push(days.slice(i,i+7));
    return groups.map(g=>({key:g[0],label:g[0].slice(5),days:g}));
  }
  const map={}, order=[];
  days.forEach(d=>{ const mk=d.slice(0,7); if(!(mk in map)){map[mk]=[];order.push(mk);} map[mk].push(d); });
  return order.map(mk=>({key:mk,label:mk,days:map[mk]}));
}

function statRecDay(p,r){
  if(p.dayFn) return p.dayFn(r);
  const d=parseD(r[p.time]);
  return (d&&!isNaN(d))?dstr(d):null;
}
function statRecVal(p,r){
  if(p.valFn) return p.valFn(r);
  if(p.agg==='sum'){ const v=+r[p.field]; return isNaN(v)?0:v; }
  return 1;
}
function statBucket(p,buckets){
  if(!buckets.length) return {};
  const recs=p.filter?live(S[p.table]||[]).filter(p.filter):live(S[p.table]||[]);
  const dayToBucket={}; buckets.forEach(b=>b.days.forEach(d=>dayToBucket[d]=b.key));
  if(p.type==='stacked'){
    const map={}; buckets.forEach(b=>{ map[b.key]={}; });
    for(const r of recs){ const dk=statRecDay(p,r); if(dk==null) continue; const bk=dayToBucket[dk]; if(bk===undefined) continue;
      const c=(p.catFn?p.catFn(r):r[p.stackField]); if(c==null) continue;
      map[bk][c]=(map[bk][c]||0)+statRecVal(p,r); }
    return map;
  }
  const map={}; buckets.forEach(b=>map[b.key]=0);
  for(const r of recs){ const dk=statRecDay(p,r); if(dk==null) continue; const bk=dayToBucket[dk]; if(bk===undefined) continue;
    map[bk]+=statRecVal(p,r);
  }
  return map;
}

function statFrame(W,H){const L=46,R=14,T=14,B=28;const x0=L,x1=W-R,y0=H-B,y1=T;return {L,R,T,B,x0,x1,y0,y1};}
function statGrid(f,max){
  let s='';
  for(let i=0;i<=4;i++){ const yy=f.y1+(f.y0-f.y1)*i/4, val=max-(max)*i/4;
    s+='<line x1="'+f.x0+'" y1="'+yy.toFixed(1)+'" x2="'+f.x1+'" y2="'+yy.toFixed(1)+'" stroke="var(--line)"/>';
    s+='<text x="'+(f.x0-6)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="var(--text-3)">'+Math.round(val)+'</text>';
  }
  return s;
}
function statBarSVG(p,buckets,data){

  const W=Math.max(640,buckets.length*34),H=240,f=statFrame(W,H);
  const bw=Math.min(28,(f.x1-f.x0)/buckets.length*0.66);
  const X=i=>f.x0+(i+0.5)*(f.x1-f.x0)/buckets.length, Y=v=>f.y0-(v/max)*(f.y0-f.y1);
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="min-width:'+W+'px">';
  s+=statGrid(f,max);
  const step=Math.max(1,Math.ceil(buckets.length/9));
  buckets.forEach((b,i)=>{ if(i%step===0||i===buckets.length-1){ s+='<text x="'+X(i).toFixed(1)+'" y="'+(f.y0+16)+'" text-anchor="middle" font-size="10" fill="var(--text-3)">'+b.label+'</text>'; } });
  buckets.forEach((b,i)=>{ const v=vals[i]; if(v<=0)return; const h=Math.max(2,Y(0)-Y(v)); const xx=X(i)-bw/2;
    s+='<g><title>'+b.label+'：'+v+(p.unit||'')+'</title><rect x="'+xx.toFixed(1)+'" y="'+Y(v).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+col+'"/></g>'; });
  s+='</svg>'; return s;
}
function statLineSVG(p,buckets,data){

function statAreaSVG(p,buckets,data){
  const col=tokHex(p.color);

  const W=Math.max(640,buckets.length*34),H=240,f=statFrame(W,H);

function statStackedSVG(p,buckets,data){
  const maxSeries=buckets.map(b=>p.cats.reduce((s,c)=>s+((data[b.key]&&data[b.key][c[0]])||0),0));
  const max=Math.max(1,...maxSeries);
  const W=Math.max(640,buckets.length*34),H=250,f=statFrame(W,H);
  const bw=Math.min(26,(f.x1-f.x0)/buckets.length*0.66);
  const X=i=>f.x0+(i+0.5)*(f.x1-f.x0)/buckets.length;
  const u=(f.y0-f.y1)/max;
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="min-width:'+W+'px">';
  s+=statGrid(f,max);
  const step=Math.max(1,Math.ceil(buckets.length/9));
  buckets.forEach((b,i)=>{ if(i%step===0||i===buckets.length-1){ s+='<text x="'+X(i).toFixed(1)+'" y="'+(f.y0+16)+'" text-anchor="middle" font-size="10" fill="var(--text-3)">'+b.label+'</text>'; } });
  buckets.forEach((b,i)=>{ let acc=0; const xx=X(i)-bw/2; const segs=[]; let tot=0;
    p.cats.forEach(c=>{ const v=(data[b.key]&&data[b.key][c[0]])||0; if(v>0){ const h=v*u; segs.push('<rect x="'+xx.toFixed(1)+'" y="'+(f.y0-acc*u-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+tokHex(c[2])+'"/>'); acc+=v; tot+=v; } });
    if(segs.length) s+='<g><title>'+b.label+'：共 '+tot+' 次</title>'+segs.join('')+'</g>';
  });
  s+='</svg>'; return s;
}
function statArc(cx,cy,r,a0,a1){
  const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
  const large=(a1-a0)>Math.PI?1:0;
  return 'M'+cx.toFixed(1)+' '+cy.toFixed(1)+' L'+x0.toFixed(1)+' '+y0.toFixed(1)+' A'+r+' '+r+' 0 '+large+' 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+' Z';
}
function statPieSVG(p,buckets,data){
  let series=[];
  if(p.type==='stacked'){
    const tot={}; p.cats.forEach(c=>tot[c[0]]=0);
    buckets.forEach(b=>p.cats.forEach(c=>tot[c[0]]+=(data[b.key]&&data[b.key][c[0]])||0));
    series=p.cats.map(c=>[c[1],tot[c[0]],tokHex(c[2])]);
  } else {
    series=buckets.map((b,i)=>[b.label,data[b.key]||0,PIE_PAL[i%PIE_PAL.length]]);
  }
  const total=series.reduce((s,x)=>s+x[1],0);
  if(total<=0) return '<div class="note" style="margin-top:2px">该时间段暂无相关记录。</div>';
  const W=380,H=260,cx=110,cy=132,r=88;
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="max-width:100%">';
  let a0=-Math.PI/2;
  series.forEach(seg=>{ if(seg[1]<=0)return; const a1=a0+seg[1]/total*Math.PI*2;
    s+='<path d="'+statArc(cx,cy,r,a0,a1)+'" fill="'+seg[2]+'"><title>'+seg[0]+'：'+seg[1]+'（'+Math.round(seg[1]/total*100)+'%）</title></path>'; a0=a1; });
  s+='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="13" fill="var(--text-2)">合计</text>';
  s+='<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text)">'+total+(p.unit||'')+'</text>';
  let ly=26;
  series.forEach(seg=>{ const pct=Math.round(seg[1]/total*100);
    s+='<rect x="224" y="'+(ly-10)+'" width="11" height="11" rx="2" fill="'+seg[2]+'"/>';
    s+='<text x="240" y="'+ly+'" font-size="11.5" fill="var(--text-2)">'+seg[0]+'：'+seg[1]+'（'+pct+'%）</text>'; ly+=20; });
  s+='</svg>'; return s;
}
function statChartSVG(p,buckets,data,ctype){
  if(ctype==='line') return statLineSVG(p,buckets,data);
  if(ctype==='area') return statAreaSVG(p,buckets,data);
  if(ctype==='stacked') return statStackedSVG(p,buckets,data);
  if(ctype==='pie') return statPieSVG(p,buckets,data);
  return statBarSVG(p,buckets,data);
}
function statSummary(p,buckets,data){
  let total=0,peak=0;
  buckets.forEach(b=>{ let v; if(p.type==='stacked'){ v=p.cats.reduce((s,c)=>s+((data[b.key]&&data[b.key][c[0]])||0),0); } else v=data[b.key]||0; total+=v; if(v>peak)peak=v; });
  const avg=buckets.length?total/buckets.length:0;
  const span = statPeriod==='day' ? (buckets.length+'天') : (statPeriod==='week'?('近'+buckets.length+'周'):('近'+buckets.length+'个月'));
  return '<div class="stat-grid" style="margin:0 0 8px">'
    +'<div class="stat" style="box-shadow:none"><div class="stat-v" style="color:'+tokHex(p.color)+'">'+fmtNum(total)+'</div><div class="stat-l">合计（'+span+'）</div></div>'
    +'<div class="stat" style="box-shadow:none"><div class="stat-v">'+fmtNum(avg,1)+'</div><div class="stat-l">周期均值'+(p.unit||'')+'</div></div>'
    +'<div class="stat" style="box-shadow:none"><div class="stat-v">'+fmtNum(peak)+'</div><div class="stat-l">单周期峰值</div></div>'
    +'</div>';
}

  const standalone=window.navigator.standalone||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
  if(standalone)return;
  if(!('ontouchstart' in window)&&!(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches))return;
  let bar=document.getElementById('installBar');
  if(!bar){ bar=document.createElement('div'); bar.id='installBar'; bar.className='install-bar';
    bar.innerHTML='<div class="ib-txt" id="ibTxt">📲 添加到主屏幕，像 App 一样使用</div><button class="ib-btn" id="ibAdd">添加</button><button class="ib-x" id="ibX">×</button>';
    document.body.appendChild(bar);
  }
  const txt=bar.querySelector('#ibTxt'), add=bar.querySelector('#ibAdd'), x=bar.querySelector('#ibX');
  function showGuide(){ txt.innerHTML='📲 点击浏览器「分享」→「添加到主屏幕」'; }
  if(isIOS)showGuide();
  add.onclick=()=>{ if(window._bip){ window._bip.prompt(); window._bip.userChoice.then(()=>{localStorage.setItem('anb_pwa_hint','1');bar.classList.remove('show');}).catch(()=>{}); } else { showGuide(); } };
  x.onclick=()=>{ localStorage.setItem('anb_pwa_hint','1'); bar.classList.remove('show'); };
  setTimeout(()=>bar.classList.add('show'),1200);
}
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); window._bip=e; });
function initPTR(){
  if(!('ontouchstart' in window))return;
  let startY=0,active=false,moved=0;
  let ptr=document.getElementById('ptr');
  if(!ptr){ ptr=document.createElement('div'); ptr.id='ptr'; ptr.className='ptr'; document.body.appendChild(ptr); }
  window.addEventListener('touchstart',e=>{ if(window.scrollY<=0){startY=e.touches[0].clientY;active=true;moved=0;} },{passive:true});
  window.addEventListener('touchmove',e=>{ if(!active||!CLOUD.enabled)return; const y=e.touches[0].clientY; const d=y-startY; if(d>0&&window.scrollY<=0){ moved=d; ptr.textContent=(d>70?'释放刷新同步':'下拉刷新同步'); ptr.classList.add('show'); } },{passive:true});
  window.addEventListener('touchend',()=>{ if(active&&moved>70&&CLOUD.enabled&&syncStatus.state!=='syncing'){ cloudSyncNow(); haptic(12); } active=false;moved=0; ptr.classList.remove('show'); });
}
boot();

      <b>若看到「大模型调用失败，已切换为离线知识库回答」</b>，气泡下方会显示具体失败原因，请按提示排查：
      <ul style="margin:6px 0 0">
        <li><b>HTTP 401</b>：API Key 无效 / 未填写 / 余额不足。</li>
        <li><b>HTTP 404</b>：模型名不对（接入 DeepSeek 请把模型名填 <span class="kbd">deepseek-v4-flash</span>），或 Base URL 拼错。</li>
        <li><b>HTTP 400</b>：请求参数错误（如该模型不支持「关闭思考模式」）。</li>
        <li><b>网络 / 跨域错误</b>：检查 Base URL 是否正确、服务商是否允许浏览器跨域调用。</li>
      </ul>
    </div>
    <p>所有回答仅供参考，<b>不构成医疗建议</b>；出现发热、抽搐、呼吸困难、精神萎靡等情况，请立即就医或拨打 120。</p>
  </div>

  <h3>4.6 统计 <span class="pill">趋势图表</span></h3>
  <div class="card">
    <p>进入底部「统计」标签，可查阅各类数据的趋势图。所有筛选项均为<b>下拉菜单</b>，点击即可选择，页面更紧凑、手机端不会横向溢出。</p>
    <ul>
      <li><b>数据类型</b>（下拉）：喂奶 / 排泄 / 洗澡 / 抚触 / 睡眠 / 补剂 / 早教 / 生长曲线。</li>
      <li><b>时间范围</b>（下拉）：近 7 天 / 近 30 天 / 近 90 天 / 全部。</li>
      <li><b>统计周期</b>（下拉）：按日 / 按周 / 按月。按周把 7 天合并为一段、按月按自然月聚合，长时段（如近 90 天）用「按月」一眼看清趋势。</li>
      <li><b>图表形式</b>（每个图表下方的下拉）：系统会按数据类型自动匹配最合适的图表，也可手动切换——
        <ul style="margin:6px 0 0">
          <li>单一系列（喂奶次数 / 洗澡 / 抚触 / 补剂 / 奶量）：<b>柱状图、折线图、面积图、饼图（占比）</b>。</li>
          <li>构成类（排泄：小便 / 大便 / 混合；早教：六大领域；睡眠：夜睡 / 小睡时长）：<b>堆叠柱状图、折线图、饼图（构成占比）</b>。</li>

      </li>
    </ul>
    <div class="note">每个图表上方有汇总卡：合计、周期均值、单周期峰值；鼠标悬停（手机长按）可看当日数值。无数据时显示「该时间段暂无相关记录」提示，先去对应模块添加几条即可。</div>
  </div>

    <h3 id="s47">4.7 睡眠记录 <span class="pill">夜睡 / 小睡 / 计时</span></h3>
  <div class="card">
    <p>入口：首页或记录页的「睡眠」卡片。设计原则：<b>手动录入为主、一键计时为辅</b>——适合独自带娃、单手操作的场景。</p>
    <ul>
      <li><b>手动记录</b>：填入睡时间与醒来时间即可；06:00–18:00 之间入睡自动判为「小睡」，其余为「夜睡」，判定错了可手动改。</li>
      <li><b>一键计时</b>：宝宝睡着时点「开始计时」，醒来点结束；未关闭的计时会以<b>活动条</b>形式常驻页面顶部，随时能看到睡了多久。</li>
      <li><b>快捷补录</b>：刚刚 / 15 分钟前 / 30 分钟前 / 还没醒（转计时）/ 自定义。</li>
      <li><b>查看</b>：当日概览（今日已睡 + 时间轴）、日历视图、趋势视图；统计页新增「每日睡眠时长（夜睡 / 小睡堆叠）」与「每日入睡次数」。</li>
      <li><b>建议入睡提醒</b>（可选，设置页开启）：按宝宝作息估算建议入睡时间并提醒。</li>
    </ul>
  </div>

  <h3 id="s48">4.8 宝妈 Care <span class="pill">妈妈的计划 / 状态 / 安全提醒</span></h3>
  <div class="card">
    <p>入口：底部「更多」→ <b>❥(^_-)</b>。这是<b>给妈妈自己</b>的模块——不做宝宝的记录，只回答一件事：<b>「今天，我该吃什么、该动一下什么？」</b></p>
    <ul>
      <li><b>每日计划</b>：饮食给「一条主推 + 一条兜底」（如「手边能抓的高蛋白」；兜底永远是「喝够水就算过」这类最低标准，不是第二任务）；运动给「碎片 5 分钟 × N」（强度口径：<b>能说话，不能唱歌</b>）。</li>
      <li><b>打卡</b>：一次点按即完成，无确认弹窗；点错可撤销——提示条上的「撤销」或列表里再点一下勾，两条路都行，<b>取消也零摩擦</b>。没有「跳过」按钮、没有分母、没有连击——没做的事次日自动消失，<b>零负罪感</b>。</li>
      <li><b>顺手记一下状态</b>：可记心情 / 体力 / 昨晚睡眠 / 身体不适（可只填一项，也可不记——「不记录」永远是合法状态）。记了之后计划会<b>动态调整</b>：状态不好自动降负荷，完成 1 项即回档一级。</li>
      <li><b>42 天复查问询</b>：首次使用会问「42 天复查做了吗」（未做 / 正常 / 有点小问题）——这是运动建议的准入闸门：没做复查前只给呼吸、走动类最轻的活动，饮食不受影响；复查正常后解锁完整运动计划。</li>
      <li><b>安全红线层</b>：状态备注里写下危险信号（如出血异常、剧烈头痛、胸闷气短、情绪危机等）会被自动识别——出现<b>红色危重卡</b>置顶（不可关闭）+ 就医引导 + 导航「!」徽标，计划同步锁定。<b>提示会清楚直说，不含糊也不恐吓</b>；这不是诊断，只是提醒，身体的感觉你自己最清楚。</li>
    </ul>
    <div class="note blue">妈妈的数据（计划与状态）同样参与家人共享与云同步；<b>本模块所有内容仅供参考，不构成医疗建议</b>，如有不适请及时就医。</div>
  </div>

  <h3 id="s49">4.9 摇篮曲 <span class="pill">本地音乐 / 循环播放 / 定时淡出</span></h3>
  <div class="card">
    <p>入口：底部<b>「摇篮曲」</b>页签（第 3 颗）。播放<b>手机里自己的</b>音频——纯本地播放，<b>无在线曲库、不上传</b>，文件只存在本机浏览器，<b>不参与云同步</b>（每台设备各自添加、各自维护歌单）。</p>
    <ul>
      <li><b>添加</b>：点「添加手机里的摇篮曲」，从手机选择 MP3 / M4A / WAV 等音频文件（可多选）。<b>加密格式选不了</b>：QQ音乐 / 网易云 App 内下载的加密文件、Apple Music 订阅曲目受保护，请使用普通音频文件。</li>
      <li><b>循环</b>：单曲循环 / 列表循环一键切换；列表循环播完自动接下一首。</li>
      <li><b>哄睡定时</b>：设定 15 / 30 / 45 / 60 分钟后<b>音量渐弱自动停止</b>（iPhone 系统限制网页不能调音量，会到点直接停止）。</li>
      <li><b>记住歌单</b>：文件存入本机浏览器，选过一次以后打开即播，无需重选。建议把本站<b>添加到主屏幕</b>当 APP 使用。</li>
      <li><b>熄屏</b>：安卓熄屏继续播放、通知栏可控制；<b>iPhone 熄屏后系统会暂停</b>（平台限制），解锁后点播放即可继续。</li>
      <li>微信内选歌可能受限，建议用系统浏览器打开；删除歌单只影响本设备。</li>
    </ul>
  </div>

  <h2 id="s5">五、家人共享与云同步</h2>
  <div class="card">
    <p>云同步<b>默认已开启并在后台自动运行</b>——云端地址、访问密钥、房间口令等技术参数<b>已内置在页面中</b>（家庭自建服务器，境内直连，不经过任何第三方平台）。家人设备<b>无需任何配置</b>：打开线上地址即自动接入同一份数据，日常界面上<b>不会出现任何技术设置项</b>。</p>
    <div class="note">顶栏与「设置 → 高级设置」会显示<b>同步状态圆点</b>：绿点=已同步·N 秒前，蓝点闪烁=同步中，橙点=离线（恢复网络后自动重试），红点=异常（将自动重试；此时设置页会<b>自动浮出提示卡片</b>）。手机端在列表顶部下拉即可手动触发同步。</div>
    <h3>家人如何接入</h3>
    <ol class="steps">
      <li><b>正常情况：无需任何操作</b>。家人用手机打开部署地址、填好同一套共享参数即接入同一份数据。建议用系统浏览器（Safari / Chrome）打开；若在微信里打开后无法显示，页面会自动弹出「在浏览器打开」引导遮罩，点右上角 <b>··· → 在浏览器打开</b> 即可。自托管域名完成 ICP 备案后即可支持微信内直接打开。</li>
      <li><b>换新手机 / 新家人首次接入</b>：用「设置与备份 → 高级设置 → 云同步与数据接口」里的<b>「生成邀请二维码（家人扫码加入）」</b>发给家人扫码（请使用线上 https 地址生成，本地地址生成的链接家人无法打开）；也可在高级设置里填入<b>同一个房间口令</b>（创建者提供），即加入同一房间。</li>
      <li>加入后本机数据会被清空，并自动拉取家人已记录的数据；之后约每 60 秒准实时同步。</li>
    </ol>
    <p>也可手动：家人自己到「设置与备份 → 高级设置 → 云同步」填入<b>同一个房间口令</b>（创建者提供），即加入同一房间。</p>
    <div class="note warn"><b>手动同步需先确认（v1.6 沿用）：</b>在「设置与备份 → 高级设置 → 云同步」点任意同步按钮时，会先弹出<b>确认与冲突预览</b>面板：逐表列出本地与云端的记录数，对不一致处标红「K 处差异」；检测到冲突时给出红色警示，云端取不到时给黄色提示。确认后才会真正执行，避免误覆盖家人的数据。</div>
    <h3>五个同步按钮的区别</h3>
    <div class="card">
      <table>
        <tr><th>按钮</th><th>什么时候用</th><th>对本地的影响</th><th>对云端的影响</th></tr>
        <tr><td>保存配置并同步</td><td>在「高级设置 → 云同步与数据接口」中保存云端地址与房间口令（地址/密钥已内置预填，通常只在换设备时用到）</td><td><b>默认以云端为准覆盖本地</b>：若云端已有家人数据，直接采用（丢弃本机）；仅当云端为空（本机是房间首位）才保留本机种子数据并推上去</td><td>云端为空时把本机种子数据推上去</td></tr>
        <tr><td>双向合并同步</td><td>日常最常用；想「收发两端改动」时</td><td>云端较新的记录会合并进来，本地较新的记录保留</td><td>本地较新的记录会推上去，云端较新的记录保留</td></tr>
        <tr><td>上传本地到云端</td><td>本机刚录了一堆数据，想立刻让家人看到</td><td>不变</td><td>以本机为准覆盖云端</td></tr>
        <tr><td>同步云端到本地</td><td>本机数据较旧，想收家人的新记录</td><td>云端较新的记录合并进来；本地独有的记录保留</td><td>不变</td></tr>
        <tr><td>以本地为准覆盖云端</td><td>本机数据最全，想把本机状态<b>推广给所有家人设备</b></td><td>不变</td><td><b>完全替换为本地内容</b>；云端独有的记录（可能是家人录入的）会被删除</td></tr>
        <tr><td>以云端为准覆盖本地</td><td>本机数据乱了 / 想完全回退到云端</td><td><b>完全替换为云端内容</b>；本地独有的记录会被删除</td><td>不变</td></tr>
      </table>
    </div>
    <div class="note blue">
      <b>数据范围：</b>同一房间内的喂养、排泄、补剂、疫苗、生长、早教等所有记录共享同步。<br>
      <b>退出 / 更换：</b>关闭「开启云同步」即退回纯本机存储；修改房间口令会切换到另一个房间（旧房间数据仍在云端，互不干扰）。
    </div>
    <div class="note warn">房间口令相当于共享钥匙，只发给可信家人。AI 的 API Key 也会随设置同步到同一房间，留意不要与不信任的人共享。</div>
    <h3>删除记录与云端清理</h3>
    <ul>
      <li><b>日常删除</b>：在「记录」页点任意一条记录 → 点「删除」。记录会被标记为「已删除」并同步给家人设备，界面上不再显示，但短期内仍保留在云端数据中以便误删恢复。</li>
      <li><b>彻底清理</b>：若确定某条记录不再需要（例如截图中 8 月 30 日的错误喂奶记录），可在「设置与备份 → 高级设置 → 云同步」中点<b>「清理已删除记录」</b>。该功能会把本地和云端中所有标记为已删除的记录<b>永久移除</b>，所有家人设备同步后也会彻底消失。</li>
      <li><b>为什么之前删不掉？</b>旧版本对日常照护记录采用「硬删除」，但云端仍保留旧副本，同步时会把云端记录重新合并回来。v1.8 起改为<b>软删除 + 合并优先</b>：删除标记会覆盖云端旧记录，因此删除后不再复活；再配合「清理已删除记录」即可从云端永久清除。</li>
    </ul>
  </div>

  <h2 id="s6">六、数据安全与备份</h2>
  <div class="card">
    <p>无论是否开启云同步，都建议<b>定期导出备份</b>（换设备 / 清缓存前必做）。备份入口在「设置与备份」底部。</p>
    <table>
      <tr><th>操作</th><th>说明</th></tr>
      <tr><td>导出 JSON 备份</td><td>完整备份全部数据，<b>建议定期执行</b>。导入时<b>不限条数</b>。</td></tr>
      <tr><td>导入恢复</td><td>选择本工作台导出的 JSON 文件恢复；会合并 / 覆盖本地数据，请先确认。</td></tr>
      <tr><td>导出 CSV 表格</td><td>导出结构化表格，便于在 Excel / 表格软件查看或打印月报。</td></tr>
      <tr><td>清理已删除记录</td><td>永久删除本地与云端中所有标记为「已删除」的记录（如误录入的 8 月 30 日记录），并同步到所有家人设备。<b>不可恢复</b>，操作前建议先导出 JSON。</td></tr>
      <tr><td>清空全部数据</td><td>删除宝宝的全部记录；若已开启云同步，会同步清空该房间在云端的所有记录（所有共享成员设备上的数据也会被清空）。<b>二次确认、不可撤销</b>，操作前务必先导出 JSON。</td></tr>
    </table>
    <div class="note">当本地数据累计到 30 条时，顶部会温和提示「数据已积累 30 条，建议导出备份」。</div>
  </div>

  <div class="card">
    <h3>宝宝信息（内置，只读）</h3>

      <li>性别用于 WHO 生长曲线参照；出生日期用于疫苗与儿保节点推算。如需更改，请联系创建者修改应用源码。</li>

  <h2 id="s8">八、常见问题 FAQ</h2>
  <div class="card">
    <p><b>Q：微信里打不开 / 显示空白？</b><br>A：微信内置浏览器对本地 HTML 支持差。请用系统浏览器（Safari / Chrome）打开线上链接，或「用浏览器打开」。</p>
    <p><b>Q：数据会丢吗？</b><br>A：数据存在浏览器本地。清缓存、卸载浏览器、换设备会丢。请定期「导出 JSON 备份」，或开启云同步做双保险。</p>
    <p><b>Q：家人看不到我的记录？</b><br>A：双方需开启云同步且填<b>同一个房间口令</b>；约 60 秒同步一次，稍等片刻或重进页面。</p>
    <p><b>Q：AI 问答一直提示「调用失败」？</b><br>A：见第四节 4.5 的失败原因对照表，按状态码（401/404/网络）逐项核对 Key、模型名、Base URL。</p>
    <p><b>Q：能离线用吗？</b><br>A：能。默认知识库问答完全离线；记录、曲线、备份均不依赖网络。仅「开启大模型」和「云同步」需要联网。</p>
